# Overlay: the counting origin C10 and C11 proxy to (issue #228).
#
#     docker compose -f deploy/compose/docker-compose.yml \
#                    -f tests/cluster-chaos/compose/proxy-origin.overlay.yml up
#
# C10 and C11 both assert on *how many* upstream calls the fleet made — "a
# proxyOnce signature freezes the origin once it is Recorded", "one origin call
# per chargeable fire". Asserting that needs something that counts requests, and
# counts them exactly.
#
# So the origin is a fourth `rift-cluster-server`, run **un-clustered**, whose
# imposter is what the fleet's proxy stubs forward to. Its Mountebank-compatible
# admin API then hands the harness the counter for free: `GET /imposters/6810`
# reports `numberOfRequests` and, with `recordRequests` on, the per-path
# `savedRequests` those scenarios diff across a window. The bound becomes an
# equality against a first-class API value instead of a log scrape.
#
# A rift container rather than a tiny static-file image, deliberately: this tier
# pins its images (`toxiproxy`, `envoy`) by digest, and adding a public image
# means adding a digest to pin, review and rotate — a new supply-chain surface
# to serve a counter the binary already in this repo publishes. The origin also
# gains, for nothing, the ability to hold a response open (`behaviors.wait`),
# which is what keeps C10's claims Pending while it kills their owners.
#
# Un-clustered is not incidental either. The origin must be a plain HTTP host
# the fleet proxies *to*, entirely outside the replicated log — a fourth voter
# would change the quorum arithmetic these scenarios depend on, and C10 kills a
# leader.
#
# Its healthcheck targets the admin API rather than `/readyz`: the probe
# listener is bound by the clustered composition only, so an un-clustered node
# has no 2526 to answer and the image's default healthcheck would report it
# permanently unhealthy.
#
# 46525 is **inside** Linux's ephemeral source-port range (32768-60999) and so
# must be listed in the `ip_local_reserved_ports` step both workflows run;
# `ci_reserves_every_published_port_that_linux_could_hand_out` fails the build if
# it is not.
#
# 172.28.7.20 keeps it clear of the nodes' .11/.12/.13 on the same fixed subnet;
# the fleet reaches it by service name (`http://proxy-origin:6810`) through
# Docker's embedded DNS, because a proxy target is replicated state and must be
# reachable from every node rather than only from the harness's side.

services:
  proxy-origin:
    # The same tag the fleet runs, which is the point: this service is a rift
    # node acting as an upstream origin, and the comment below says it must be
    # the same production stage the fleet is. Naming the tag makes that literal
    # — one image, not two builds of the same stage that could diverge — and it
    # is the tag `cluster-smoke` prebuilds (D-58).
    image: "${RIFT_CLUSTER_IMAGE:-rift-cluster-server:local}"
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      # Pinned for the same reason the base compose pins it: an untargeted
      # build takes whichever stage happens to be last in the Dockerfile, and
      # which one that is has changed under these files before (#228, #552).
      # The origin must be the same production stage as the fleet it counts for.
      target: runtime
      args:
        RIFT_UPSTREAM_VERSION: "${RIFT_UPSTREAM_VERSION:-}"
    container_name: proxy-origin
    hostname: proxy-origin
    networks:
      rift:
        ipv4_address: 172.28.7.20
    ports:
      - "46525:2525"   # admin API -- where the upstream counter is read
    healthcheck:
      test: ["CMD", "rift-cluster-server", "healthcheck", "--url", "http://127.0.0.1:2525/imposters"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
