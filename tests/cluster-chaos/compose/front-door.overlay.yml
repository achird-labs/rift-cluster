# Overlay: bind and publish the clustered front door (issue #131) on every
# node, for the container-tier proof that a route write (C17) and a route
# table (C18) survive real process death the way an imposter config already
# does.
#
#     docker compose -f deploy/compose/docker-compose.yml \
#                    -f tests/cluster-chaos/compose/front-door.overlay.yml up
#
# Not in the shipped base file for the same reason `flow-state.overlay.yml`
# isn't: `--front-door` is a real operator choice (it opens a listener that
# dispatches to whatever the route table names), and the base file is read as
# the reference deployment. On here, and only here, for the two scenarios
# that need a bound listener on every node to dispatch through.
#
# All three nodes, not one: C17 and C18 both assert real dispatch through
# nodes that never received the admin write directly — that is the whole
# point of "converges" and "survives a restart" — so a route applied on
# rift-1 has to be servable through rift-2's and rift-3's own front doors,
# which means each needs its own bound listener.
#
# Container port 2527 (adjacent to the base file's 2525/2526/4790/9090, and
# picked to stay clear of all of them) on every node; host ports follow the
# base file's 1xxxx/2xxxx/3xxxx-per-node convention. 12527/22527/32527 are
# all below Linux's 32768 ephemeral-source-port floor, so — unlike
# `flow-state.overlay.yml`'s 36400 — none of them need a
# `net.ipv4.ip_local_reserved_ports` entry; `ci_reserves_every_published_port_that_linux_could_hand_out`
# is what would catch it if that arithmetic were wrong.
#
# Imposter data ports are deliberately NOT published here: the front door
# dispatches to them in-process (`dispatch_to_port` against the local
# `ImposterManager`, never a socket — including on a node whose own explicit
# bind failed, per RFC-001 §7.4.6 and issue #143 — so every assertion goes
# through the front-door port and never touches an imposter port directly.

services:
  rift-1:
    environment:
      RIFT_FRONT_DOOR: "0.0.0.0:2527"
    ports:
      - "12527:2527"
  rift-2:
    environment:
      RIFT_FRONT_DOOR: "0.0.0.0:2527"
    ports:
      - "22527:2527"
  rift-3:
    environment:
      RIFT_FRONT_DOOR: "0.0.0.0:2527"
    ports:
      - "32527:2527"
