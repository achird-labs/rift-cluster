name: Release

# The console-bearing build (RFC-006 §7 option D, issue #186), and the lane that publishes it
# (#266).
#
# A lane of its own, not a job in `ci.yml`, because `console-release` below is the ONLY place
# `--features console` is ever enabled. That feature makes `web/dist/` a compile-time requirement, so
# enabling it anywhere on the PR path would make every ordinary build depend on a `pnpm build` having
# run first — which is exactly the hermeticity RFC-006 §7 rejected options A and B to avoid.
#
# **Two modes, and the difference is the trigger.**
#
#   `workflow_dispatch` — build and verify everything, publish nothing. This is the old behaviour of
#                         the lane, kept as the dry run, and it is what proves the pipeline on a
#                         branch without minting an artifact anybody can pull.
#   `push: tags/v*`     — the same verification, and then publish.
#
# That split is mechanical rather than a pile of `if:` conditions: `guard` runs only on a tag, every
# publishing job `needs:` it, and a skipped dependency skips its dependents. There is no path on
# which a dispatch run pushes anything, because on a dispatch the guard never produced a version for
# it to push under.
#
# **Nothing publishes on an unverified build.** Every publishing job also needs `console-release`,
# which is where `check-console-embed.sh` proves the bundle is genuinely inside the binary. A red
# verification cannot be followed by a green push.
#
# **And nothing discoverable survives a red smoke** (#296). The GitHub Release, the binary
# tarballs, the chart and `:latest` all sit behind `image-manifest`, whose smoke steps pull the
# published tag back and prove it serves; `:latest` is promoted only after they pass. The one
# deliberate exception is the version tag itself: it must exist before the quick-start smoke can
# pull it (`cluster.yml` is verified as written), so a red run can leave `vX.Y.Z` on GHCR — but
# that run is red, nothing else ships, and re-running the fixed release re-points the same tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default. The two capabilities that can write are granted per-job, to the jobs that
# need them and nowhere else: `packages: write` to push the image, `contents: write` to create the
# Release. A workflow-wide grant would hand both to every step in the lane, including the ones that
# run third-party actions over the checkout.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/achird-labs/rift-cluster-server
  WASM_PACK_VERSION: v0.13.1

jobs:
  # ---------------------------------------------------------------------------
  # Tag ↔ version guard
  # ---------------------------------------------------------------------------
  # Fails fast, before anything is built, when the tag and the workspace disagree. Cutting `v0.2.0`
  # on a tree that still says `0.1.0` would otherwise publish an image and a Release whose contents
  # report a different version than their name — discoverable only by someone running `--version` on
  # the artifact they already trusted.
  #
  # Its `if:` is also the mode switch for the whole lane (see the header).
  guard:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match the workspace version
        id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # A prerelease tag keeps the workspace version and adds a suffix: `v0.1.0-rc.1` is a
          # candidate FOR 0.1.0, so it is compared on its release core. This is what lets the full
          # publish path be proven once without first bumping the workspace to a version that was
          # never released.
          core="${tag%%-*}"
          declared="$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                      { in_section = 0 }
            in_section && /^version[[:space:]]*=/ {
              gsub(/[",[:space:]]/, ""); sub(/version=/, ""); print; exit
            }' Cargo.toml)"

          if [ -z "$declared" ]; then
            echo "could not read [workspace.package] version from Cargo.toml" >&2
            exit 1
          fi
          if [ "$core" != "$declared" ]; then
            echo "tag/version mismatch: tag ${GITHUB_REF_NAME} implies ${core}, Cargo.toml says ${declared}" >&2
            exit 1
          fi

          echo "version=${tag}" >> "$GITHUB_OUTPUT"
          # `latest` and a non-prerelease GitHub Release are for real releases only. Pointing
          # `latest` at an rc is how someone who typed no tag at all ends up running one.
          if [ "$tag" = "$core" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag ${GITHUB_REF_NAME} matches workspace ${declared}"

  # ---------------------------------------------------------------------------
  # Verification — the gate everything else hangs off
  # ---------------------------------------------------------------------------
  console-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The console's advisory lint pane (RFC-006 §12 Q1, issue #188): `rift-lint` compiled to wasm.
      #
      # Built HERE and nowhere else. `crates/rift-lint-wasm` is excluded from the root workspace
      # precisely so no PR lane needs a wasm toolchain, and `web/` is written to work without the
      # artifact — `lint.ts` resolves `"unavailable"` and the pane says the server still validates
      # every save. So this step adds a capability to the release build; it does not gate it.
      #
      # Pinned, and installed from the release tarball rather than a third-party action: this puts
      # a binary on a lane that produces a shipped artifact.
      - name: Install wasm-pack (pinned)
        run: |
          set -euo pipefail
          asset="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/${asset}.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin "${asset}/wasm-pack"
          wasm-pack --version

      - name: Compile rift-lint to wasm for the console
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          # `--out-dir` is relative to the crate. `web/public/` is copied verbatim into `dist/` and
          # the console is served under `/console/`, so this lands at the URL `lint.ts` imports:
          # `/console/lint/rift_lint_wasm.js`. `--no-pack` skips the npm package.json (and the
          # `.gitignore` beside it) that nothing here consumes.
          wasm-pack build crates/rift-lint-wasm \
            --release --target web --no-pack \
            --out-dir ../../web/public/lint --out-name rift_lint_wasm
          # Fail loudly rather than shipping a console whose lint pane is permanently "unavailable"
          # because the artifact was written somewhere else.
          test -f web/public/lint/rift_lint_wasm.js
          test -f web/public/lint/rift_lint_wasm_bg.wasm
          scripts/prune-wasm-out.sh web/public/lint

      # Order matters and is the whole point of the lane: the bundle must exist before cargo runs,
      # because `rust-embed` resolves `web/dist/` at compile time. It must also come after the wasm
      # step above, since `pnpm build` is what copies `web/public/` into `dist/`.
      - name: Build the console bundle
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Checked BEFORE the real build, while a failure is still cheap and unambiguous: with the
      # bundle moved aside, `--features console` must not compile. This is the guard that stops a
      # release silently shipping consoleless, so it is verified on the lane that would ship it
      # rather than assumed from rust-embed's documented behaviour.
      - name: A console build without the bundle must fail to compile
        run: scripts/check-console-embed.sh missing-dist

      - name: Build the release binary with the console
        run: cargo build -p rift-cluster-server --release --features console

      # "Air-gapped" as something demonstrated rather than read off the CSP. In a *debug* build
      # rust-embed reads assets from disk by design (the reason it was chosen over include_dir), so
      # only the release artifact can show the bytes are actually inside the binary.
      - name: The binary really embeds the bundle
        run: scripts/check-console-embed.sh embedded target/release/rift-cluster-server

      # `--release` is not incidental: it is the only profile in which rust-embed embeds rather than
      # reading from disk, so this is the console served the way an operator will get it.
      - name: Console serving tests against the embedded assets
        run: cargo test -p rift-cluster-server --release --features console --lib --test console

  # ---------------------------------------------------------------------------
  # Container image → GHCR
  # ---------------------------------------------------------------------------
  # One job per architecture on a NATIVE runner, then a manifest merge. Deliberately not QEMU: an
  # emulated Rust release build of this workspace is a multi-hour proposition and the first thing
  # that would be quietly dropped the next time the lane got slow.
  #
  # Each job pushes by digest only — no tag. Tags are applied once, by `image-manifest`, so there is
  # no window in which `:latest` resolves to a half-published manifest with one architecture in it.
  image:
    needs: [guard, console-release]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `target` is the Dockerfile stage; `flavor` names the digest artifact and cache scope
          # so `image-manifest` can tell the two sets apart. The tag suffix itself lives in
          # `image-manifest`, which owns tagging entirely. Two flavors (#270): the
          # default `debian-slim`-based runtime (unchanged), and `-static`, a `FROM scratch` musl
          # build with no OS at all — see `deploy/Dockerfile`'s header comment and
          # `deploy/README.md`'s image-flavors table for what each carries and gives up.
          - runner: ubuntu-latest
            platform: linux/amd64
            flavor: default
            target: runtime
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            flavor: default
            target: runtime
          - runner: ubuntu-latest
            platform: linux/amd64
            flavor: static
            target: runtime-static
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            flavor: static
            target: runtime-static
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The image build discovers nothing about git — `.dockerignore` excludes `.git`, and a
      # submodule's `.git` is only a pointer into the parent's object store anyway. So the pin is
      # read here and passed in, which is what keeps the published banner from saying `rift unknown`.
      - name: Read the upstream pin
        id: pin
        run: echo "version=$(git -C vendor/rift describe --tags --always)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: |
            RIFT_UPSTREAM_VERSION=${{ steps.pin.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per platform AND per flavor. `runtime` and `runtime-static` diverge from
          # `builder` onward (musl target, different apt packages), so a scope shared across
          # flavors would let one flavor's layers evict the other's on every push — turning a
          # cache that should always hit into one that flips a coin.
          cache-from: type=gha,scope=${{ matrix.platform }}-${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}-${{ matrix.flavor }}

      # The digest is the only thing this job produces that the merge needs. Passed as a file named
      # after itself rather than as an output, because outputs cannot be collected across a matrix.
      # The `sha256:` prefix is stripped here and re-added by the `printf` in
      # `image-manifest`, which is not a round-trip for its own sake: the action's
      # `digest` output is `sha256:<hex>`, so touching it verbatim produced a file
      # named `sha256:<hex>` and the manifest step's `@sha256:%s` then built
      # `…@sha256:sha256:<hex>` — an invalid reference `imagetools create` refuses.
      # This never surfaced because `image-manifest` has never actually run: it is
      # `needs: [guard, image]`, and every release run so far skipped both. #270 is
      # the first change to depend on it (twice — the `-static` tag its smoke,
      # no-git and Trivy gates all pull is created there), so it had to be fixed
      # rather than inherited.
      - name: Export the digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      # Named per flavor, not just per job-index. `image-manifest` builds TWO separate manifest
      # lists, one per flavor, and downloads its inputs with `pattern: digest-<flavor>-*` into a
      # per-flavor directory. A flat `digest-${{ strategy.job-index }}` name (the old scheme, fine
      # when there was one flavor) would let `download-artifact`'s `merge-multiple: true` fuse all
      # four digests into one directory with no way to tell which two belong to which flavor —
      # silently producing a manifest list that mixes a `runtime` digest with a `runtime-static`
      # one under a single tag.
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.flavor }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  image-manifest:
    needs: [guard, image]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      # For `deploy/compose/cluster.yml` and `verify-pulled.sh`, which the quick-start
      # smoke below runs. No submodules: that script reads two compose files and the
      # workspace version, and builds nothing.
      - uses: actions/checkout@v4

      # Two directories, not one — see the `image` job's digest-naming comment. A flat
      # `pattern: digest-*` + `merge-multiple: true` here would fuse both flavors' digests into
      # one directory, and the manifest built from it would mix a `runtime` digest with a
      # `runtime-static` one under a single tag.
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/default
          pattern: digest-default-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/static
          pattern: digest-static-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version tag only. `:latest` is deliberately NOT applied here — it is promoted at the
      # end of this job, after the smoke steps have proven the tag actually serves (#296). The
      # version tag itself cannot wait: the smokes pull the image by it.
      - name: Create the manifest list (default flavor)
        working-directory: /tmp/digests/default
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "${IMAGE}:${{ needs.guard.outputs.version }}" \
            $(printf "${IMAGE}@sha256:%s " *)

      # Same shape and the same discipline as the default flavor above: the version tag now
      # because the static smokes pull by it, and `latest-static` only at the end of the job once
      # they have passed (#296's rule applies per flavor — a discoverable tag must not survive a
      # red smoke, and `-static` has its own smokes). `latest-static` rather than hijacking
      # `latest`, so an implicit pull never silently switches flavor.
      - name: Create the manifest list (static flavor)
        working-directory: /tmp/digests/static
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "${IMAGE}:${{ needs.guard.outputs.version }}-static" \
            $(printf "${IMAGE}@sha256:%s " *)

      # The published artifact, exercised as an operator would get it — pulled by tag, not the local
      # build cache. `--version` proves the upstream pin survived the build args, and `/console`
      # proves E1's whole point actually shipped. A publish lane that pushed a consoleless image and
      # said nothing is precisely what this step exists to prevent.
      - name: Smoke the published image
        run: |
          set -euo pipefail
          ref="${IMAGE}:${{ needs.guard.outputs.version }}"
          docker pull "$ref"

          echo "--- version ---"
          banner="$(docker run --rm "$ref" --version)"
          echo "$banner"
          case "$banner" in
            *"rift unknown"*) echo "FAIL: published image does not carry the upstream pin" >&2; exit 1 ;;
          esac

          echo "--- console ---"
          docker run -d --name smoke -p 12525:2525 \
            -e RIFT_CLUSTER=true \
            -e RIFT_CLUSTER_BIND=0.0.0.0:4790 \
            -e RIFT_CLUSTER_BIND_PUBLIC_OK=true \
            -e RIFT_CLUSTER_ADVERTISE=127.0.0.1:4790 \
            -e RIFT_CLUSTER_ALLOW_SOLO=true \
            -e RIFT_CLUSTER_SECRET=smoke \
            -e RIFT_CLUSTER_PROBE_BIND=0.0.0.0:2526 \
            -e RIFT_CLUSTER_STATE_DIR=/var/lib/rift/_cluster \
            "$ref"
          trap 'docker logs smoke || true; docker rm -f smoke >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:12525/console/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
          # Asserted on the SPA shell, not the status: `rust-embed` over an empty `web/dist`
          # compiles happily and answers with an explanatory body, which a status-only check would
          # accept. Same reasoning as `deploy/compose/verify.sh`.
          body="$(curl -fsS --max-time 5 http://127.0.0.1:12525/console/)"
          case "$body" in
            *'<div id="root"'*) echo "PASS: published image serves the console" ;;
            *) echo "FAIL: published image served no console SPA shell" >&2; exit 1 ;;
          esac

      # The static flavor's own smoke, against the real published artifact (#270). Same shape as
      # the default-flavor smoke above — `--version`, boot, `/console` — plus the two assertions
      # that are the whole point of publishing a second flavor: the git-capability WARN actually
      # fires, and the image really has no git in it (checked in the next two steps, since neither
      # needs a running container).
      #
      # Distinct container name (`smoke-static`, not `smoke`) and distinct host ports (`22525`/
      # `22526`, not `12525`/`12526`): the step above already tore its own container down via its
      # `trap` by the time this one starts, but a port collision here would fail this step for a
      # reason that has nothing to do with the static flavor — the exact hazard the `trap` on the
      # quick-start step below is also there to avoid.
      - name: Smoke the published image (static flavor)
        run: |
          set -euo pipefail
          ref="${IMAGE}:${{ needs.guard.outputs.version }}-static"
          docker pull "$ref"

          echo "--- version ---"
          banner="$(docker run --rm "$ref" --version)"
          echo "$banner"
          case "$banner" in
            *"rift unknown"*) echo "FAIL: published static image does not carry the upstream pin" >&2; exit 1 ;;
          esac

          echo "--- console ---"
          docker run -d --name smoke-static -p 22525:2525 \
            -e RIFT_CLUSTER=true \
            -e RIFT_CLUSTER_BIND=0.0.0.0:4790 \
            -e RIFT_CLUSTER_BIND_PUBLIC_OK=true \
            -e RIFT_CLUSTER_ADVERTISE=127.0.0.1:4790 \
            -e RIFT_CLUSTER_ALLOW_SOLO=true \
            -e RIFT_CLUSTER_SECRET=smoke \
            -e RIFT_CLUSTER_PROBE_BIND=0.0.0.0:2526 \
            -e RIFT_CLUSTER_STATE_DIR=/var/lib/rift/_cluster \
            "$ref"
          trap 'docker logs smoke-static || true; docker rm -f smoke-static >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:22525/console/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
          # Same reasoning as the default flavor's console check: asserted on the SPA shell, not
          # the status.
          body="$(curl -fsS --max-time 5 http://127.0.0.1:22525/console/)"
          case "$body" in
            *'<div id="root"'*) echo "PASS: published static image serves the console" ;;
            *) echo "FAIL: published static image served no console SPA shell" >&2; exit 1 ;;
          esac

          echo "--- git capability degraded loudly, not silently ---"
          # The direct proof that #270's capability detection did its job on the REAL published
          # artifact, not just in a unit test: this image has no git (confirmed in the next step),
          # yet it just booted and served `/console` above — which only happens because the
          # missing-git case now logs and continues instead of refusing to start.
          logs="$(docker logs smoke-static 2>&1)"
          case "$logs" in
            *"git not found; git+ imposter sources disabled in this image"*)
              echo "PASS: static image logs the git-capability warning" ;;
            *)
              echo "FAIL: static image did not log the git-capability warning" >&2
              echo "$logs" >&2
              exit 1 ;;
          esac

          echo "--- docker healthcheck reaches healthy (AC1) ---"
          # A distinct code path from the `/console/` curl above: the HEALTHCHECK
          # execs the binary's own `healthcheck` subcommand against /healthz.
          # Without this, a regression in that subcommand — or a scratch image
          # that cannot exec it at all, which is the flavor-specific risk, since
          # there is no shell and no PATH — ships whenever `/console` still
          # answers. AC1 names the healthcheck explicitly, so it is asserted
          # rather than inferred from the container still running.
          health=""
          for _ in $(seq 1 30); do
            health="$(docker inspect -f '{{.State.Health.Status}}' smoke-static 2>/dev/null || echo unknown)"
            [ "$health" = "healthy" ] && break
            [ "$health" = "unhealthy" ] && break
            sleep 2
          done
          if [ "$health" != "healthy" ]; then
            echo "FAIL: static container health is '${health}', expected 'healthy'" >&2
            exit 1
          fi
          echo "PASS: static image reports docker health 'healthy'"

          echo "--- a git+ declaration is refused with the documented text (AC2) ---"
          # The refusal string is quoted verbatim by `deploy/README.md`, by
          # `docs/rift-cluster-server.md` and by this Dockerfile's own comment.
          # Unit tests assert it on a hand-built provider set; nothing until here
          # asserts that the shipped binary in the shipped image actually emits
          # it. `RIFT_IMPOSTERS` takes the boot declaration path, so the failure
          # is the container refusing to start — which is the documented
          # behaviour, hence `|| true` on the run and the assertion on the log.
          set +e
          decl="$(docker run --rm \
            -e RIFT_CLUSTER=true \
            -e RIFT_CLUSTER_BIND=0.0.0.0:4790 \
            -e RIFT_CLUSTER_BIND_PUBLIC_OK=true \
            -e RIFT_CLUSTER_ADVERTISE=127.0.0.1:4790 \
            -e RIFT_CLUSTER_ALLOW_SOLO=true \
            -e RIFT_CLUSTER_SECRET=smoke \
            -e RIFT_CLUSTER_STATE_DIR=/var/lib/rift/_cluster \
            -e 'RIFT_IMPOSTERS=git+https://example.com/repo#main:mocks.json' \
            "$ref" 2>&1)"
          set -e
          echo "$decl"
          case "$decl" in
            *"\`git+https:\` sources are unavailable"*)
              echo "PASS: the shipped static image refuses git+ with the documented refusal" ;;
            *)
              echo "FAIL: the static image did not emit the documented git+ refusal" >&2
              exit 1 ;;
          esac

      # No `docker exec ... sh` here — scratch has no shell, which is the very property under
      # test. `docker create` never starts the container, so this works even though nothing in a
      # scratch-based image can be exec'd into; `export` then materializes its filesystem as a
      # tar stream to grep. Matching `(^|/)git$` rather than a bare `git` substring: it must not
      # false-positive on something like a hypothetical `legit` or `gitignore` entry.
      #
      # `export` and `tar` are separate statements rather than stages of the `if` condition's
      # pipeline, and that is load-bearing rather than style. `set -e` is suspended inside an `if`
      # condition, and `grep` — the rightmost stage — exits 1 both when it matched nothing AND
      # when it got no input because an earlier stage died. So `if docker export | tar | grep`
      # prints PASS when the export fails (stale cid, daemon restart, disk full) exactly as it
      # does when the image genuinely has no git: the gate whose whole job is catching a git
      # binary in the gitless image would be the thing hiding one. Split out, `set -e` aborts on
      # a failed export or tar, and PASS can only be reached when both succeeded and grep looked
      # at a real file list. The file-list line count is echoed for the same reason — a plausible
      # count is the cheap tell that the tar really was read.
      - name: The static image contains no git binary
        run: |
          set -euo pipefail
          ref="${IMAGE}:${{ needs.guard.outputs.version }}-static"
          cid="$(docker create "$ref")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          docker export "$cid" > /tmp/static-rootfs.tar
          tar -tf /tmp/static-rootfs.tar > /tmp/static-rootfs-files.txt
          entries="$(wc -l < /tmp/static-rootfs-files.txt)"
          echo "entries in the static image filesystem: ${entries}"
          # A floor, not decoration: "grep found no git" is only meaningful over
          # a file list that actually describes an image. A degenerate export
          # that yielded two entries would otherwise satisfy the grep below for
          # the wrong reason. The real list is dozens of entries (binary, CA
          # bundle, passwd/group, the data dir); 10 is comfortably under that and
          # comfortably over any truncation.
          if [ "$entries" -lt 10 ]; then
            echo "FAIL: static image exported only ${entries} entries; the export looks truncated" >&2
            exit 1
          fi

          if grep -qE '(^|/)git$' /tmp/static-rootfs-files.txt; then
            echo "FAIL: static image contains a git executable" >&2
            grep -nE '(^|/)git$' /tmp/static-rootfs-files.txt >&2
            exit 1
          fi
          echo "PASS: static image contains no git binary"

      - name: Scan the static image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.guard.outputs.version }}-static
          format: json
          output: /tmp/trivy-static.json
          scanners: vuln
          # Needed to get a package inventory back at all rather than just vulnerability matches:
          # a package with no known CVE would otherwise never appear in the report, which is
          # exactly backwards for a check whose job is counting packages, not vulnerabilities.
          list-all-pkgs: true

      # AC4, checked on the artifact rather than left as a claim in prose. Parses Trivy's own
      # package inventory instead of eyeballing a rendered table — the class of "looks empty,
      # isn't" mistake a machine check exists to catch. Absence of an `os-pkgs` Result entirely
      # (the expected shape for a scratch image with no package database at all) counts as zero,
      # same as a present Result with an empty package list.
      - name: The static image carries zero OS packages (AC4)
        run: |
          set -euo pipefail
          expected="${IMAGE}:${{ needs.guard.outputs.version }}-static"

          # Zero is the answer this gate wants to hear, which is precisely why it must first
          # establish that the answer is about the right artifact. A report that scanned nothing,
          # or scanned some other ref, also says zero — so the count is only trusted after Trivy's
          # own `ArtifactName` is confirmed to be the tag just published.
          actual="$(jq -r '.ArtifactName // empty' /tmp/trivy-static.json)"
          if [ "$actual" != "$expected" ]; then
            echo "FAIL: Trivy report is for '${actual:-<none>}', expected '${expected}'" >&2
            echo "The zero-package count below would be meaningless." >&2
            exit 1
          fi

          os_pkg_count="$(jq '[.Results[]? | select(.Class == "os-pkgs") | (.Packages // [])[]] | length' /tmp/trivy-static.json)"
          echo "OS packages found: ${os_pkg_count} (scanned ${actual})"
          if [ "$os_pkg_count" -ne 0 ]; then
            echo "FAIL: static image carries ${os_pkg_count} OS package(s); expected zero" >&2
            jq '[.Results[]? | select(.Class == "os-pkgs")]' /tmp/trivy-static.json >&2
            exit 1
          fi
          echo "PASS: static image carries zero OS packages"

      # The quick start in `deploy/README.md`, run as written (#269). The step
      # above proves one published container serves a console; this proves the
      # *documented* three-node file actually forms a cluster on the tag that was
      # just pushed — readiness on all three, exactly one leader read from
      # `rift_cluster_members`, and the console on every node.
      #
      # It has to live here and nowhere else. `cluster.yml` names a published
      # image, so no PR lane can run it: before this job the tag does not exist.
      # `verify-pulled.sh --check` covers what is checkable without one, on every
      # PR; this is the half that needs the artifact to be real.
      #
      # The previous step's `trap` has already removed the `smoke` container by
      # the time this shell starts — which matters, because it published 12525
      # and so does `cluster.yml`'s rift-1.
      - name: Smoke the published quick start (3-node cluster.yml)
        run: |
          set -euo pipefail
          version='${{ needs.guard.outputs.version }}'

          if [ '${{ needs.guard.outputs.prerelease }}' = 'true' ]; then
            # An rc publishes `0.1.0-rc.1` while the pin is `0.1.0`, so they cannot
            # match by construction. Pass the tag in — this still proves the image
            # and the topology, just not the literal default.
            echo "prerelease: verifying against ${version} rather than the pin"
            RIFT_CLUSTER_VERSION="$version" deploy/compose/verify-pulled.sh
          else
            # A real release runs it **as written**, with no override, so the tag a
            # reader gets by curling `cluster.yml` is the tag this step pulled.
            # Overriding here would leave the file's own default the one thing the
            # release lane never exercises — and a pin naming a tag that was never
            # pushed fails for the first reader instead of for us.
            pinned="$(sed -n 's|.*rift-cluster-server:\${RIFT_CLUSTER_VERSION:-\([^}]*\)}.*|\1|p' \
              deploy/compose/cluster.yml | head -1)"
            if [ "$pinned" != "$version" ]; then
              echo "cluster.yml pins '${pinned}' but this release publishes '${version}'" >&2
              echo "The documented quick start would fail with 'manifest unknown'." >&2
              exit 1
            fi
            echo "pin ${pinned} matches the published tag; running the quick start as written"
            deploy/compose/verify-pulled.sh
          fi

      # `latest` only for a real release — see the guard's `prerelease` output for why — and only
      # now, after both smokes have passed on the version tag it aliases (#296). An implicit
      # `docker pull` with no tag can therefore never resolve to a build the smokes rejected. The
      # promotion re-points at the already-pushed manifest, so both tags name the same platform
      # manifests and layers.
      #
      # Both flavors are promoted here, together and last. `latest-static` is held to exactly the
      # same rule as `latest` (#270): it aliases a version tag whose own smokes — console, docker
      # health, the git-absent WARN, the documented `git+` refusal, no git binary, zero OS
      # packages — have all passed. Promoting it at manifest-creation time instead would leave a
      # discoverable `latest-static` pointing at a build this job went on to reject, which is the
      # exact failure #296 removed for the default flavor.
      - name: Promote latest
        if: needs.guard.outputs.prerelease == 'false'
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE}:latest" \
            "${IMAGE}:${{ needs.guard.outputs.version }}"
          docker buildx imagetools create -t "${IMAGE}:latest-static" \
            "${IMAGE}:${{ needs.guard.outputs.version }}-static"

  # ---------------------------------------------------------------------------
  # Binaries → GitHub Release
  # ---------------------------------------------------------------------------
  binaries:
    needs: [guard, console-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            wasm_asset: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            wasm_asset: aarch64-unknown-linux-musl
          - runner: macos-latest
            target: aarch64-apple-darwin
            # wasm-pack publishes no aarch64-apple-darwin asset; the x86_64 one runs under Rosetta,
            # which every GitHub arm64 macOS runner has. Checked against the v0.13.1 asset list
            # rather than assumed.
            wasm_asset: x86_64-apple-darwin
          # `macos-15-intel`, not `macos-13`: the older label has been retired from the hosted
          # runner set, and a workflow naming it fails to schedule rather than falling back.
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            wasm_asset: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install wasm-pack (pinned)
        run: |
          set -euo pipefail
          asset="wasm-pack-${WASM_PACK_VERSION}-${{ matrix.wasm_asset }}"
          curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/${asset}.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin "${asset}/wasm-pack"
          wasm-pack --version

      # Same order as `console-release`, and for the same reason: wasm, then bundle, then cargo.
      - name: Build the console bundle
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          wasm-pack build crates/rift-lint-wasm \
            --release --target web --no-pack \
            --out-dir ../../web/public/lint --out-name rift_lint_wasm
          test -f web/public/lint/rift_lint_wasm_bg.wasm
          cd web
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build the binary
        run: cargo build -p rift-cluster-server --release --features console --target ${{ matrix.target }}

      # Run against EVERY matrix binary, not just the x86_64 Linux one. A platform that silently
      # shipped consoleless is exactly the failure this script exists to catch, and checking only one
      # of four would leave three unchecked while reading like coverage.
      - name: The binary really embeds the bundle
        run: scripts/check-console-embed.sh embedded target/${{ matrix.target }}/release/rift-cluster-server

      - name: Package
        id: package
        run: |
          set -euo pipefail
          name="rift-cluster-server-${{ needs.guard.outputs.version }}-${{ matrix.target }}"
          staging="$(mktemp -d)/${name}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/rift-cluster-server" "$staging/"
          cp LICENSE "$staging/"
          # A pointer rather than a copy of README.md: the deploy docs move faster than a release
          # tarball, and a stale copy inside an artifact is worse than a link to the current one.
          cat > "$staging/README" <<EOF
          rift-cluster-server ${{ needs.guard.outputs.version }} (${{ matrix.target }})

          Docs:   https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/rift-cluster-server.md
          Deploy: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/deploy/README.md

          Run \`./rift-cluster-server --help\`, or \`--version\` to see the engine pin this build carries.
          EOF
          tar -czf "${name}.tar.gz" -C "$(dirname "$staging")" "${name}"
          echo "artifact=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: ${{ steps.package.outputs.artifact }}
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Helm chart → GHCR (OCI)
  # ---------------------------------------------------------------------------
  # Needs `image-manifest`, not just the guard: the chart's default `image.tag` is its `appVersion`,
  # so publishing a chart before the image it points at exists would produce a one-command install
  # that pulls a tag nobody can resolve.
  chart:
    needs: [guard, image-manifest]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      # Chart version and app version are both the tag. The chart's committed `version`/`appVersion`
      # are the development values; a published chart that claimed a version other than the tag it
      # was cut from is the same class of lie the tag/version guard exists to prevent.
      - name: Package and push
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          # `--version` takes SemVer without a leading `v`, unlike the image tag.
          semver="${version#v}"
          helm package deploy/helm/rift-cluster \
            --version "$semver" --app-version "$semver" --destination /tmp/chart
          helm push "/tmp/chart/rift-cluster-${semver}.tgz" oci://ghcr.io/achird-labs/charts

  release:
    needs: [guard, binaries, image-manifest, chart]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
          pattern: tarball-*
          merge-multiple: true

      # One checksum file over every tarball, generated where they are all together — the only
      # place it can be correct. Generating it per-matrix-job would produce four files each
      # covering one artifact, which is not what a checksum file is for.
      - name: Checksums
        working-directory: /tmp/artifacts
        run: |
          set -euo pipefail
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the Release
        working-directory: /tmp/artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          {
            echo "## rift-cluster-server ${{ needs.guard.outputs.version }}"
            echo
            echo "Container image:"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${{ needs.guard.outputs.version }}"
            echo '```'
            echo
            echo "The image and every binary below carry the web console at \`/console\`."
            echo
            echo "- [Server docs](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/rift-cluster-server.md)"
            echo "- [Deploying](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/deploy/README.md)"
            echo
            echo "Verify a download against \`SHA256SUMS\`."
          } > "$notes"

          flags=(--title "${{ needs.guard.outputs.version }}" --notes-file "$notes")
          if [ "${{ needs.guard.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}" ./*.tar.gz SHA256SUMS
