name: CI

# THROWAWAY (#602): replaces the whole CI for this draft PR only. Never merges.
# Loops D-22's pin on a GitHub runner, fix arm vs control arm on one binary, and prints the
# victim's snapshot-install duration so D-83 can record a measured CI figure.

on:
  pull_request:

permissions:
  contents: read

jobs:
  loop-602:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the cluster test binary
        run: |
          cargo test -p rift-cluster --test cluster --no-run --message-format=json \
            | grep -o '"executable":"[^"]*"' | cut -d'"' -f4 | grep -v null > bin.txt
          cat bin.txt
      - name: Loop — fix arm (150 ms probe deadline) then control arm (2 s)
        run: |
          BIN=$(head -1 bin.txt)
          for arm in fix control; do
            pass=0; fail=0
            for i in $(seq 1 30); do
              if [ "$arm" = control ]; then export T602_PROBE_DEADLINE_MS=2000; else unset T602_PROBE_DEADLINE_MS; fi
              if T602_INSTALL_TIMING=1 "$BIN" a_restarted_voter_behind_a_purged_log_catches_up_by_snapshot --exact --nocapture > run.log 2>&1; then
                pass=$((pass+1)); r=ok
              else
                fail=$((fail+1)); r=FAIL
              fi
              echo "arm=$arm iter=$i $r $(grep -h 'T602-INSTALL' run.log | tr '\n' ' ') $(grep -h 'ran ahead' run.log | head -1)"
            done
            echo "SUMMARY arm=$arm pass=$pass fail=$fail"
          done
