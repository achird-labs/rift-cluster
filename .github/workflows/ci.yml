name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Guards one invariant the compiler cannot: exactly one copy of
      # `prometheus` in the tree. Two copies means two global registries, and
      # cluster metrics that silently never reach /metrics.
      - name: Single prometheus copy
        run: scripts/check-single-prometheus.sh

      # Cheap, and it runs here rather than in `cluster-smoke` so it is enforced
      # on every PR: `cluster-smoke` is path-filtered, and a quarantine tag can
      # be added by a change that touches nothing it watches.
      - name: Chaos quarantine tags
        run: scripts/chaos-quarantine.sh check

      # Same reasoning, one level up: `cluster-smoke`'s path filter decides
      # whether the chaos tier runs at all, and when it is wrong the tier is
      # skipped and the check goes green having tested nothing. It has to be
      # verified from a job the filter cannot skip — this one.
      - name: cluster-smoke path filter
        run: scripts/cluster-smoke-paths.sh --self-test

      # The third guard on the same door: whether the tier, having run, actually
      # ran anything. libtest exits 0 on a filter that matches nothing, so this
      # is what stands between "the scenarios were skipped" and a green check.
      - name: Empty-run guard
        run: scripts/assert-scenarios-ran.sh --self-test

  # No openraft in `rift-cluster`'s public API — an acceptance criterion of
  # issue #6 that the compiler cannot check. Why it matters, and why the check
  # has no exemptions, is documented in the script itself; this job only
  # supplies the toolchain.
  #
  # Nightly is confined to this one job because rustdoc JSON — the only
  # machine-readable view of a crate's public surface — is nightly-only. The
  # nightly and the cargo-public-api version are pinned so the check is
  # reproducible, not because any specific pair is required. If you bump either,
  # just re-run this job: an incompatibility shows up immediately as a parse
  # error, not as a wrong answer.
  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Nightly is the default toolchain here, so it is what both builds the
      # tool and runs the check.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-public-api
        run: cargo install cargo-public-api --version 0.51.0 --locked

      # The same script a developer can run locally, so what CI checks and what
      # they can check cannot drift.
      - name: No openraft in the public API
        run: scripts/check-public-api.sh

  # The container tier (issue #11): real processes, killed and restarted. Its
  # own job because it needs Docker and takes minutes, and because a container
  # runtime failure must not read as "the code is broken".
  #
  # Only on changes that could plausibly break a cluster — the whole tier costs
  # several minutes, and running it on a README edit trains people to ignore it.
  cluster-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The path filter below diffs against the base commit, which a shallow
          # clone does not have. Without this the diff errors, the filter reads
          # as "nothing changed", and the job goes green having run nothing.
          fetch-depth: 0

      # Runs here as well as in `build` deliberately. `build` and this job are
      # independent — there is no `needs:` — so a broken filter would turn
      # `build` red while THIS job still went green having skipped the tier,
      # which is the failure this whole issue is about. Verifying it inside the
      # job whose greenness depends on it needs no cross-job coordination.
      - name: Verify the path filter before trusting it
        run: scripts/cluster-smoke-paths.sh --self-test

      - name: Which paths changed
        id: changed
        run: |
          # A filter that fails *open into skipping* is worse than no filter: it
          # is a green check that tested nothing. `set -e` makes a broken diff
          # fail the job instead.
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          # `core.quotePath=false`: git otherwise renders a non-ASCII path as
          # "caf\303\251.md", quotes included, and the leading quote defeats
          # both the `^` prefix anchor and the whole-line match.
          # `--no-renames`: a rename reports only the destination, so moving a
          # file OUT of a watched directory would read as "cluster untouched".
          # Both errors point the same way — toward skipping.
          changed="$(git -c core.quotePath=false diff --no-renames --name-only "$base"...HEAD)"
          echo "$changed"
          # Which paths count lives in the script, next to the case table that
          # pins it — the set was wrong here for as long as it was untested
          # (#93). `tee` so the decision is in the log, not just the output.
          printf '%s\n' "$changed" | scripts/cluster-smoke-paths.sh | tee -a "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changed.outputs.run == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'

      # The tier publishes fixed host ports, and eleven of them fall inside
      # Linux's ephemeral range (32768-60999). Any outbound connection on the
      # runner — including the harness's own polling of these very endpoints —
      # can be handed one as a source port, and `compose up` then fails to bind
      # it: `failed to bind host port for 0.0.0.0:45262 ... address already in
      # use`, which is issue #117 and which cost PR #113 a 22-minute re-run.
      #
      # Reserving them takes them out of the pool the kernel allocates *from*
      # without making them any less bindable, so docker still publishes them
      # normally. The list is pinned by a test
      # (`ci_reserves_every_published_port_that_linux_could_hand_out`), so a new
      # published port in this range fails the build rather than reintroducing
      # the flake quietly.
      - name: Reserve the tier's published ports from the ephemeral range
        if: steps.changed.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=36300,36400,39090,42525,45251-45253,45261-45263,48474,49901
          # Assert the read-back, do not merely print it: `sysctl <key>` exits 0
          # whatever the value is, so echoing it would prove nothing about a
          # partially applied or silently truncated write.
          test "$(sysctl -n net.ipv4.ip_local_reserved_ports)" = "36300,36400,39090,42525,45251-45253,45261-45263,48474,49901"

      # Serial by necessity, not by preference: the compose file publishes fixed
      # host ports, so two stacks cannot coexist on one runner.
      #
      # `--ignored` runs the ignored tests: the whole tier is gated on a
      # container runtime, so `--ignored` is how it runs at all.
      # Skips are derived from the quarantine tags in the source, never
      # hardcoded here: a hardcoded skip outlives the reason for it, and the
      # scenario stays silently un-run long after its bug is fixed.
      - name: Container chaos scenarios
        if: steps.changed.outputs.run == 'true'
        run: |
          set -euo pipefail
          # An array, not a string. `list` emits one token per line precisely so
          # this can be quoted: the old unquoted `$skips` worked only by
          # word-splitting, which left SC2086 pointing here — and taking that
          # advice hands libtest one argument beginning with `--`, which it
          # rejects outright (`Unrecognized option`, exit 101). Red rather than
          # silent, but broken either way, and the lint invited it (issue #116).
          mapfile -t skips < <(scripts/chaos-quarantine.sh list)
          echo "quarantine skips: ${skips[*]:-<none>}"
          # Piped through the floor check so a run that matched no scenario is
          # red rather than a green check that tested nothing. `pipefail` above
          # keeps cargo's own failure from being masked by the pipe.
          cargo test -p cluster-chaos -- --ignored --test-threads=1 "${skips[@]}" \
            | scripts/assert-scenarios-ran.sh

      - name: Cluster logs on failure
        if: failure() && steps.changed.outputs.run == 'true'
        run: docker compose -f deploy/compose/docker-compose.yml logs --tail=100 || true
