name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The wasm lint crate is workspace-excluded so no default lane needs the wasm target — which
      # would also mean nothing notices it breaking until a release builds it. Exercise it here:
      # host tests pin the linting contract, the target check pins the ABI compile.
      - name: Lint-wasm crate (host tests)
        run: cargo test --manifest-path crates/rift-lint-wasm/Cargo.toml

      - name: Lint-wasm crate (wasm target check)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --manifest-path crates/rift-lint-wasm/Cargo.toml --target wasm32-unknown-unknown

      # Guards one invariant the compiler cannot: exactly one copy of
      # `prometheus` in the tree. Two copies means two global registries, and
      # cluster metrics that silently never reach /metrics.
      - name: Single prometheus copy
        run: scripts/check-single-prometheus.sh

      # Cheap, and it runs here rather than in `cluster-smoke` so it is enforced
      # on every PR: `cluster-smoke` is path-filtered, and a quarantine tag can
      # be added by a change that touches nothing it watches.
      - name: Chaos quarantine tags
        run: scripts/chaos-quarantine.sh check

      # The static half of the pull-not-build proof (#269). Here rather than in
      # `cluster-smoke` for the same reason as the step above — that job is
      # path-filtered, and the criterion this enforces ("no quick start begins
      # with a clone") is regressed by editing a README, which watches nothing.
      #
      # The other half of the script needs a published image and so can only run
      # in the release lane; this half needs no daemon at all, which is what lets
      # it run on every PR and keep `cluster.yml` from rotting between releases.
      - name: Pull-not-build manifest and quick starts
        run: deploy/compose/verify-pulled.sh --check

      # Same reasoning, one level up: `cluster-smoke`'s path filter decides
      # whether the chaos tier runs at all, and when it is wrong the tier is
      # skipped and the check goes green having tested nothing. It has to be
      # verified from a job the filter cannot skip — this one.
      - name: cluster-smoke path filter
        run: scripts/cluster-smoke-paths.sh --self-test

      # The third guard on the same door: whether the tier, having run, actually
      # ran anything. libtest exits 0 on a filter that matches nothing, so this
      # is what stands between "the scenarios were skipped" and a green check.
      - name: Empty-run guard
        run: scripts/assert-scenarios-ran.sh --self-test

      # The console embed must stay off the default build graph (RFC-006 §7, issue #186). Deliberately
      # in THIS job — the one that cannot be skipped and that runs plain `cargo build`/`cargo test` —
      # because the invariant it guards is precisely that those two commands never need node. No node
      # is installed for this step, and none is needed: it reads the manifest and `cargo tree`.
      - name: Console stays off the default build graph
        run: scripts/check-console-hermetic.sh

  # No openraft in `rift-cluster`'s public API — an acceptance criterion of
  # issue #6 that the compiler cannot check. Why it matters, and why the check
  # has no exemptions, is documented in the script itself; this job only
  # supplies the toolchain.
  #
  # Nightly is confined to this one job because rustdoc JSON — the only
  # machine-readable view of a crate's public surface — is nightly-only. The
  # nightly and the cargo-public-api version are pinned so the check is
  # reproducible, not because any specific pair is required. If you bump either,
  # just re-run this job: an incompatibility shows up immediately as a parse
  # error, not as a wrong answer.
  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Nightly is the default toolchain here, so it is what both builds the
      # tool and runs the check.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-public-api
        run: cargo install cargo-public-api --version 0.51.0 --locked

      # The same script a developer can run locally, so what CI checks and what
      # they can check cannot drift.
      - name: No openraft in the public API
        run: scripts/check-public-api.sh

  # The container tier (issue #11): real processes, killed and restarted. Its
  # own job because it needs Docker and takes minutes, and because a container
  # runtime failure must not read as "the code is broken".
  #
  # Only on changes that could plausibly break a cluster — the whole tier costs
  # several minutes, and running it on a README edit trains people to ignore it.
  cluster-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The path filter below diffs against the base commit, which a shallow
          # clone does not have. Without this the diff errors, the filter reads
          # as "nothing changed", and the job goes green having run nothing.
          fetch-depth: 0

      # Runs here as well as in `build` deliberately. `build` and this job are
      # independent — there is no `needs:` — so a broken filter would turn
      # `build` red while THIS job still went green having skipped the tier,
      # which is the failure this whole issue is about. Verifying it inside the
      # job whose greenness depends on it needs no cross-job coordination.
      - name: Verify the path filter before trusting it
        run: scripts/cluster-smoke-paths.sh --self-test

      - name: Which paths changed
        id: changed
        run: |
          # A filter that fails *open into skipping* is worse than no filter: it
          # is a green check that tested nothing. `set -e` makes a broken diff
          # fail the job instead.
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          # `core.quotePath=false`: git otherwise renders a non-ASCII path as
          # "caf\303\251.md", quotes included, and the leading quote defeats
          # both the `^` prefix anchor and the whole-line match.
          # `--no-renames`: a rename reports only the destination, so moving a
          # file OUT of a watched directory would read as "cluster untouched".
          # Both errors point the same way — toward skipping.
          changed="$(git -c core.quotePath=false diff --no-renames --name-only "$base"...HEAD)"
          echo "$changed"
          # Which paths count lives in the script, next to the case table that
          # pins it — the set was wrong here for as long as it was untested
          # (#93). `tee` so the decision is in the log, not just the output.
          printf '%s\n' "$changed" | scripts/cluster-smoke-paths.sh | tee -a "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changed.outputs.run == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'

      # The tier publishes fixed host ports, and thirteen of them fall inside
      # Linux's ephemeral range (32768-60999). Any outbound connection on the
      # runner — including the harness's own polling of these very endpoints —
      # can be handed one as a source port, and `compose up` then fails to bind
      # it: `failed to bind host port for 0.0.0.0:45262 ... address already in
      # use`, which is issue #117 and which cost PR #113 a 22-minute re-run.
      #
      # Reserving them takes them out of the pool the kernel allocates *from*
      # without making them any less bindable, so docker still publishes them
      # normally. The list is pinned by a test
      # (`ci_reserves_every_published_port_that_linux_could_hand_out`), so a new
      # published port in this range fails the build rather than reintroducing
      # the flake quietly.
      - name: Reserve the tier's published ports from the ephemeral range
        if: steps.changed.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=34790,36300,36400,36500-36501,39090,42525,45251-45253,45261-45263,46525,48474,49901
          # Assert the read-back, do not merely print it: `sysctl <key>` exits 0
          # whatever the value is, so echoing it would prove nothing about a
          # partially applied or silently truncated write.
          test "$(sysctl -n net.ipv4.ip_local_reserved_ports)" = "34790,36300,36400,36500-36501,39090,42525,45251-45253,45261-45263,46525,48474,49901"

      # Serial by necessity, not by preference: the compose file publishes fixed
      # host ports, so two stacks cannot coexist on one runner.
      #
      # `--ignored` runs the ignored tests: the whole tier is gated on a
      # container runtime, so `--ignored` is how it runs at all.
      # Skips are derived from the quarantine tags in the source, never
      # hardcoded here: a hardcoded skip outlives the reason for it, and the
      # scenario stays silently un-run long after its bug is fixed.
      - name: Container chaos scenarios
        if: steps.changed.outputs.run == 'true'
        run: |
          set -euo pipefail
          # An array, not a string. `list` emits one token per line precisely so
          # this can be quoted: the old unquoted `$skips` worked only by
          # word-splitting, which left SC2086 pointing here — and taking that
          # advice hands libtest one argument beginning with `--`, which it
          # rejects outright (`Unrecognized option`, exit 101). Red rather than
          # silent, but broken either way, and the lint invited it (issue #116).
          mapfile -t skips < <(scripts/chaos-quarantine.sh list)
          echo "quarantine skips: ${skips[*]:-<none>}"
          # Piped through the floor check so a run that matched no scenario is
          # red rather than a green check that tested nothing. `pipefail` above
          # keeps cargo's own failure from being masked by the pipe.
          cargo test -p cluster-chaos -- --ignored --test-threads=1 "${skips[@]}" \
            | scripts/assert-scenarios-ran.sh

      - name: Cluster logs on failure
        if: failure() && steps.changed.outputs.run == 'true'
        run: docker compose -f deploy/compose/docker-compose.yml logs --tail=100 || true

  # Parity (issue #37): upstream's own behavioural suites, run against
  # `rift-cluster-server` with `--cluster` off. This is what turns "composition,
  # not a fork: `--cluster` off is byte-identical to rift" from an assertion
  # the composition makes by construction into something verified against the
  # behaviour rift itself guarantees.
  #
  # Only four of upstream's `rift-http-proxy` integration suites can run
  # against an external binary at all — the rest link `ImposterManager`/
  # `AdminApiServer` directly and can never be pointed anywhere else, but they
  # also don't need to be: `rift-cluster-server` links that exact vendored library
  # unmodified, so upstream's own CI already gates that code (see the issue's
  # scoping finding). The four that spawn a server process use the shared
  # `server_bin()` helper (`vendor/rift/crates/rift-http-proxy/tests/support/
  # mod.rs`) to resolve which binary to spawn, honoring `RIFT_SERVER_BIN`.
  #
  # Structured identically to `cluster-smoke` — same filter script (own job
  # selector, not a second untested filter, per issue #93), same `fetch-depth:
  # 0` / `--self-test` / `set -euo pipefail` / `--no-renames` reasoning. See
  # that job's comments for why each of those matters; it applies unchanged
  # here.
  parity:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The path filter below diffs against the base commit, which a
          # shallow clone does not have.
          fetch-depth: 0

      # Same reasoning as cluster-smoke's identical step: `build` and this job
      # are independent, so a broken filter must be caught from inside the job
      # whose greenness depends on it, not assumed from a sibling that ran a
      # different job selector.
      - name: Verify the path filter before trusting it
        run: scripts/cluster-smoke-paths.sh --self-test

      - name: Which paths changed
        id: changed
        run: |
          # A filter that fails *open into skipping* is worse than no filter:
          # it is a green check that verified nothing against upstream. `set
          # -e` makes a broken diff fail the job instead of reading as "no
          # parity-relevant change".
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          # Same two fixes as cluster-smoke's identical line, both toward not
          # skipping: `core.quotePath=false` so a non-ASCII path's leading
          # quote can't defeat the filter, `--no-renames` so a file moved OUT
          # of a watched path doesn't read as untouched.
          changed="$(git -c core.quotePath=false diff --no-renames --name-only "$base"...HEAD)"
          echo "$changed"
          printf '%s\n' "$changed" | scripts/cluster-smoke-paths.sh --job parity | tee -a "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changed.outputs.run == 'true'

      # Two workspaces are in play here — this repo's own, and `vendor/rift`
      # (excluded from it, see the root Cargo.toml) — so both are named
      # explicitly; the default single-workspace cache would miss the second
      # one entirely and rebuild it from scratch on every run.
      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'
        with:
          workspaces: |
            .
            vendor/rift

      - name: Build rift-cluster-server (release)
        if: steps.changed.outputs.run == 'true'
        run: cargo build -p rift-cluster-server --release

      # `vendor/rift` is its own cargo workspace (excluded from ours), so the
      # suites are run with that directory as the working dir rather than
      # with `-p` flags from the root.
      #
      # No `--cluster` flags anywhere below — that is the point of "parity
      # mode": these suites exercise exactly the composition an operator gets
      # by running `rift-cluster-server` as a drop-in `rift` replacement.
      #
      # `RIFT_SERVER_BIN` points the suites at our binary instead of their own
      # debug build; `support::server_bin()` panics on a set-but-not-
      # executable path rather than silently falling back, so a broken build
      # step here fails loud, not quiet. `corpus_replay` also spawns
      # `rift-verify`; that stays upstream's own build via
      # `CARGO_BIN_EXE_rift-verify`, deliberately not overridden — it is
      # harness, not the binary under test.
      #
      # `--include-ignored`, not `--ignored`: measured locally, all of
      # `mountebank_compatibility` (45 tests) and `rift_extensions` (10) carry
      # `#[ignore = "requires running server"]` — a plain `cargo test` runs
      # neither suite at all, which is a green step having exercised 8 of the
      # 63 tests these four files contain. `--ignored` alone is just as wrong
      # the other way: it runs ONLY ignored tests, so `corpus_replay` and
      # `issue_360_script_cli` (which carry no `#[ignore]`s) would report `0
      # passed` while the step still goes green. `--include-ignored` is the
      # only flag that runs all of it. (Upstream's own CI passes neither flag
      # to this suite, so this parity job exercises more of it than upstream's
      # own pipeline does.)
      #
      # `--test-threads=1`: `mountebank_compatibility` spawns one server
      # process per test and picks its ports from a per-binary counter, not a
      # global one; measured locally, the default thread-per-core parallelism
      # spawns enough of those concurrently to occasionally hit a connection
      # reset (44/45 passed, retried clean at `--test-threads=1`). Serial is
      # slower but was the only setting that didn't flake across repeated
      # runs — the same trade cluster-smoke already makes for its own
      # fixed-port tier, for the same reason.
      #
      # The `test_response_cycling_with_rift_extensions` quarantine is gone
      # (issue #145): it skipped a test that issued six requests concurrently
      # and asserted they reached the round-robin counter in dispatch order,
      # which client-side concurrency never guaranteed. Filed upstream as
      # achird-labs/rift#849 rather than patched here — this crate carries no
      # local patches to the pin — and fixed upstream by rift#850, which
      # dispatches those requests sequentially. That fix is in the pin, so the
      # skip now suppresses a test that passes: dropped rather than left to rot.
      - name: Upstream process-spawning suites against rift-cluster-server
        if: steps.changed.outputs.run == 'true'
        working-directory: vendor/rift
        env:
          RIFT_SERVER_BIN: ${{ github.workspace }}/target/release/rift-cluster-server
          ASSERT_SCENARIOS_RAN: ${{ github.workspace }}/scripts/assert-scenarios-ran.sh
        run: |
          set -euo pipefail
          cargo test -p rift-http-proxy \
            --test mountebank_compatibility \
            --test rift_extensions \
            --test issue_360_script_cli \
            --test corpus_replay \
            -- --include-ignored --test-threads=1 \
            | "$ASSERT_SCENARIOS_RAN" --assert 51

  # The web console's own toolchain (RFC-006 §7, issue #186). Node lives HERE and nowhere else: the
  # `build` job above must keep passing on a runner with no node at all, which is the invariant
  # `check-console-hermetic.sh` asserts from inside it.
  #
  # Deliberately not path-filtered. The drift gate below has to run whenever *either* side moves —
  # `web/` or `docs/api/openapi-ee.yaml` — and this repo has already learned twice (#93, #117) that a
  # filter which is wrong fails open into skipping, i.e. into a green check that verified nothing.
  # The whole job is well under a minute; a filter would cost more in risk than it saves in time.
  console-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # `submodules: recursive` is required: the console *serving* tests at the end of this job build
      # `rift-cluster-server`, which path-depends on the vendored `vendor/rift` crates. Nothing under
      # `web/` needs them, but the cargo step does, and without this the job fails to resolve
      # `rift-http-proxy` rather than failing on anything to do with the console.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned to the same version `web/package.json` declares in `packageManager`. pnpm is not
      # preinstalled on the runner and corepack is no longer bundled with modern Node, so it is
      # installed explicitly rather than assumed.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # `--frozen-lockfile` is what makes this reproducible: it fails rather than silently resolving
      # a newer version when the lockfile and package.json disagree.
      - name: Install
        run: pnpm install --frozen-lockfile

      # The drift gate (issue #186's acceptance criterion). The generated client is committed so
      # `web/` builds without the binary present; that only stays honest if regenerating it here is a
      # no-op. `--exit-code` turns any difference into a failed check.
      - name: The committed client matches the contract
        run: |
          set -euo pipefail
          # `git diff` reports nothing for an UNTRACKED file, so a forgotten `git add` would make the
          # check below green having compared the generated client against nothing at all. Assert it
          # is tracked first — the same failure-open shape #93 and #117 were about.
          git ls-files --error-unmatch src/api/schema.ts > /dev/null
          pnpm run generate:client
          if ! git diff --exit-code -- src/api/schema.ts; then
            echo "::error::web/src/api/schema.ts is stale. Run 'pnpm run generate:client' in web/ and commit the result." >&2
            exit 1
          fi

      - name: Typecheck
        run: pnpm run typecheck

      # RFC-006 §9.1's first XSS defense: `dangerouslySetInnerHTML` banned by lint. One rule, not a
      # recommended set — a security gate buried in style nits is a gate reviewers learn to skim.
      # `contract-traceability.test.ts` asserts the same thing, so dropping this step alone does not
      # silently un-ban it.
      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      # Proves `web/dist` can actually be produced — which is what the release lane's
      # `cargo build --features console` depends on. A console that only builds on someone's laptop
      # would otherwise surface for the first time during a release.
      - name: Build
        run: pnpm run build

      # The Rust half of the console, exercised on every PR.
      #
      # This job is where it belongs and the `build` job is where it does not. `tests/console.rs` and
      # `console.rs`'s unit tests are `cfg(feature = "console")`, so they need a real `web/dist` —
      # which only exists here, after the step above. Without this the only lane that ever runs them
      # is `release.yml`, and a PR that stripped the CSP header, broke the SPA fallback, or removed
      # the empty-bundle guard would merge green and surface at the next tag.
      #
      # It does not weaken the hermeticity invariant: that invariant is about the *default* build,
      # and `check-console-hermetic.sh` continues to assert it from inside the node-free `build` job.
      # Enabling the feature inherently requires the bundle — that is the whole design.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # Explicitly the workspace root, overriding this job's `web` default — cargo must run against
      # the Rust workspace, not inside the JS package.
      - name: Console serving tests
        working-directory: ${{ github.workspace }}
        run: cargo test -p rift-cluster-server --features console --lib --test console

      # ---------------------------------------------------------------------
      # Browser tests against the artifact the release actually ships.
      #
      # The vitest suite above runs under jsdom, which parses CSS but never computes the cascade or
      # paints — so an entire class of defect is invisible to it. The one that motivated this lane:
      # `background-color` on an `input` suppresses a checkbox's native checked indicator in Blink
      # and makes `accent-color` a no-op, so every checkbox in the console rendered as an empty
      # square that never ticked. 375 green jsdom tests said nothing, and it was found by hand.
      #
      # These run against the binary serving `/console/`, not the Vite dev server, so the shipped
      # CSP, the real bundle and the bundled wasm linter are under test rather than assumed.
      # `scripts/e2e-console.sh` provides the seeded single node; its header says why one and not
      # three.
      # ---------------------------------------------------------------------
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile so a Playwright bump re-downloads: the browser build is pinned to
          # the library version, and a stale cache fails with "executable doesn't exist" rather than
          # anything that names the real cause.
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # System deps are not cached with the browser binaries, so they are installed even on a hit.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Browser tests (smoke, visual, accessibility)
        run: pnpm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # The diff images are the whole point of the upload: a visual failure is unreadable
          # without the expected/actual/diff triple.
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Helm chart (#267)
  # ---------------------------------------------------------------------------
  # Cheap and cluster-free: this validates the chart's SCHEMA across a values matrix, exactly the bar
  # `deploy/k8s/statefulset.yaml` already meets — now across the axes a chart adds. It does not, and
  # cannot here, prove the cluster forms; `deploy/README.md` carries that caveat verbatim.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install kubeconform (pinned)
        run: |
          set -euo pipefail
          version=v0.6.7
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: helm lint
        run: helm lint deploy/helm/rift-cluster --set clusterSecret.existingSecret=ci

      # The guard is a feature, so it is tested like one. With no secret configured the chart must
      # REFUSE to render rather than install a cluster whose peer authentication is unconfigured —
      # and `helm install` makes that a single command, so a chart that rendered anyway would be
      # worse than the raw manifest it replaces.
      #
      # The failure output is matched, not just the exit status: discarding stderr would score an
      # unrelated template syntax error as a PASS on the security guard — the one assertion here
      # that must never pass for the wrong reason.
      - name: A chart with no cluster secret must refuse to render
        run: |
          set -euo pipefail
          if helm template r deploy/helm/rift-cluster >/dev/null 2>/tmp/no-secret.err; then
            echo "FAIL: the chart rendered with no clusterSecret configured" >&2
            exit 1
          fi
          if ! grep -q 'clusterSecret:' /tmp/no-secret.err; then
            echo "FAIL: the chart refused, but not because of the secret guard:" >&2
            cat /tmp/no-secret.err >&2
            exit 1
          fi
          echo "PASS: refused, as it should"

      # Same shape, different guard. The `-static` flavor is FROM scratch and this chart runs
      # `/bin/sh -c` as every pod's container command, so a `-static` tag renders a StatefulSet
      # whose pods all fail at exec — at rollout, with a bare container error. The chart refuses
      # at render time instead, and this step is what keeps that refusal from being deleted.
      #
      # Matched on output, not exit status alone, for the same reason as the secret guard above:
      # a template syntax error would otherwise score as a PASS.
      #
      # The needle is the guard's own prose, NOT `-static`. `-static` is a substring of the tag this
      # step injects, so any future validation that echoes `image.tag` back in its error would match
      # it and score a PASS with the flavor guard deleted. `FROM scratch` can only come from here.
      - name: A chart pointed at the -static flavor must refuse to render
        run: |
          set -euo pipefail
          if helm template r deploy/helm/rift-cluster \
               --set clusterSecret.existingSecret=ci \
               --set image.tag=1.2.3-static >/dev/null 2>/tmp/static-flavor.err; then
            echo "FAIL: the chart rendered with a -static image tag" >&2
            exit 1
          fi
          if ! grep -q 'FROM scratch' /tmp/static-flavor.err; then
            echo "FAIL: the chart refused, but not because of the flavor guard:" >&2
            cat /tmp/static-flavor.err >&2
            exit 1
          fi
          echo "PASS: refused, as it should"

      # Rendered to a FILE rather than piped: kubeconform reading a pipe reports "0 resources found"
      # and exits 0, which is a summary that looks like a pass and checks nothing. A file also leaves
      # the rendered manifest inspectable in the log when a case fails.
      #
      # `-skip ServiceMonitor`: a Prometheus Operator CRD, so there is no upstream schema to validate
      # it against. Skipping it by name keeps `-strict` in force for everything else, which
      # `-ignore-missing-schemas` would not.
      - name: helm template + kubeconform across the values matrix
        run: |
          set -euo pipefail
          chart=deploy/helm/rift-cluster
          render() {
            local name="$1"; shift
            echo "--- ${name} ---"
            helm template r "$chart" "$@" > "/tmp/${name}.yaml"
            kubeconform -strict -summary -skip ServiceMonitor "/tmp/${name}.yaml"
          }

          render defaults --set clusterSecret.existingSecret=ci
          render everything-on \
            --set clusterSecret.create=true --set clusterSecret.value=ci \
            --set replicas=5 --set storage.className=gp3 \
            --set metrics.serviceMonitor.enabled=true \
            --set serviceAccount.create=true \
            --set service.type=LoadBalancer \
            --set leaveTimeoutSeconds=45
          render single-node --set clusterSecret.existingSecret=ci --set replicas=1 --set podDisruptionBudget.enabled=false

          for env in onprem eks aks; do
            render "values-${env}" -f "${chart}/values-${env}.yaml"
          done

      # The rule the chart exists to make unbreakable, asserted rather than trusted:
      # terminationGracePeriodSeconds must be 2 x leaveTimeoutSeconds + 10. A template edit that
      # hard-coded it back to a literal would pass every schema check above and silently reintroduce
      # the SIGKILL-mid-drain the raw manifest's comment warns about.
      - name: The termination grace period stays derived from the leave timeout
        run: |
          set -euo pipefail
          for leave in 15 30 45; do
            want=$(( 2 * leave + 10 ))
            got="$(helm template r deploy/helm/rift-cluster \
              --set clusterSecret.existingSecret=ci \
              --set "leaveTimeoutSeconds=${leave}" \
              | grep -m1 'terminationGracePeriodSeconds:' | tr -dc '0-9')"
            if [ "$got" != "$want" ]; then
              echo "FAIL: leaveTimeoutSeconds=${leave} produced grace ${got}, expected ${want}" >&2
              exit 1
            fi
            echo "ok: leave=${leave} -> grace=${got}"
          done

      # Four more properties that render as valid YAML when broken, so nothing above would catch
      # them. Each is a decision `deploy/k8s/statefulset.yaml` argues for in a comment, and a chart
      # that quietly dropped one would install a cluster that never forms.
      #
      # The long-release-name case is the reason this step exists at all: every case above uses the
      # release name `r`, and name truncation is invisible until the name is long. A `-peers` suffix
      # appended to an already-truncated base disappears, collapsing the headless Service onto the
      # client one — two Services with one name, and the survivor is the readiness-gating one the
      # seed address must never point at.
      - name: The cluster-forming invariants survive templating
        run: |
          set -euo pipefail
          chart=deploy/helm/rift-cluster
          # 53 a's — the longest release name Helm accepts, so name truncation is guaranteed to bite.
          long=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

          for release in r "$long"; do
            svcs=$(helm template "$release" "$chart" --set clusterSecret.existingSecret=ci \
              -s templates/services.yaml | sed -n 's/^  name: //p')
            sts=$(helm template "$release" "$chart" --set clusterSecret.existingSecret=ci \
              -s templates/statefulset.yaml)

            if [ "$(echo "$svcs" | sort -u | wc -l)" -ne 2 ]; then
              echo "FAIL[${release:0:8}…]: expected 2 distinctly-named Services, got:" >&2
              echo "$svcs" >&2
              exit 1
            fi
            for name in $svcs; do
              [ "${#name}" -le 63 ] \
                || { echo "FAIL: Service name '$name' is ${#name} chars, over the DNS label limit" >&2; exit 1; }
            done

            # publishNotReadyAddresses belongs to the headless peer Service and to nothing else. On
            # the client Service it would route traffic to nodes that have not converged, which is
            # the whole point of /readyz.
            n=$(helm template "$release" "$chart" --set clusterSecret.existingSecret=ci \
              -s templates/services.yaml | grep -c 'publishNotReadyAddresses: true' || true)
            [ "$n" -eq 1 ] || { echo "FAIL: publishNotReadyAddresses appears ${n}x, expected 1" >&2; exit 1; }

            # The seed must be <statefulset>-0.<serviceName> — the pod DNS name the headless Service
            # actually publishes. A seed that does not resolve deadlocks a cold start, and no schema
            # check can see it, because any string is a valid env value.
            name=$(echo "$sts" | sed -n 's/^  name: //p')
            svcname=$(echo "$sts" | sed -n 's/^  serviceName: //p')
            seed=$(echo "$sts" | grep -A1 'name: RIFT_CLUSTER_SEEDS' | sed -n 's/.*value: "\(.*\)"/\1/p')
            want="${name}-0.${svcname}:4790"
            [ "$seed" = "$want" ] || { echo "FAIL: seed '$seed', expected '$want'" >&2; exit 1; }
            echo "$svcs" | grep -qx "$svcname" \
              || { echo "FAIL: serviceName '$svcname' names no rendered Service" >&2; exit 1; }
            [ "${#name}" -le 61 ] \
              || { echo "FAIL: pod hostname '${name}-0' would exceed the DNS label limit" >&2; exit 1; }

            # exec, so SIGTERM reaches PID 1 instead of stopping at the shell. Without it the
            # graceful leave everything else here is tuned around silently never happens.
            echo "$sts" | grep -q 'exec rift-cluster-server' \
              || { echo "FAIL: the container args no longer exec the server" >&2; exit 1; }

            echo "ok[${release:0:8}…]: 2 services, seed ${seed}"
          done
