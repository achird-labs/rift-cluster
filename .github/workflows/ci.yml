name: CI

# THROWAWAY (#606): replaces the whole CI for this draft PR only. Never merges.
# Loops D-17's pin 150x on a runner with the quiesced precondition and prints, every iteration,
# the survivors' longest isolation and the term delta.

on:
  pull_request:

permissions:
  contents: read

jobs:
  loop-606:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the rift-cluster lib test binary
        run: |
          cargo test -p rift-cluster --lib --no-run --message-format=json \
            | grep -o '"executable":"[^"]*"' | cut -d'"' -f4 | grep -v null > bin.txt
          cat bin.txt
      - name: Loop D-17's pin 150x
        run: |
          BIN=$(head -1 bin.txt)
          pass=0; fail=0
          for i in $(seq 1 150); do
            if "$BIN" raft::node::tests::a_routine_election_isolates_a_node_for_the_round_trip_not_the_timeout --exact --nocapture > run.log 2>&1; then
              pass=$((pass+1)); r=ok
            else
              fail=$((fail+1)); r=FAIL
            fi
            echo "iter=$i $r $(grep -h 'T606-CI' run.log) $(grep -h 'was isolated for\|must see three voters' run.log | head -1 | cut -c1-200)"
          done
          echo "SUMMARY pass=$pass fail=$fail"
