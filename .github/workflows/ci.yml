name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Guards one invariant the compiler cannot: exactly one copy of
      # `prometheus` in the tree. Two copies means two global registries, and
      # cluster metrics that silently never reach /metrics.
      - name: Single prometheus copy
        run: scripts/check-single-prometheus.sh

      # Cheap, and it runs here rather than in `cluster-smoke` so it is enforced
      # on every PR: `cluster-smoke` is path-filtered, and a quarantine tag can
      # be added by a change that touches nothing it watches.
      - name: Chaos quarantine tags
        run: scripts/chaos-quarantine.sh check

      # Same reasoning, one level up: `cluster-smoke`'s path filter decides
      # whether the chaos tier runs at all, and when it is wrong the tier is
      # skipped and the check goes green having tested nothing. It has to be
      # verified from a job the filter cannot skip — this one.
      - name: cluster-smoke path filter
        run: scripts/cluster-smoke-paths.sh --self-test

      # The third guard on the same door: whether the tier, having run, actually
      # ran anything. libtest exits 0 on a filter that matches nothing, so this
      # is what stands between "the scenarios were skipped" and a green check.
      - name: Empty-run guard
        run: scripts/assert-scenarios-ran.sh --self-test

  # No openraft in `rift-cluster`'s public API — an acceptance criterion of
  # issue #6 that the compiler cannot check. Why it matters, and why the check
  # has no exemptions, is documented in the script itself; this job only
  # supplies the toolchain.
  #
  # Nightly is confined to this one job because rustdoc JSON — the only
  # machine-readable view of a crate's public surface — is nightly-only. The
  # nightly and the cargo-public-api version are pinned so the check is
  # reproducible, not because any specific pair is required. If you bump either,
  # just re-run this job: an incompatibility shows up immediately as a parse
  # error, not as a wrong answer.
  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Nightly is the default toolchain here, so it is what both builds the
      # tool and runs the check.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-public-api
        run: cargo install cargo-public-api --version 0.51.0 --locked

      # The same script a developer can run locally, so what CI checks and what
      # they can check cannot drift.
      - name: No openraft in the public API
        run: scripts/check-public-api.sh

  # The container tier (issue #11): real processes, killed and restarted. Its
  # own job because it needs Docker and takes minutes, and because a container
  # runtime failure must not read as "the code is broken".
  #
  # Only on changes that could plausibly break a cluster — the whole tier costs
  # several minutes, and running it on a README edit trains people to ignore it.
  cluster-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The path filter below diffs against the base commit, which a shallow
          # clone does not have. Without this the diff errors, the filter reads
          # as "nothing changed", and the job goes green having run nothing.
          fetch-depth: 0

      # Runs here as well as in `build` deliberately. `build` and this job are
      # independent — there is no `needs:` — so a broken filter would turn
      # `build` red while THIS job still went green having skipped the tier,
      # which is the failure this whole issue is about. Verifying it inside the
      # job whose greenness depends on it needs no cross-job coordination.
      - name: Verify the path filter before trusting it
        run: scripts/cluster-smoke-paths.sh --self-test

      - name: Which paths changed
        id: changed
        run: |
          # A filter that fails *open into skipping* is worse than no filter: it
          # is a green check that tested nothing. `set -e` makes a broken diff
          # fail the job instead.
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          # `core.quotePath=false`: git otherwise renders a non-ASCII path as
          # "caf\303\251.md", quotes included, and the leading quote defeats
          # both the `^` prefix anchor and the whole-line match.
          # `--no-renames`: a rename reports only the destination, so moving a
          # file OUT of a watched directory would read as "cluster untouched".
          # Both errors point the same way — toward skipping.
          changed="$(git -c core.quotePath=false diff --no-renames --name-only "$base"...HEAD)"
          echo "$changed"
          # Which paths count lives in the script, next to the case table that
          # pins it — the set was wrong here for as long as it was untested
          # (#93). `tee` so the decision is in the log, not just the output.
          printf '%s\n' "$changed" | scripts/cluster-smoke-paths.sh | tee -a "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changed.outputs.run == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'

      # The tier publishes fixed host ports, and thirteen of them fall inside
      # Linux's ephemeral range (32768-60999). Any outbound connection on the
      # runner — including the harness's own polling of these very endpoints —
      # can be handed one as a source port, and `compose up` then fails to bind
      # it: `failed to bind host port for 0.0.0.0:45262 ... address already in
      # use`, which is issue #117 and which cost PR #113 a 22-minute re-run.
      #
      # Reserving them takes them out of the pool the kernel allocates *from*
      # without making them any less bindable, so docker still publishes them
      # normally. The list is pinned by a test
      # (`ci_reserves_every_published_port_that_linux_could_hand_out`), so a new
      # published port in this range fails the build rather than reintroducing
      # the flake quietly.
      - name: Reserve the tier's published ports from the ephemeral range
        if: steps.changed.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=34790,36300,36400,36500-36501,39090,42525,45251-45253,45261-45263,46525,48474,49901
          # Assert the read-back, do not merely print it: `sysctl <key>` exits 0
          # whatever the value is, so echoing it would prove nothing about a
          # partially applied or silently truncated write.
          test "$(sysctl -n net.ipv4.ip_local_reserved_ports)" = "34790,36300,36400,36500-36501,39090,42525,45251-45253,45261-45263,46525,48474,49901"

      # Serial by necessity, not by preference: the compose file publishes fixed
      # host ports, so two stacks cannot coexist on one runner.
      #
      # `--ignored` runs the ignored tests: the whole tier is gated on a
      # container runtime, so `--ignored` is how it runs at all.
      # Skips are derived from the quarantine tags in the source, never
      # hardcoded here: a hardcoded skip outlives the reason for it, and the
      # scenario stays silently un-run long after its bug is fixed.
      - name: Container chaos scenarios
        if: steps.changed.outputs.run == 'true'
        run: |
          set -euo pipefail
          # An array, not a string. `list` emits one token per line precisely so
          # this can be quoted: the old unquoted `$skips` worked only by
          # word-splitting, which left SC2086 pointing here — and taking that
          # advice hands libtest one argument beginning with `--`, which it
          # rejects outright (`Unrecognized option`, exit 101). Red rather than
          # silent, but broken either way, and the lint invited it (issue #116).
          mapfile -t skips < <(scripts/chaos-quarantine.sh list)
          echo "quarantine skips: ${skips[*]:-<none>}"
          # Piped through the floor check so a run that matched no scenario is
          # red rather than a green check that tested nothing. `pipefail` above
          # keeps cargo's own failure from being masked by the pipe.
          cargo test -p cluster-chaos -- --ignored --test-threads=1 "${skips[@]}" \
            | scripts/assert-scenarios-ran.sh

      - name: Cluster logs on failure
        if: failure() && steps.changed.outputs.run == 'true'
        run: docker compose -f deploy/compose/docker-compose.yml logs --tail=100 || true

  # Parity (issue #37): upstream's own behavioural suites, run against
  # `rift-ee-server` with `--cluster` off. This is what turns "composition,
  # not a fork: `--cluster` off is byte-identical to rift" from an assertion
  # the composition makes by construction into something verified against the
  # behaviour rift itself guarantees.
  #
  # Only four of upstream's `rift-http-proxy` integration suites can run
  # against an external binary at all — the rest link `ImposterManager`/
  # `AdminApiServer` directly and can never be pointed anywhere else, but they
  # also don't need to be: `rift-ee-server` links that exact vendored library
  # unmodified, so upstream's own CI already gates that code (see the issue's
  # scoping finding). The four that spawn a server process use the shared
  # `server_bin()` helper (`vendor/rift/crates/rift-http-proxy/tests/support/
  # mod.rs`) to resolve which binary to spawn, honoring `RIFT_SERVER_BIN`.
  #
  # Structured identically to `cluster-smoke` — same filter script (own job
  # selector, not a second untested filter, per issue #93), same `fetch-depth:
  # 0` / `--self-test` / `set -euo pipefail` / `--no-renames` reasoning. See
  # that job's comments for why each of those matters; it applies unchanged
  # here.
  parity:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The path filter below diffs against the base commit, which a
          # shallow clone does not have.
          fetch-depth: 0

      # Same reasoning as cluster-smoke's identical step: `build` and this job
      # are independent, so a broken filter must be caught from inside the job
      # whose greenness depends on it, not assumed from a sibling that ran a
      # different job selector.
      - name: Verify the path filter before trusting it
        run: scripts/cluster-smoke-paths.sh --self-test

      - name: Which paths changed
        id: changed
        run: |
          # A filter that fails *open into skipping* is worse than no filter:
          # it is a green check that verified nothing against upstream. `set
          # -e` makes a broken diff fail the job instead of reading as "no
          # parity-relevant change".
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          # Same two fixes as cluster-smoke's identical line, both toward not
          # skipping: `core.quotePath=false` so a non-ASCII path's leading
          # quote can't defeat the filter, `--no-renames` so a file moved OUT
          # of a watched path doesn't read as untouched.
          changed="$(git -c core.quotePath=false diff --no-renames --name-only "$base"...HEAD)"
          echo "$changed"
          printf '%s\n' "$changed" | scripts/cluster-smoke-paths.sh --job parity | tee -a "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changed.outputs.run == 'true'

      # Two workspaces are in play here — this repo's own, and `vendor/rift`
      # (excluded from it, see the root Cargo.toml) — so both are named
      # explicitly; the default single-workspace cache would miss the second
      # one entirely and rebuild it from scratch on every run.
      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'
        with:
          workspaces: |
            .
            vendor/rift

      - name: Build rift-ee-server (release)
        if: steps.changed.outputs.run == 'true'
        run: cargo build -p rift-ee-server --release

      # `vendor/rift` is its own cargo workspace (excluded from ours), so the
      # suites are run with that directory as the working dir rather than
      # with `-p` flags from the root.
      #
      # No `--cluster` flags anywhere below — that is the point of "parity
      # mode": these suites exercise exactly the composition an operator gets
      # by running `rift-ee-server` as a drop-in `rift` replacement.
      #
      # `RIFT_SERVER_BIN` points the suites at our binary instead of their own
      # debug build; `support::server_bin()` panics on a set-but-not-
      # executable path rather than silently falling back, so a broken build
      # step here fails loud, not quiet. `corpus_replay` also spawns
      # `rift-verify`; that stays upstream's own build via
      # `CARGO_BIN_EXE_rift-verify`, deliberately not overridden — it is
      # harness, not the binary under test.
      #
      # `--include-ignored`, not `--ignored`: measured locally, all of
      # `mountebank_compatibility` (45 tests) and `rift_extensions` (10) carry
      # `#[ignore = "requires running server"]` — a plain `cargo test` runs
      # neither suite at all, which is a green step having exercised 8 of the
      # 63 tests these four files contain. `--ignored` alone is just as wrong
      # the other way: it runs ONLY ignored tests, so `corpus_replay` and
      # `issue_360_script_cli` (which carry no `#[ignore]`s) would report `0
      # passed` while the step still goes green. `--include-ignored` is the
      # only flag that runs all of it. (Upstream's own CI passes neither flag
      # to this suite, so this parity job exercises more of it than upstream's
      # own pipeline does.)
      #
      # `--test-threads=1`: `mountebank_compatibility` spawns one server
      # process per test and picks its ports from a per-binary counter, not a
      # global one; measured locally, the default thread-per-core parallelism
      # spawns enough of those concurrently to occasionally hit a connection
      # reset (44/45 passed, retried clean at `--test-threads=1`). Serial is
      # slower but was the only setting that didn't flake across repeated
      # runs — the same trade cluster-smoke already makes for its own
      # fixed-port tier, for the same reason.
      #
      # The `test_response_cycling_with_rift_extensions` quarantine is gone
      # (issue #145): it skipped a test that issued six requests concurrently
      # and asserted they reached the round-robin counter in dispatch order,
      # which client-side concurrency never guaranteed. Filed upstream as
      # achird-labs/rift#849 rather than patched here — this crate carries no
      # local patches to the pin — and fixed upstream by rift#850, which
      # dispatches those requests sequentially. That fix is in the pin, so the
      # skip now suppresses a test that passes: dropped rather than left to rot.
      - name: Upstream process-spawning suites against rift-ee-server
        if: steps.changed.outputs.run == 'true'
        working-directory: vendor/rift
        env:
          RIFT_SERVER_BIN: ${{ github.workspace }}/target/release/rift-ee-server
          ASSERT_SCENARIOS_RAN: ${{ github.workspace }}/scripts/assert-scenarios-ran.sh
        run: |
          set -euo pipefail
          cargo test -p rift-http-proxy \
            --test mountebank_compatibility \
            --test rift_extensions \
            --test issue_360_script_cli \
            --test corpus_replay \
            -- --include-ignored --test-threads=1 \
            | "$ASSERT_SCENARIOS_RAN" --assert 51
