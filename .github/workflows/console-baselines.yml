# Generate the console's visual baselines on Linux, from CI, and commit them back.
#
# Why this exists at all: `toHaveScreenshot` baselines are per-platform (`-linux.png` vs
# `-darwin.png`) because font rasterisation differs between them. CI is the platform the gate
# actually runs on, so CI is the only place that can produce baselines the gate will accept. A
# developer on macOS cannot generate them, and images generated anywhere else fail on unchanged
# code — which reads as a regression and trains people to re-baseline without looking.
#
# **Label-triggered, never automatic.** Regenerating baselines accepts whatever the console
# currently renders as correct, so it has to be a decision someone makes and can be seen making.
# Add the `update-baselines` label to the PR; this pushes the new images to the PR branch and
# removes the label so a later push does not silently re-accept a real visual change.
#
# The push uses `GITHUB_TOKEN`, which by design does not re-trigger workflows. That is exactly what
# is wanted here — otherwise this job's own commit would start another CI run — but it does mean the
# baseline commit is not itself verified until the next real push. Review the diff.
name: Console visual baselines

on:
  pull_request:
    types: [labeled]

# The one job in this repo that writes to the repository. Scoped to this workflow rather than
# widened in `ci.yml`, so nothing else inherits it.
permissions:
  contents: write
  pull-requests: write

jobs:
  baselines:
    # Belt and braces alongside the `types: [labeled]` trigger: that fires for *any* label, so
    # without this, labelling a PR `needs-triage` would regenerate its baselines.
    if: github.event.label.name == 'update-baselines'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # `ref` is the PR's head branch by name, not the merge commit `pull_request` checks out by
      # default. Committing onto a detached merge ref would produce a commit attached to nothing.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # `web/dist` first: `--features console` embeds it, and `rust-embed` fails the *compile*
      # without it.
      - name: Build the console bundle
        run: pnpm run build

      - name: Build the console-enabled binary
        working-directory: ${{ github.workspace }}
        run: cargo build --locked -p rift-cluster-server --features console

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # `--update-snapshots` writes whatever renders. It cannot fail on a diff by definition, so the
      # review of this job's commit is the only gate — say so rather than implying the job checked
      # anything.
      - name: Regenerate baselines
        run: pnpm exec playwright test visual --update-snapshots

      - name: Commit the new baselines
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/e2e/**/*-linux.png
          if git diff --cached --quiet; then
            echo "::notice::No baseline changes — the Linux images already match what renders."
            exit 0
          fi
          # Named for what a reader needs to know: these were accepted, not verified.
          git commit -m "test(console): regenerate Linux visual baselines from CI

          Generated by the console-baselines workflow with --update-snapshots, which accepts
          whatever currently renders. Review the images rather than the exit code."
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      # Removed so the label has to be applied deliberately each time. Leaving it on would mean a
      # later `labeled` event — or a re-run — silently re-accepting a genuine visual regression.
      - name: Drop the label
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit ${{ github.event.pull_request.number }} --remove-label update-baselines

      # The images themselves, so a reviewer can look at them without checking the branch out.
      - name: Upload the baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-visual-baselines-linux
          path: web/e2e/**/*-linux.png
          retention-days: 14
