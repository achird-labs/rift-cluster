# Nightly soak of the container chaos tier (issue #73).
#
# `cluster-smoke` on a PR runs each scenario once, which catches a scenario that
# is broken but not one that is *flaky*. Rare failures only show up under
# iteration, and iteration does not fit in a PR's latency budget -- so it lives
# here, one job per scenario so the nightly's wall clock is the slowest single
# scenario rather than the sum of all of them.
#
# D-41: this soak is where flakes surface — 60–100 iterations per scenario under a 2 h cap,
# not the flat 100× RFC-001 §12 sketched (C6's 60 s toxic window alone would be ~3.6 h) —
# while the required `cluster-smoke` check runs each scenario once per PR.

name: nightly-chaos

on:
  schedule:
    # 02:17 UTC — off the hour, where scheduled-workflow queueing is lighter.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      scenario:
        description: "Run only this scenario (exact test name); blank runs the full matrix"
        required: false
        default: ""
      iterations:
        description: "Override the per-scenario iteration count (0 = use the table)"
        required: false
        default: "0"

permissions:
  contents: read

# A nightly still running when the next one fires means the box is the
# bottleneck; keep the newer one and drop the old.
concurrency:
  group: nightly-chaos
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # One scenario's flake must not cancel the others' evidence.
      fail-fast: false
      matrix:
        include:
          # Iterations are sized so each job lands under ~100 min of the 120 min
          # cap: every iteration pays stack-up plus teardown on top of its body,
          # and C6 additionally carries an irreducible 60s toxic window.
          - scenario: test_config_sync_converges
            iterations: 100
          - scenario: test_config_sync_converges_without_barrier
            iterations: 100
          - scenario: test_reconcile_preserves_state
            iterations: 100
          - scenario: test_reconcile_reorder
            iterations: 100
          - scenario: test_no_seeds_not_ready
            iterations: 100
          - scenario: test_graceful_leave
            iterations: 80
          - scenario: test_front_routes_around_an_unready_node
            iterations: 80
          - scenario: c7_joining_node_serves_nothing_until_reconciled
            iterations: 80
          - scenario: test_node_rejoin
            iterations: 60
          - scenario: c14_leader_kill_keeps_every_acknowledged_write
            iterations: 60
          - scenario: c4_partition_parks_minority_writes_and_replays_on_heal
            iterations: 60
          - scenario: c5_rolling_restart_never_stops_accepting_writes
            iterations: 60
          - scenario: whole_fleet_sigterm_then_cold_start_converges
            iterations: 50
          - scenario: test_cold_start
            iterations: 50
          # Pays a full down/up twice per iteration, so it is the most expensive
          # scenario per run in the suite.
          - scenario: empty_state_dirs_cold_start_empty
            iterations: 40
          - scenario: c15_hard_kill_of_the_whole_fleet_keeps_acknowledged_writes
            iterations: 50
          - scenario: c6_loss_and_jitter_do_not_flap_or_lose_writes
            iterations: 40
          # Measured at ~2 min per iteration (stack up, converge, a 250 ms toxic
          # window, teardown), so 40 lands near 80 min. Sized from a real run
          # rather than copied from a neighbour: this one races a 500 ms budget,
          # and the soak exists to find out whether that margin holds.
          - scenario: c16_pull_on_miss_rescues_lagging_follower
            iterations: 40
          # Two full-fleet stop/starts' worth of work per iteration (the fleet
          # comes down and back up once, plus 20 data-plane steps either side),
          # measured at ~2 min — the same per-iteration cost as C16, so the same
          # count lands in the same place against the 100 min budget.
          - scenario: c15_flow_state_survives_a_full_cluster_restart
            iterations: 40
          # A single write-then-dispatch check, no restart -- the cheapest
          # per-iteration cost of the two front-door scenarios. Measured at
          # ~18s/iteration (stack up, two imposter writes, two route writes,
          # four real dispatches through the two non-writer nodes, teardown),
          # so 100 lands at ~30 min against the 100 min budget. Capped at 100
          # like this file's other single-write scenarios rather than filled
          # to the budget -- more iterations of something this cheap buys
          # little extra flake coverage.
          - scenario: c17_routes_converge
            iterations: 100
          # One full-fleet stop/start (three imposters, one three-route write,
          # six real dispatches before the restart and six after), measured at
          # ~40s/iteration -- cheaper than C15-flow's restart because there is
          # no scripted flow-state replay, only route-table reconciliation. 80
          # iterations lands at ~53 min against the 100 min budget, leaving
          # headroom for a CI runner slower than the one this was measured on.
          - scenario: c18_routes_survive_a_full_cluster_restart
            iterations: 80
          # Imposter sources (#137). Every one of these brings up a fourth
          # container (the counting origin) alongside the fleet. Sized from
          # per-iteration wall clock measured against a pre-built image, the
          # same way this job runs them.
          #
          # C20 is a stack-up, one declare, two pulls and a convergence check —
          # measured at ~18s/iteration, the same shape and cost as C17, so it
          # gets the same 100 and lands near 30 min against the 100 min budget.
          - scenario: c20_source_pull_converges_and_fetches_once
            iterations: 100
          # C21 carries two irreducible 40s measurement windows on top of an
          # election and a poll-driven convergence — measured at ~108s, the most
          # expensive per iteration in the suite. 50 lands near 90 min. Do not
          # raise it without re-measuring, and never buy headroom by shortening
          # the windows: the rate bound is derived from their length.
          - scenario: c21_tracking_poll_is_leader_only_and_survives_failover
            iterations: 50
          # One full-fleet stop/start on top of two sources and a hand edit,
          # measured at ~40s/iteration — the same cost as C18's restart, so the
          # same 80, landing near 53 min.
          - scenario: c22_sources_survive_a_full_cluster_restart
            iterations: 80
          # Stack up, one declare, one hand edit, two pulls, no restart —
          # measured at ~18s/iteration, so 100 lands near 30 min.
          - scenario: c23_drift_flags_and_pull_overwrites
            iterations: 100
          # Stack up, two tenancy writes, one imposter, then 18 probes (6 actions
          # x 3 nodes) — measured at ~18s/iteration on a warm image, the same
          # shape and cost as C17/C20/C23, so the same 100, landing near 30 min.
          # Measure with the image already built: a run that rebuilds the
          # container absorbs ~90s and is not the per-iteration cost.
          - scenario: c24_rbac_enforcement_is_identical_through_any_node
            iterations: 100
          # A partition, a revocation on the majority, a heal, and a polled
          # convergence window — measured at ~40s/iteration, the same cost as
          # C18's and C22's restarts, so the same 80, landing near 53 min. Rides
          # the chaos overlay as well as the tenancy one, which is what makes the
          # partition possible at all.
          - scenario: c25_key_revocation_survives_a_partition
            iterations: 80
          # One full-fleet stop/start on top of a four-write session — measured
          # at ~40s/iteration, identical to C18/C22, so the same 80 (~53 min).
          - scenario: c26_audit_chain_survives_a_full_cluster_restart
            iterations: 80
          # Stack up, two tenants, two principals, two imposters, a handful of
          # refusal probes and six data-plane reads, no restart — measured at
          # ~18s/iteration, so 100 lands near 30 min.
          - scenario: c27_tenancy_isolates_ownership_but_not_the_data_plane
            iterations: 100
          # The verification-plane family (#228). Each iteration carries at
          # least one kill-or-partition plus its convergence waits, so these
          # sit in the C4/C6 band; C10's two kill→restart phases and C30's
          # 3.5k eviction-overflow spray are the two heaviest bodies in the
          # whole matrix and are tiered accordingly.
          # Measured at ~147s/iteration (kill + restart + three convergence
          # gates), so 30 lands near 74 min.
          - scenario: c28_fleet_journal_is_exact_under_node_kill
            iterations: 30
          # Partition + heal + budget measurement — locally ~35s/iteration
          # warm, so 40 lands near 23 min; C4's band on a cold runner.
          - scenario: c29_partial_reads_answer_within_budget_and_count_themselves
            iterations: 40
          # Three walk rounds around a kill/restart plus a 3.5k
          # eviction-overflow spray — locally ~60s/iteration, so 25 lands
          # near 25 min warm and stays safe if the spray doubles cold.
          - scenario: c30_vector_cursor_walk_survives_membership_change
            iterations: 25
          # Three spray/clear probes on the faketime fleet, no kills —
          # locally ~35s/iteration, so 40 lands near 23 min warm.
          - scenario: c12_clears_are_exact_under_clock_skew
            iterations: 40
          # A 3-node racing window plus two settle rounds against the
          # in-network origin — locally ~35s/iteration, so 40 lands near
          # 23 min warm.
          - scenario: c11_concurrent_recording_loses_nothing
            iterations: 40
          # The heaviest body here besides C28: two kill→restart phases, each
          # with a 3s-latency origin holding claims open — locally
          # ~110s/iteration, so 20 lands near 37 min warm, ~75 min if a cold
          # runner doubles it. Validate all five against the first nightly's
          # step summary and retune.
          - scenario: c10_proxy_once_survives_owner_and_leader_kills
            iterations: 20

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A quarantine pointing at a closed issue means the bug was fixed and the
      # scenario was never turned back on. Only the nightly has a token, so only
      # the nightly can catch it.
      - name: Chaos quarantine tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/chaos-quarantine.sh check

      - name: Should this scenario run
        id: gate
        run: |
          set -euo pipefail
          want='${{ github.event.inputs.scenario }}'
          if [ -n "$want" ] && [ "$want" != '${{ matrix.scenario }}' ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif scripts/chaos-quarantine.sh list | grep -qw -- '${{ matrix.scenario }}'; then
            echo "::notice::${{ matrix.scenario }} is quarantined; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # Same reservation the PR-time tier makes, and the soak needs it more: it
      # brings the fleet up once per iteration, so it rolls the dice on issue
      # #117 up to 100 times per job instead of 18. See the long comment in
      # ci.yml; the list is pinned by a test.
      - name: Reserve the tier's published ports from the ephemeral range
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=34790,36300,36400,36500-36501,39090,42525,45251-45253,45261-45263,46525,48474,49901
          # Assert the read-back, do not merely print it: `sysctl <key>` exits 0
          # whatever the value is, so echoing it would prove nothing about a
          # partially applied or silently truncated write.
          test "$(sysctl -n net.ipv4.ip_local_reserved_ports)" = "34790,36300,36400,36500-36501,39090,42525,45251-45253,45261-45263,46525,48474,49901"

      # Once per job rather than once per iteration: the image is identical
      # across iterations, and rebuilding it 100 times would dominate the budget.
      - name: Build the image once
        if: steps.gate.outputs.run == 'true'
        run: docker compose -f deploy/compose/docker-compose.yml build

      - name: Soak
        if: steps.gate.outputs.run == 'true'
        env:
          CHAOS_LOG_DIR: ${{ runner.temp }}/chaos-logs
        run: |
          set -euo pipefail
          override='${{ github.event.inputs.iterations }}'
          n='${{ matrix.iterations }}'
          if [ -n "$override" ] && [ "$override" != "0" ]; then n="$override"; fi
          echo "running ${{ matrix.scenario }} x$n"
          start=$(date +%s)
          for i in $(seq 1 "$n"); do
            echo "::group::iteration $i/$n"
            # A single failure is the whole point of the soak -- stop at it, so
            # the uploaded logs belong to the failure and not to a later run
            # that overwrote them.
            # Through the floor check: `--exact` naming a scenario that has since
            # been renamed matches nothing, and libtest then reports
            # `0 passed` and exits 0 — a soak that soaked nothing, every night,
            # indefinitely. One scenario per iteration, so the floor is 1.
            cargo test -p cluster-chaos --test scenarios -- \
              --ignored --exact '${{ matrix.scenario }}' \
              | scripts/assert-scenarios-ran.sh --assert 1
            echo "::endgroup::"
          done
          elapsed=$(( $(date +%s) - start ))
          # Published so the iteration table above can be tuned against measured
          # wall clock rather than guesses.
          {
            echo "### ${{ matrix.scenario }}"
            echo ""
            echo "\`$n\` iterations in \`${elapsed}s\` (\`$(( elapsed / n ))s\`/iteration)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure logs
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chaos-logs-${{ matrix.scenario }}
          path: ${{ runner.temp }}/chaos-logs
          if-no-files-found: ignore
