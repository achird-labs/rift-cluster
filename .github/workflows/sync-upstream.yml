name: Sync upstream Rift

# Keeps the vendor/rift submodule pointed at the latest public Rift `master`.
# Runs daily and on demand; opens a PR so the bump is reviewed before merge.
on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Bump vendor/rift to upstream master
        id: bump
        run: |
          git submodule update --remote --recursive vendor/rift
          cd vendor/rift
          echo "rev=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify enterprise workspace builds against new upstream
        run: cargo check --workspace

      - name: Open sync PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sync/upstream-rift
          title: "chore: sync upstream Rift (${{ steps.bump.outputs.rev }})"
          commit-message: "chore: bump vendor/rift to ${{ steps.bump.outputs.rev }}"
          body: |
            Automated bump of the `vendor/rift` submodule to the latest public Rift `master`.

            Upstream tip: `${{ steps.bump.outputs.rev }}` — ${{ steps.bump.outputs.subject }}

            The workspace `cargo check` passed against this revision. Review the diff and merge.
          labels: upstream-sync
          delete-branch: true
