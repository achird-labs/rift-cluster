# Publish the interactive walkthrough in docs/explained/ to GitHub Pages.
#
# The pages are static HTML with no build step, so this job only uploads the folder and deploys
# it. It runs on pushes to master that touch the folder (or this file), and by hand. It is kept
# separate from `ci.yml` so the Pages permissions below are granted to this one job and nothing
# else inherits them.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Docs pages

on:
  push:
    branches: [master]
    paths:
      - "docs/explained/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/explained
      - id: deployment
        uses: actions/deploy-pages@v4
