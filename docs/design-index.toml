# Design-doc verification index — read by scripts/design-check.py.
#
# One table per normative or explanatory design document. `verified_sha` is the commit at which a
# person (or a reviewed PR) last confirmed the document describes what the code does; `code` lists
# the source globs the document describes. A document is STALE when any file matching `code`, or
# any file citing the document, changed after `verified_sha`. Re-verify with:
#
#   scripts/design-check.py --mark-verified docs/architecture/03-control-plane.md
#
# after actually re-reading the document against the code — the tool records the claim, it does
# not make it true. `verified_sha = ""` means never verified; the report says so instead of
# pretending.
#
# status: current | amended (a D-n changed part of it; callouts in place) | superseded | draft

