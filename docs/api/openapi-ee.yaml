  /admin/tenants/{tenantId}/principals:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: createPrincipal
      summary: Mint a principal and bind it to this tenant
      description: >
        Terminates: mints an API key, hashes it, and returns the raw value
        in this one response — the control plane stores only the argon2id
        hash and a SHA-256-derived id, neither of which can reproduce it,
        so there is nothing for a later `GET` to leak. `Idempotency-Key`
        is refused (`400`) on this route: a retried request cannot
        recover the original response's key, so pretending the retry is
        safe would be dishonest.
      tags: [tenancy]
      x-rift-origin: ee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrincipalCreate'
      responses:
        '201':
          description: The minted principal, including its raw API key (shown once).
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedPrincipal'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Caller is not bound to the named tenant — indistinguishable
            from the tenant not existing at all (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/WriteTimeout'
