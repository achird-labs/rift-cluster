            Caller holds no fleet-scoped binding — indistinguishable from
            the route not existing for them (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >
        The admin API key (or a minted principal's API key), sent as the
        entire, raw `Authorization` header value — there is no `Bearer `
        prefix, and none is stripped server-side (the credential is hashed
        verbatim, see `crates/rift-cluster-server/src/principal.rs`). A
        client that sends `Authorization: Bearer <key>` is sending the
        wrong credential and will be answered `401`. Maps to a synthetic
        or resolved principal checked by this front's own RBAC gate
        against every request, terminated or proxied.

  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >
        Optimistic-concurrency precondition for a single-imposter write:
        either the exact token from a prior response's Rift-Cluster-Revision
        header (default:<port>@<revision>) or a bare revision integer.
        Absent, the write is last-writer-wins. A stale or mismatched value
        answers 409; sending it on a collection-wide mutation (which has
        no single record to condition on) answers 400.
      schema:
        type: string
        example: 'default:4545@17'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Client-chosen retry key for a mutating request. Mints a
        deterministic op id (a v5 derivation when the value is not itself
        a UUID) so a retried request with the same key dedups to the
        original committed response instead of re-applying. Explicitly
        refused with 400 on principal creation — not silently ignored:
        the key and principal id are minted per request before any op id
        exists, so a replayed request would commit nothing yet still
        answer 201 with a freshly minted key that was never stored. A
        client that sent the header believes its retry is safe, so the
        request is rejected rather than left to go on believing it. A
        keyed retry against an op that committed a `409` (revision
        conflict) dedups to that same `409` — the key does not make the
        conflict retryable. A client that wants to proceed after a `409`
        must rebase against the current state and retry with a *fresh*
        Idempotency-Key, not the one that produced the conflict.
      schema:
        type: string
        example: 8f14e45f-ceea-467e-bd3a-fce2f5c3f1e0
    TenantHeader:
      name: X-Rift-Tenant
      in: header
      required: false
      description: >
        Selects which of the caller's existing tenant bindings this
        request acts under; it never grants a binding the caller does not
        already hold. Absent, requests act as the default tenant. Ignored
        on tenancy routes, where the path segment names the tenant being
        administered instead.
      schema:
        type: string
        example: acme
    Port:
      name: port
      in: path
      required: true
      description: The imposter's port number.
      schema:
        type: integer
        minimum: 1
        maximum: 65535
    TenantId:
      name: tenantId
      in: path
      required: true
      description: The tenant record's id.
      schema:
        type: string
    PrincipalId:
      name: principalId
      in: path
      required: true
      description: A principal's id (derived from its credential, e.g. key:<sha256-prefix>).
      schema:
        type: string
    FlowId:
      name: flowId
      in: path
      required: true
      description: A correlated-isolation space's flow id.
      schema:
        type: string

  headers:
    RiftClusterRevision:
      description: >
        The committed log revision this response reflects. For a
        tenancy write it is <tenant>@<revision>, using the real tenant
        id. For an imposter/stub write the tenant segment is NOT the
        caller's real tenant — the code hardcodes the literal string
        `default`, so a write authorized as tenant `acme` still emits
        `default:<port>@<revision>`. Treat the whole token as opaque:
        feed it back verbatim as If-Match on a later write to the same
        record rather than constructing one from this template — a
        constructed value that gets the tenant segment wrong answers
        `400`.
      schema:
        type: string
        example: 'default:4545@17'
    RiftClusterOpId:
      description: >
        The op id a write committed (or parked) under. Present only on a
        terminated write's SUCCESS response (`200`/`201`/`202`/`204`) —
        a refusal (`refusal_response`, e.g. `400`/`404`/`409`) sets no
        headers at all, so those responses carry no op id. For a
        single-op mutation this is the same id the client's
        Idempotency-Key deterministically derives; a multi-op mutation
        (e.g. a batch `PUT /imposters`) instead carries a per-index
        derived id on each success, while its `202` parked path carries
        the base id — the "same id Idempotency-Key derives" equivalence
        holds only for single-op writes.
      schema:
        type: string
        format: uuid

  responses:
    BadData:
      description: Malformed or semantically invalid request (e.g. missing required port, If-Match on a collection route).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: >
        Authenticated, but the caller's role does not grant the action
        within a tenant they ARE bound to (distinct from the RFC-002 §8.4
        404 used for cross-tenant/unbound-tenant probes).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RevisionConflict:
      description: If-Match named a revision that no longer matches the stored record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Request body exceeded the configured maximum size.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: >
        No quorum to commit this write against, or the node is shutting
        down. The shutdown case is not specific to writes — it can also
        be answered by a read, since authentication itself runs behind
        the same gate (see the top-level description).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WriteTimeout:
      description: >
        The write did not commit within its deadline; its outcome is
        unknown at this node — it may still commit. Poll the op id (if
        one was returned) or retry with the same Idempotency-Key rather
        than assuming the write failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AcceptedParked:
      description: >
        Accepted under --cluster-admin-async: the write was durably parked
        and is committing in the background. Poll the returned op id
        rather than assuming this response's absence of a body reflects
        the final state.
      headers:
        Rift-Cluster-Op-Id:
          $ref: '#/components/headers/RiftClusterOpId'
      content:
        application/json:
          schema:
            type: object
            properties:
              opId:
                type: string
                format: uuid
              opIds:
                type: array
                items:
                  type: string
                  format: uuid
                description: Per-op ids for a multi-op mutation (e.g. a batch PUT /imposters).

  schemas:
    Error:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [code, type, message]
            properties:
              code:
                type: string
                description: A status-derived code (frozen for compatibility; not always the numeric status).
              type:
                type: string
                description: Stable symbolic error slug — new consumers should read this field.
              message:
                type: string

    Imposter:
      type: object
      description: >
        An imposter's stored configuration (upstream ImposterConfig,
        Mountebank-compatible plus Rift extensions). Non-exhaustive.
      properties:
        port:
          type: integer
        host:
          type: string
        protocol:
          type: string
          example: http
        name:
          type: string
        recordRequests:
          type: boolean
          default: false
        enabled:
          type: boolean
          default: true
        stubs:
          type: array
          items:
            $ref: '#/components/schemas/Stub'
      additionalProperties: true

    Stub:
      type: object
      description: One request-matching rule and its response(s). Non-exhaustive.
      properties:
        id:
          type: string
          description: Stable id (Rift extension); addressable via the by-id routes.
        scenarioName:
          type: string
        requiredScenarioState:
          type: string
        newScenarioState:
          type: string
        space:
          type: string
          description: Correlated-isolation scope; absent means globally eligible.
        routePattern:
          type: string
          example: '/users/:id'
        predicates:
          type: array
          items:
            type: object
            additionalProperties: true
        responses:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    RouteTable:
      type: object
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'

    Route:
      type: object
      required: [id, target]
      properties:
        id:
          type: string
          description: Unique and stable; how the admin API addresses one route.
        priority:
          type: integer
          default: 0
          description: Higher wins; ties fall through to specificity.
        match:
          type: object
          properties:
            host:
              type: string
              description: Exact or one-leading-wildcard-label host match.
            pathPrefix:
              type: string
            headers:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  value:
                    type: string
            method:
              type: string
        target:
          type: object
          required: [port]
          properties:
            port:
              type: integer
            stripPrefix:
              type: boolean
              default: false
            setHost:
              type: string
        enabled:
          type: boolean
          default: true

    TenantWrite:
      type: object
      required: [id, displayName]
      description: >
        `id` is required by this schema because `POST /admin/tenants`
        requires it (`400` otherwise). On `PUT /admin/tenants/{tenantId}`
        the path segment is authoritative, but a body `id` that disagrees
        with it is NOT silently ignored — it answers `400`, since the
        authorization decision was made against the path and honouring a
        disagreeing body id would authorize one record and write another.
      properties:
        id:
          type: string
          description: >
            Required on create (`POST`). On `PUT`, must either be omitted
            or match the path `tenantId` exactly — a mismatch is a `400`,
            not a silent override.
        displayName:
          type: string
        quotas:
          $ref: '#/components/schemas/Quotas'
        journalRetentionSecs:
          type: integer
          format: int64
          default: 0
          description: Seconds the request-journal shards keep this tenant's data; 0 = unlimited.

    Tenant:
      allOf:
        - $ref: '#/components/schemas/TenantWrite'
        - type: object
          properties:
            createdAtSecs:
              type: integer
              format: int64
            deleted:
              type: boolean

    Quotas:
      type: object
      properties:
        maxImposters:
          type: integer
          default: 1000
        maxStubsPerImposter:
          type: integer
          default: 1000
        maxFlowEntries:
          type: integer
          format: int64

    Role:
      type: string
      description: >
        A strict superset ladder: viewer subset of operator subset of
        editor subset of tenant-admin subset of fleet-admin. Only
        fleet-admin may hold a binding on the fleet scope (*).
      enum: [viewer, operator, editor, tenant-admin, fleet-admin]

    PrincipalCreate:
      type: object
      required: [displayName, role]
      properties:
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    PrincipalUpdate:
      type: object
      required: [displayName, disabled]
      properties:
        displayName:
          type: string
        disabled:
          type: boolean
          description: Required, not defaulted — an omitted field must not silently un-revoke a principal.

    Principal:
      type: object
      description: A principal as read back. Never carries credential material.
      required: [id, displayName, auth, disabled]
      properties:
        id:
          type: string
        displayName:
          type: string
        auth:
          type: string
          enum: [apiKey, oidc, mtlsSan]
          description: The kind of credential; never any part of its value.
        disabled:
          type: boolean
        role:
          $ref: '#/components/schemas/Role'

    IssuedPrincipal:
      type: object
      description: The one-time response to principal creation. apiKey appears nowhere else.
      required: [id, displayName, role, tenant, apiKey]
      properties:
        id:
          type: string
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        tenant:
          type: string
        apiKey:
          type: string
          description: Shown once. Not stored anywhere in recoverable form.

    Binding:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    AuditRow:
      type: object
      required: [tsSecs, tenant, action, resource, opId, revision, outcome]
      properties:
        tsSecs:
          type: integer
          format: int64
          description: The applying entry's replicated clock — identical on every replica.
        principal:
          type: string
          nullable: true
          description: Who issued the op; null for an unattributed (open-admin-plane) submission.
        tenant:
          type: string
          description: The tenant the op acted on. Never null — every op names exactly one.
        action:
          type: string
          description: The RFC-002 §4.1 action slug (matches the authorization decision's own action string).
        resource:
          type: string
          description: What was acted on — a port, an id, or "*" for a whole-scope op.
        opId:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
          description: The applying log index.
        outcome:
          type: object
          description: Either {"Applied":null} or {"Failed":{"reason":"..."}}.
          additionalProperties: true

    AuditSinkWrite:
      type: object
      required: [uri]
      properties:
        uri:
          type: string
        authRef:
          type: string
          description: Name of a credential the fleet already holds; never a raw credential.
        batchMaxRows:
          type: integer
          description: Omitted takes the server default, not zero (which would ship nothing forever).

    AuditSink:
      allOf:
        - $ref: '#/components/schemas/AuditSinkWrite'
        - type: object
          required: [batchMaxRows, revision]
          properties:
            batchMaxRows:
              type: integer
            revision:
              type: integer
              format: int64
              description: The revision of the AuditSinkPut that produced this record.
            exportStatus:
              type: object
              description: Present only on the leader (only it runs the exporter).
              properties:
                running:
                  type: boolean
                lastError:
                  type: string
                  nullable: true
                shippedRows:
                  type: integer
                  format: int64
                consecutiveFailures:
                  type: integer

    WhoAmI:
      type: object
      required: [bindings, authorizationDisabled]
      properties:
        principalId:
          type: string
          nullable: true
          description: Null under the open-admin-plane bypass (no principals configured, no API key).
        bindings:
          type: array
          items:
            type: object
            properties:
              tenant:
                type: string
              role:
                $ref: '#/components/schemas/Role'
        authorizationDisabled:
          type: boolean
          description: True when the fleet enforces nothing at all (distinct from an authenticated principal with zero bindings).
