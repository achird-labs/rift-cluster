        response is an `Imposter`, not a receipt for the deletion, exactly as
        `clearRequests` behaves.
      tags: [imposters]
      x-rift-origin: ee
      responses:
        '200':
          description: Cleared; answers the imposter as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Imposter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
