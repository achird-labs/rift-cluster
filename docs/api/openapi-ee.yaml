    get:
      operationId: listScenarios
      summary: List scenario FSM state for an imposter (upstream)
      description: >
        Scenario state is per correlated-isolation space, so the answer
        always names the `flowId` it was read under — the one the `flowId`
        query parameter selected, or the imposter's own default when it was
