                  flowId:
                    type: string
                    description: The flow the states were read under; echoed so a caller that sent none learns the default.
                  scenarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScenarioEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /imposters/{port}/scenarios/{scenarioName}/state:
    parameters:
      - $ref: '#/components/parameters/Port'
      - name: scenarioName
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setScenarioState
      summary: Set a scenario's FSM state (upstream)
      description: >
        Writes one scenario's state within one space. `flowId` selects the
        space; omitted, the write lands on the imposter's default flow, so a
        caller that means to steer one correlated scenario should always send
        it. Keys beyond the two named here are ignored rather than refused.
      tags: [upstream-core]
      x-rift-origin: upstream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  description: >
                    The state to move the scenario to. Absent answers `400`
                    ("missing required field", naming `state`).
                flowId:
                  type: string
                  description: Which space's slice of the scenario to write. Absent means the imposter's default flow.
      responses:
        '200':
          description: State set; the write echoed back as it was applied.
          content:
            application/json:
              schema:
                type: object
                required: [flowId, name, state]
                properties:
                  flowId:
                    type: string
                    description: The flow actually written — the resolved default when the request sent none.
                  name:
                    type: string
                    description: The scenario named in the path.
                  state:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /imposters/{port}/scenarios/reset:
    parameters:
      - $ref: '#/components/parameters/Port'
    post:
      operationId: resetScenarios
      summary: Reset every scenario's FSM state for an imposter (upstream)
      description: >
        Resets every scenario, but only within **one** space — the `flowId`
        sent, or the imposter's default flow. Never a global reset across
        flows.
      tags: [upstream-core]
      x-rift-origin: upstream
      requestBody:
        required: false
        description: >
          Optional. An entirely empty body is accepted and resets the
          imposter's default flow; a non-empty body that is not JSON answers
          `400` rather than being ignored.
        content:
          application/json:
            schema:
              type: object
              properties:
                flowId:
                  type: string
                  description: Which space to reset. Absent means the imposter's default flow.
      responses:
        '200':
          description: Reset, for the flow named in the body.
          content:
            application/json:
              schema:
                type: object
                required: [flowId, reset]
                properties:
                  flowId:
                    type: string
                    description: The flow actually reset — the resolved default when the request named none.
                  reset:
                    type: boolean
                    enum: [true]
                    description: >
                      Always `true`: the handler only reaches this body after
                      every scenario was cleared, and any failure answers an
                      error status instead. Pinned to the literal so a client
                      does not write a branch for a `false` that cannot arrive.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /imposters/{port}/spaces/{flowId}:
    parameters:
      - $ref: '#/components/parameters/Port'
      - $ref: '#/components/parameters/FlowId'
    get:
      operationId: getSpace
      summary: Read one correlated-isolation space (upstream)
      description: >
        The whole of one space in a single read: its scoped stubs, every
        scenario's state within it, and how many recorded requests resolved
        to it.
      tags: [upstream-core]
      x-rift-origin: upstream
      responses:
        '200':
          description: The space.
          content:
            application/json:
              schema:
                type: object
                required: [space, stubs, scenarios, numberOfRequests]
                properties:
                  space:
                    type: string
                    description: The flow id this space is keyed by (the path segment, echoed).
                  stubs:
                    type: array
                    description: >
                      The stubs scoped to this space, as raw `Stub` objects —
                      no `_links` envelope, unlike the imposter reads.
                    items:
                      $ref: '#/components/schemas/Stub'
                  scenarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScenarioEntry'
                  numberOfRequests:
                    type: integer
                    description: Recorded requests whose resolved flow id is this space.
                  owner:
                    type: integer
                    format: int64
                    description: >
                      The node id holding this flow's state (issue #359). A space *is* a
                      flow, and a flow is the only thing the ring assigns an owner to:
                      imposters, stubs and config are replicated to every node, so any
                      node serves them and none owns them. One port with several flows
                      therefore has several owners, one per flow.


                      A node that receives a request for a flow it does not own talks to
                      the owner rather than answering from its own copy, so this names
                      where that flow's state actually lives.


                      Decided by the flow id under this imposter's
                      `flowState.contextScope`, not by the id alone — under `fleet` scope
                      two imposters' same-named spaces are one flow with one owner.


                      **Absent, never guessed**, when no membership has been applied or
                      the imposter's scope could not be read: the field is omitted rather
                      than defaulted, because a wrong owner sends an operator to the
                      wrong node.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteSpace
      summary: Tear down one correlated-isolation space
      description: >
        Two independent halves (issue #224). The flow-state store is already clustered via
        `ClusteredFlowStore`, so this proxies to the local engine exactly as it always has —
        this issue does not touch that half, and the response below is that proxy's own body,
        unchanged. What #224 adds is the journal half: once the flow-state teardown actually
        succeeds, the cluster front additionally commits a Raft-replicated clear generation for
        this space (the same convergence primitive `DELETE .../savedRequests` commits for a
        whole port), so every node's own recorded-request journal starts dropping this space's
        pre-teardown entries too. A teardown that fails locally (404/409/etc.) commits nothing —
        there is nothing to converge on if the space was never actually torn down.
      tags: [imposters]
      x-rift-origin: ee
      responses:
        '200':
          description: Torn down.
          content:
            application/json:
              schema:
                type: object
                required: [space, tornDown]
                properties:
                  space:
                    type: string
                    description: The flow id torn down (the path segment, echoed).
                  tornDown:
                    type: boolean
                    enum: [true]
                    description: >
                      Always `true`: this body is only built after the
                      teardown succeeded, and a failure answers an error
                      status instead. Pinned to the literal so no client
                      writes a branch for a `false` that cannot arrive.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /imposters/{port}/spaces/{flowId}/stubs:
    parameters:
      - $ref: '#/components/parameters/Port'
      - $ref: '#/components/parameters/FlowId'
    get:
      operationId: listSpaceStubs
      summary: List stubs scoped to a space (upstream)
      tags: [upstream-core]
      x-rift-origin: upstream
      responses:
        '200':
          description: The space's stubs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stubs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Stub'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: addSpaceStub
      summary: Add a stub scoped to a space (upstream)
      tags: [upstream-core]
      x-rift-origin: upstream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Stub'
      responses:
        '200':
          description: The stub added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stub'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /admin/imposters/{port}/try:
    parameters:
      - $ref: '#/components/parameters/Port'
    post:
      operationId: tryImposter
      summary: Send a sample request to this imposter and return what it answered
      description: >
        Terminates. The console's **Send** button: it lets an operator find
        out whether a stub matches without leaving the admin origin, which a
        browser cannot do on its own — the console is served from the admin
        port, an imposter answers on its own, and a mock sends no CORS
        headers, so an in-page `fetch` is blocked for essentially every stub.


        This is the one admin route that makes the **server originate
        outbound HTTP on a caller's behalf**, so its containment is
        structural rather than configurable:


        * It names a **port, never a URL or host** — the host is hardcoded
          loopback and is not a parameter.

        * The port must be an imposter in the caller's own tenant. An
          unknown port and another tenant's port answer the identical
          RFC-002 §8.4 `404`, so this cannot be used to map which ports
          exist.

        * The scheme comes from the imposter's own configured `protocol`,
          never from the caller. For an `https` imposter the client accepts
          the imposter's self-signed certificate — the connection never
          leaves the box.

        * **Redirects are never followed.** A `3xx` is returned like any
          other answer, `Location` header and all. Following one is the only
          way this exchange could reach somewhere other than the loopback
          port the rules above pinned it to.


        Requires `imposter.try` (Operator and up). A try is not read-only in
        effect — it advances scenario state, appends to the request log and
        can trigger proxy recording — which is why it sits with the other
        Operator "disturb" actions rather than with `imposter.read`. A
        Viewer diagnosing a stub uses the console's `Copy curl` button
        instead, which needs no server surface.


        The exchange is bounded: **10 seconds** total (connect and
        exchange), and at most **1 MiB** of the imposter's response body is
        read back, after which `truncated` is `true`. This is a diagnosis
        surface, not a transfer surface.
      tags: [imposters]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TryRequest'
      responses:
        '200':
          description: >
            The exchange completed. **The imposter's own `4xx`/`5xx` arrives
            here too** — that is a successful try, with the imposter's
            status in `status`. Only failures of the endpoint itself (the
            dial, the budget) are non-`200`, so a client never has to guess
            whether a `502` came from the mock or from the attempt to reach
            it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TryResponse'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            No such imposter for this tenant, or owned by another tenant —
            byte-identical either way (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The try envelope exceeded the admin plane's request body limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: >
            The imposter's port could not be reached, **or** this node is not
            the one serving it on loopback — a committed imposter config does
            not by itself mean this node bound the port, and a try never dials
            a socket it cannot attribute to the imposter. Distinct from a `200`
            carrying the imposter's own `502`: this one means the exchange
            never happened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          description: The 10-second budget expired before the imposter answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/imposters/{port}/flow-state/{flowId}:
    parameters:
      - $ref: '#/components/parameters/Port'
      - $ref: '#/components/parameters/FlowId'
    delete:
      operationId: clearFlowState
      summary: Clear all flow-state entries for a space (upstream)
      description: >
        Idempotent: clearing a flow that holds nothing (or was never
        written) still answers `200`. The `404` is about the imposter, never
        about the flow.
      tags: [upstream-core]
      x-rift-origin: upstream
      responses:
        '200':
          description: Cleared.
          content:
            application/json:
              schema:
                type: object
                required: [flowId, cleared]
                properties:
                  flowId:
                    type: string
                    description: The flow cleared (the path segment, echoed).
                  cleared:
                    type: boolean
                    enum: [true]
                    description: >
                      Always `true`: the body is built only on success, and
                      because the clear is idempotent even an empty flow
                      reaches it. Pinned to the literal so no client branches
                      on a `false` that cannot arrive.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/imposters/{port}/flow-state/{flowId}/{key}:
    parameters:
      - $ref: '#/components/parameters/Port'
      - $ref: '#/components/parameters/FlowId'
      - name: key
        in: path
        required: true
        description: The flow-state entry's key.
        schema:
          type: string
    get:
      operationId: getFlowStateEntry
      summary: Read one flow-state entry (upstream)
      tags: [upstream-core]
      x-rift-origin: upstream
      responses:
        '200':
          description: The entry's value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowStateEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: putFlowStateEntry
      summary: Write one flow-state entry (upstream)
      tags: [upstream-core]
      x-rift-origin: upstream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  description: >
                    The value to store — any JSON, including `null`. The
                    handler tests for the key's *presence*, so an explicit
                    `"value": null` stores null, while omitting the key
                    answers `400` ("missing required field: value"). Keys
                    beyond `value` are ignored.
      responses:
        '200':
          description: Written; the stored entry echoed back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowStateEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
    delete:
      operationId: deleteFlowStateEntry
      summary: Delete one flow-state entry (upstream)
      tags: [upstream-core]
      x-rift-origin: upstream
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [flowId, key, deleted]
                properties:
                  flowId:
                    type: string
                  key:
                    type: string
                  deleted:
                    type: boolean
                    enum: [true]
                    description: >
                      Always `true`: the body is built only after the delete
                      succeeded, and a failure answers an error status
                      instead. Pinned to the literal so no client branches on
                      a `false` that cannot arrive.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------
  # ee: front door route table (issue #131) — no upstream equivalent
  # ---------------------------------------------------------------------
  /front-door/routes:
    put:
      operationId: putFrontDoorRoutes
      summary: Replace the caller's tenant's front-door route table
      description: >
        Terminates: whole-table replace, deterministic and pre-validated
        before commit, so the parsed table itself is what gets stored (no
        post-commit re-read — there is no upstream `/front-door/routes` to
        read from). Because it replaces the table wholesale, an unconditional
        `PUT` silently discards any edit committed since the caller read —
        send `If-Match` with the revision `getFrontDoorRoutes` answered to
        make the replace conditional.
      tags: [front-door]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IfMatchRouteTable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteTable'
      responses:
        '200':
          description: The stored table.
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteTable'
        '202':
          $ref: '#/components/responses/AcceptedParked'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Caller is not bound to the tenant named (`X-Rift-Tenant` or
            default) — indistinguishable from that tenant not existing
            (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/WriteTimeout'
    get:
      operationId: getFrontDoorRoutes
      summary: Read the caller's tenant's front-door route table
      description: >
        Terminates: this front door's only read path — a state-machine
        read, not a mutation, so it never reaches the write classifier or
        the proxy. There is no upstream `/front-door/routes` to fall back
        on. The table and its `Rift-Cluster-Revision` are read in one
        state-machine transaction, so the revision always describes exactly
        the body returned with it.
      tags: [front-door]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: The tenant's route table.
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteTable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Caller is not bound to the tenant named (`X-Rift-Tenant` or
            default) — indistinguishable from that tenant not existing
            (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /front-door/routes/{routeId}:
    delete:
      operationId: deleteFrontDoorRoute
      summary: Delete one front-door route by id
      description: >
        Terminates: idempotent at the state-machine level, but the admin
        surface still answers `404` for a route id that was never in the
        caller's own tenant's table (captured before the delete commits,
        the same shape as `deleteImposter`). A delete mutates the table, so
        it advances the table's revision and invalidates any outstanding
        `If-Match` against it.
      tags: [front-door]
      x-rift-origin: ee
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchRouteTable'
      responses:
        '200':
          description: The deleted route.
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '202':
          $ref: '#/components/responses/AcceptedParked'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No route with that id in the caller's tenant's table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/WriteTimeout'

  # ---------------------------------------------------------------------
  # ee: tenancy surface (RFC-002 §5) — no upstream equivalent
  # ---------------------------------------------------------------------
  /admin/tenants:
    post:
      operationId: createTenant
      summary: Create a tenant
      description: >
        Terminates. Fleet-scoped (`ClusterAdmin` / FleetAdmin only) — a
        caller unbound at the fleet scope gets the RFC-002 §8.4 `404`, not
        a `403`, so they cannot learn this route exists for them at all.
        The one `403` this route does answer is the CSRF check (see
        `CsrfHeader`): a cookie-authenticated request missing
        `X-Rift-CSRF` is refused before authorization is ever evaluated,
        so it is unrelated to the fleet-scope `404` above.
      tags: [tenancy]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantWrite'
      responses:
        '201':
          description: >
            Tenant created; body is empty (`terminate_tenancy` renders no
            body and omits `content-type` here — only principal creation
            returns a body).
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            Cookie-authenticated request missing the required
            `X-Rift-CSRF` header (see `CsrfHeader`) — the only `403` this
            fleet-scoped route answers; role-insufficient access is the
            `404` above, not this.
