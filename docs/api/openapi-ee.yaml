      description: >
        Upstream classifies this as `SYSTEM_READ`, which this front maps
        to `Action::ClusterAdmin` — **FleetAdmin only**, on a clustered
        node. Unauthenticated answers `401`; a caller bound to some
        tenant but not FleetAdmin answers `403`; a caller with no
        fleet-scope binding at all answers `404` (RFC-002 §8.4) —
        operators used to this route being open on a standalone node
        should expect all three on a `--cluster` node.
      tags: [upstream-core]
