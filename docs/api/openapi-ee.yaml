      tags: [imposters]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/JournalMatch'
      responses:
        '200':
          description: Requests cleared; answers the imposter as it now stands.
          headers:
            Rift-Cluster-Partial:
              $ref: '#/components/headers/RiftClusterPartial'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Imposter'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /imposters/{port}/verify:
    parameters:
      - $ref: '#/components/parameters/Port'
    post:
      operationId: verifyImposter
      summary: Run declared-expectation verification against recorded requests (upstream)
      description: >
        Counts — and optionally returns — the recorded requests matching a
        predicate set, so an SDK's `verify(match, times(n))` defers to the
        engine's own matcher instead of shipping the whole journal over the
        wire and re-evaluating predicates client-side. Every field of the
        body is optional, but the body itself is not: the handler parses the
        bytes it collected, so `{}` is the empty verification and a wholly
        absent body answers `400`.
      tags: [upstream-core]
      x-rift-origin: upstream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOptions'
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOutcome'
        '400':
          description: >
            Unparseable body, an `inject` predicate sent while
            `--allowInjection` is off (the same gate the stub doors apply),
            or an `inject` predicate that failed while evaluating. The last
            is a `400` and not a `500` on purpose — the script that failed
            is the caller's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

