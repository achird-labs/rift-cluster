          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/WriteTimeout'

  # ---------------------------------------------------------------------
  # ee: the fleet request journal (issue #362) — the tenant's whole journal
  # as one merged, cursor-exact read, and its live sibling. Replaces a
  # client-side fan-out that read N imposters per poll and merged them in
  # the browser.
  # ---------------------------------------------------------------------
  /admin/requests:
    get:
      operationId: readFleetRequests
      summary: The tenant's recorded requests across every imposter, merged and resumable
      description: >
        Terminates. `GET /imposters/{port}/savedRequests` across every imposter the caller's
        tenant owns, merged server-side into one ordered, resumable answer.

        **Ordering is the journal's, not the network's.** Rows are ordered by each request's own
        recorded timestamp. That timestamp is stamped by whichever node served the request, so
        entries recorded within milliseconds of each other on clock-skewed nodes can still
        transpose — there is no fleet-wide sequence and this endpoint does not invent one. What
        it removes is the *other* source of disorder: assembling this view client-side ordered
        rows by which of N responses arrived first.

        **One cursor, not N.** `cursor` in the response is a single opaque token covering every
        port this answer covers; pass it back as `since` for the next page. Within the covered
        set the walk is gapless and duplicate-free per shard, exactly as the per-imposter cursor
        is. A per-imposter token presented here is refused with a `400` that says so, rather
        than misread as a fleet position.

        **The cap is stated.** A tenant may own more imposters than one answer covers. Coverage
        ranks ports by most recent activity and keeps `--cluster-fleet-journal-port-cap` of them
        (default 100); `coverage.omitted` names every port left out and `coverage.capped` says
        whether the cap bit at all. Nothing is dropped silently.

        **`joined`** names covered ports that had no position in the presented cursor and whose
        history was therefore replayed — the ports a resuming client may see duplicates from.
        On a baseline read (no `since`) that is every covered port, by definition.

        No `match` parameter: the merge path evaluates no predicates, so a predicate-scoped
        fleet read would answer with the whole tenant's requests instead of the caller's subset.
        Predicate-scoped reads stay per-imposter.

        Authorized as the ordinary `imposter.read` under `X-Rift-Tenant`. It needs no FleetAdmin
        gate — unlike `GET /events`, whose payload spans every tenant — because its port set is
        the caller's tenant's own imposters and nothing else can enter the walk.
      tags: [imposters]
      x-rift-origin: ee
      parameters:
        - name: since
          in: query
          required: false
          description: >
            A cursor token from a previous answer's `cursor` field or `x-rift-next-index`
            header. Absent means a baseline read: every covered port's retained history.
            Malformed, wrong-scope and unknown-version tokens are all refused with `400` rather
            than defaulted — defaulting would either replay the whole journal or silently skip
            everything recorded since the token went stale.
          schema:
            type: string
      responses:
        '200':
          description: The merged page, its resumption cursor, and its stated coverage.
          headers:
            x-rift-next-index:
              description: The same token as the body's `cursor`, for parity with the per-imposter read.
              schema:
                type: string
            x-rift-truncated:
              description: Retention dropped entries this reader had not reached, on at least one covered port.
              schema:
                type: boolean
            Rift-Cluster-Partial:
              description: >
                At least one covered port's merged view is short — a peer was unreachable, or a
                crash-restarted writer's entries are gone. Never set by a coverage omission,
                which is a different fact and is reported in `coverage`.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetRequestPage'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/requests/stream:
    get:
      operationId: streamFleetRequests
      summary: Live tail of the tenant's recorded requests across every imposter (SSE)
      description: >
        The live sibling of `GET /admin/requests`, and the fleet-wide counterpart of
        `GET /imposters/{port}/savedRequests/stream`. Answers `text/event-stream`.

        Every property that route documents holds here, for the same reasons and with the same
        token vocabulary: one contract shared with the cursor read, `Last-Event-ID` resuming
        gaplessly and without duplicates per shard, and a declared `clusterTailLatencyMs`
        bounding how late a peer's entry can arrive.

        **Events.** `hello` first, carrying `engineVersion`, `types` (always `["requests"]`),
        `scope` (always `"fleet"`), `clusterTailLatencyMs`, `cursor`, and `coverage`. Then
        `request` events whose `data` is `{port, flowId, request}`, plus `index` **only** for
        entries this node wrote. `coverage` whenever the covered set changes — the cap is
        dynamic, so a client whose view narrowed or widened is told rather than left to guess.
        `lagged` when retention evicted entries this reader had not reached. `partial` on every
        transition of the degraded state. `: ping` every 15 s.

        **A connect never replays**, per port: a port entering coverage — at connect or later —
        starts from its current position and emits nothing retroactively, so a widening view
        cannot look like a burst of traffic that never happened. Poll `GET /admin/requests` for
        history.
      tags: [imposters]
      x-rift-origin: ee
      responses:
        '200':
          description: >
            An open SSE stream. Ends only when the client disconnects or the node stops.
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  Server-Sent Events framing. Each event is `event:`, an optional `id:` carrying
                  the resumption cursor, and a `data:` JSON line.
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------------
  # ee: imposter sources (issue #239 read surface; #253 promotes the write
  # verbs the cluster port already served — declare, delete, pull now — to
  # this RBAC'd front, tenant-resolved rather than fixed to `default`)
  # ---------------------------------------------------------------------
  /admin/sources:
    get:
      operationId: listSources
      summary: The tenant's imposter sources, with this node's poll status apart
      description: >
        Terminates. The `sources` half is the fleet-replicated projection,
        id-ascending and byte-identical on every converged node — diffing two
        nodes' answers is how an operator checks a `SourcePut` has converged.
        The `nodeLocal` half is true of the answering node only: a poll
        failure is deliberately never replicated (a log entry per failure is
        the log growth the digest short-circuit exists to prevent), so it may
        differ across the fleet and is kept structurally apart rather than
        flattened into the record. Requires `source.read` (Viewer and up).
      tags: [sources]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: The tenant's declared sources, plus this node's poll status.
          content:
            application/json:
              schema:
                type: object
                required: [sources, nodeLocal]
                properties:
                  sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/SourceRecord'
                  nodeLocal:
                    $ref: '#/components/schemas/SourcesNodeLocal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Caller holds no binding in the tenant in view (RFC-002 §8.4 — not a 403).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: putSource
      summary: Declare (upsert by id) an imposter source
      description: >
        Terminates: commits a `SourcePut` op and answers `200` with the
        stored record. An upsert, not a create-vs-replace distinction — the
        same `id` re-declared replaces the prior declaration. Requires
        `imposter.write` (Editor and up) — deliberately not a dedicated
        `source.write`: the audit stream already names this op
        `imposter.write` (it is exactly as consequential as `PUT
        /imposters`, because that is what a pull ultimately produces), and
        the read side above is the lighter, separately-gated
        `source.read`. A `uri` carrying embedded userinfo
        (`user:pass@host`) is refused before the write reaches the
        replicated log — name a credential with `authRef` instead. No
        `If-Match`: a source row has no revision surface of its own to
        condition on, and this is an idempotent upsert, not a
        read-modify-write.
      tags: [sources]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceWrite'
      responses:
        '200':
          description: The source as stored (an upsert, so this is also the shape a replace answers).
          headers:
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRecord'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Caller holds no binding in the tenant named by `X-Rift-Tenant` (RFC-002 §8.4 — not a 403).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /admin/sources/{sourceId}:
    get:
      operationId: getSource
      summary: One imposter source
      description: >
        Terminates. The same two-part shape as the list — see `GET
        /admin/sources` for why the replicated record and this node's poll
        status never merge. Requires `source.read` (Viewer and up).
      tags: [sources]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: sourceId
          in: path
          required: true
          description: The source's declared id, unique within its tenant.
          schema:
            type: string
      responses:
        '200':
          description: The source, plus this node's poll status for it.
          content:
            application/json:
              schema:
                type: object
                required: [source, nodeLocal]
                properties:
                  source:
                    $ref: '#/components/schemas/SourceRecord'
                  nodeLocal:
                    $ref: '#/components/schemas/SourcesNodeLocal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >
            No such source in the tenant in view. Byte-identical whether the
            id never existed, exists in another tenant, or the caller holds
            no binding here at all (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteSource
      summary: Stop tracking a source
      description: >
        Terminates: commits a `SourceDelete` op and answers `200` with the
        committed revision. Idempotent — deleting an absent id commits and
        answers the same as deleting one that exists, exactly like
        `DeleteImposter`, so there is no "unknown source" 404 the way a
        pull of an absent id has. The imposters this source owned stay
        bound; only their provenance is cleared — orphaned, never torn
        down. Requires `imposter.delete` (Editor and up). No `If-Match` —
        see `putSource`'s description for why.
      tags: [sources]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CsrfHeader'
        - name: sourceId
          in: path
          required: true
          description: The source's declared id, unique within its tenant.
          schema:
            type: string
      responses:
        '200':
          description: The source is no longer tracked.
          headers:
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision:
                    type: integer
                    format: int64
                    description: The log index this delete committed at.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Caller holds no binding in the tenant named by `X-Rift-Tenant` (RFC-002 §8.4 — not a 403).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /admin/sources/{sourceId}/pull:
    post:
      operationId: pullSource
      summary: Fetch a source now and apply what it produced
      description: >
        Terminates: fetches the source's `uri` outside the replicated log
        (fetching is not deterministic), then commits what was fetched as a
        `SourcePullResult` op — an ordinary validated write every replica
        applies identically. Identical content to what the source last
        applied writes no log entry at all (`unchanged: true`) rather than
        re-churning state on every poll of a stable document. Requires
        `imposter.write` (Editor and up) — the same action `putSource`
        does, and for the same reason: a pull is what actually produces the
        `PUT /imposters`-equivalent write. No `If-Match` — see
        `putSource`'s description.
      tags: [sources]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CsrfHeader'
        - name: sourceId
          in: path
          required: true
          description: The source's declared id, unique within its tenant.
          schema:
            type: string
      responses:
        '200':
          description: >
            What the pull did. Carries no `Rift-Cluster-Op-Id`: unlike
            `putSource`/`deleteSource`, this route's underlying write path
            is shared byte-for-byte with the cluster port's pre-existing
            pull (issue #134) and does not surface the op id it minted
            internally — `revision` in the body is what a client
            correlates a pull with instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullReport'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            No such source in the tenant in view. Byte-identical whether the
            id never existed, exists in another tenant, or the caller holds
            no binding here at all (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: The source's own host refused or failed the fetch; the cluster's write path was never reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'

  # ---------------------------------------------------------------------
  # ee: identity / contract introspection
  # ---------------------------------------------------------------------
  /admin/whoami:
    get:
      operationId: getWhoAmI
      summary: The caller's own resolved identity and tenant bindings
      description: >
        Terminates. The one admin route with no action to authorize — it
        reports the caller's own identity and nothing else, so there is
        nothing beyond authentication to check. `authorizationDisabled:
        true` with a `null` principal means the fleet defines no
        principals and no API key (the open-admin-plane bypass), reported
        honestly rather than made to look like a normal identity.
      tags: [meta]
      x-rift-origin: ee
      responses:
        '200':
          description: The caller's identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmI'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'

  /openapi.json:
    get:
      operationId: getOpenApiContract
      summary: This hand-authored OpenAPI contract, served as JSON
      description: >
        Terminates. Authenticated but actionless, the same posture as
        `getWhoAmI` — the document describes the shape of the whole admin
        surface, so serving it unauthenticated would hand a scanner a map
        of every tenancy and audit route for free. Carries no tenant data,
        so any authenticated principal reads the same bytes.
      tags: [meta]
      x-rift-origin: ee
      responses:
        '200':
          description: This contract, as JSON.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: >
                  Free-form by design, and the one place in this document
                  where that is not a gap: the body is an arbitrary OpenAPI
                  3.1 document — this very document, served as JSON. Pinning
                  its properties here would mean restating the OpenAPI
                  meta-schema inside an OpenAPI document, and the restatement
                  would rot the moment the spec version moved. Consumers
                  should parse it with an OpenAPI parser, not a generated
                  type.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  # ---------------------------------------------------------------------
  # ee: the fleet's operator-set name (issue #373) — Raft-replicated, fleet-
  # scoped, published on `getFleetMembers`/`/_cluster/members`; no upstream
  # equivalent
  # ---------------------------------------------------------------------
  /admin/fleet/name:
    put:
      operationId: putFleetName
      summary: Set or rename the fleet's operator-set name
      description: >
        Terminates. Fleet-scoped (`ClusterAdmin` / FleetAdmin only) — same
        tier as `putAuditSink`, for the same reason: this is a fleet-wide
        rename, not a tenant-scoped one. Replicated via a new `ControlOp`
        rather than a per-node command-line flag, so every node — and every
        console session, regardless of which node it happens to be talking
        to — agrees on one name. Setting the first name and renaming are the
        same write: the new value replaces whatever was there.
      tags: [fleet]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FleetNameWrite'
      responses:
        '200':
          description: >
            Name stored; body is empty (`terminate_tenancy` renders no
            body — only principal creation returns one).
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Caller lacks fleet-scoped access (RFC-002 §8.4 — not a 403).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/WriteTimeout'

  # ---------------------------------------------------------------------
  # ee: fleet projection (RFC-006 §5.2) — read-only admin-port mirror of
  # /_cluster/* on the cluster port; no upstream equivalent
  # ---------------------------------------------------------------------
  /_fleet/members:
    get:
      operationId: getFleetMembers
      summary: This node's view of raft membership (fleet projection)
      description: >
        Terminates. Read-only admin-port projection of the operator
        surface that otherwise rides the cluster port behind the HMAC
        secret a browser can never hold (RFC-006 §5.2) — same JSON shape
        as `/_cluster/members`, rendered by the same builder
        (`cluster_api.rs`'s `members_body`) so the two ports cannot
        drift. Fleet-scoped: `ClusterAdmin`, FleetAdmin only — settled in
        RFC-006 §12 Q3 (`docs/architecture/08-tenancy-security.md`),
        because this is the same infrastructure-inventory category
        `principal::map_action` already routes to `Action::ClusterAdmin`
        (`/config`, `/metrics`, `/logs`), and projecting cluster-port data
        onto the admin port at a lower tier would be a privilege
        reduction, not a convenience.
      tags: [fleet]
      x-rift-origin: ee
      responses:
        '200':
          description: This node's raft membership view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetMembers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >
            Caller lacks fleet-scoped (`ClusterAdmin`) access —
            indistinguishable from a route that does not exist for this
            caller (RFC-002 §8.4), the same posture `listTenants` and
            `getAuditSink` already use for fleet-scoped denial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'

  /_fleet/health:
    get:
      operationId: getFleetHealth
      summary: This node's readiness and ring view (fleet projection)
      description: >
        Terminates. Same projection as `getFleetMembers`, rendering
        `cluster_api.rs`'s `health_body` — byte-identical to
        `/_cluster/health` on the cluster port. Fleet-scoped
        (`ClusterAdmin`, FleetAdmin only); see `getFleetMembers` for the
        settled RFC-006 §12 Q3 reasoning.
      tags: [fleet]
      x-rift-origin: ee
      responses:
        '200':
          description: This node's readiness and ring view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >
            Caller lacks fleet-scoped (`ClusterAdmin`) access —
            indistinguishable from a route that does not exist for this
            caller (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'

  /_fleet/ops/{opId}:
    parameters:
      - $ref: '#/components/parameters/OpId'
    get:
      operationId: getFleetOp
      summary: An op's commit status (fleet projection)
      description: >
        Terminates. Same projection as `getFleetMembers`, rendering
        `cluster_api.rs`'s `op_body` — the poll target for a `202`-parked
        or async-committed write's op id, on the admin port instead of the
        cluster port. Fleet-scoped (`ClusterAdmin`, FleetAdmin only); see
        `getFleetMembers` for the settled RFC-006 §12 Q3 reasoning.
      tags: [fleet]
      x-rift-origin: ee
      responses:
        '200':
          description: The op's status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetOpStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >
            Either of two indistinguishable cases: the op id names no op
            (unknown, or its dedup window lapsed — same as
            `/_cluster/ops/:id`) — a malformed id names no op the same
            way, so it 404s too, never `400` — or the caller lacks
            fleet-scoped (`ClusterAdmin`) access (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'

  # ---------------------------------------------------------------------
  # ee: session exchange (RFC-006 §5.3) — how a browser holds a
  # credential; no upstream equivalent
  # ---------------------------------------------------------------------
  /session:
    post:
      operationId: createSession
      summary: Exchange an API key for a session cookie
      description: >
        Terminates. Not a Raft write: the server verifies the key, then
        mints an HMAC-signed `{principal_id, issued_at, expiry}` token
        under the fleet's session-signing key (a control-plane record
        every node verifies from its own applied state) and returns it as
        an `HttpOnly` cookie — this is the one moment the long-lived API
        key transits the page (RFC-006 §9.3), so it belongs in component
        state only, never `localStorage` and never a URL, and should be
        dropped as soon as this call returns.

        The cookie proves authentication only. Every later request still
        resolves the principal's bindings from applied state, so
        disabling the principal or deleting a binding cuts a live session
        immediately, with the same committed-or-not semantics a bearer
        gets. There is no server-side session table and, deliberately,
        **no per-session revocation in v1** — the documented bounds are
        the 8-hour `Max-Age`, session-signing-key rotation (invalidates
        every outstanding session at once), and disabling the principal.
        This is a stated limit, not a gap.
      tags: [session]
      x-rift-origin: ee
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      responses:
        '200':
          description: Session established; body is empty.
          headers:
            Set-Cookie:
              description: >
                `rift_session=<token>; HttpOnly; Secure; SameSite=Strict;
                Max-Age=28800; Path=/`. `HttpOnly` means no script on the
                page — injected or legitimate — can read the token or the
                key it replaced; `Secure` confines it to TLS;
                `SameSite=Strict` is this cookie's first CSRF defense,
                backstopped by the `X-Rift-CSRF` header (`CsrfHeader`) on
                cookie-authenticated mutations; `Max-Age=28800` (8 hours)
                is the TTL bound noted in this operation's description.
              schema:
                type: string
                example: 'rift_session=<token>; HttpOnly; Secure; SameSite=Strict; Max-Age=28800; Path=/'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          description: The given API key does not verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteSession
      summary: Clear the session cookie
      description: >
        Terminates. Acts on the cookie the caller already holds, so it is
        exempt from `apiKeyAuth` the same way `createSession` is — there
        is no credential to check before clearing a cookie. Not a Raft
        write and not audited as a principal action: the server only ever
        mints this cookie at `POST /session`, never adopts a
        client-presented one, so there is no session-fixation case to
        guard against here.
      tags: [session]
      x-rift-origin: ee
      security: []
      responses:
        '204':
          description: Session cookie cleared; no body.
          headers:
            Set-Cookie:
              description: >
                `rift_session=; Max-Age=0; Path=/` — the browser drops the
                cookie immediately on receipt.
              schema:
                type: string
                example: 'rift_session=; Max-Age=0; Path=/'
        '503':
          $ref: '#/components/responses/Unavailable'

  # ---------------------------------------------------------------------
  # upstream: process-level / core admin surface
  # ---------------------------------------------------------------------
  /:
    get:
      operationId: getRoot
      summary: Core admin root (upstream)
      description: >
        Upstream classifies this as `SYSTEM_READ`, which this front maps
        to `Action::ClusterAdmin` — **FleetAdmin only**, on a clustered
        node. Unauthenticated answers `401`; a caller bound to some
        tenant but not FleetAdmin answers `403`; a caller with no
        fleet-scope binding at all answers `404` (RFC-002 §8.4) —
        operators used to this route being open on a standalone node
        should expect all three on a `--cluster` node.
      tags: [upstream-core]
      x-rift-origin: upstream
      responses:
        '200':
          description: >
            Upstream's own root response: a Mountebank-shaped discovery
            document and nothing else — three links, no node identity, no
            version.
          content:
            application/json:
              schema:
                type: object
                required: [_links]
                properties:
                  _links:
                    type: object
                    required: [imposters, config, logs]
                    properties:
                      imposters:
                        $ref: '#/components/schemas/Link'
                      config:
                        $ref: '#/components/schemas/Link'
                      logs:
                        $ref: '#/components/schemas/Link'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Caller holds no fleet-scoped binding — indistinguishable from
            the route not existing for them (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health:
    get:
      operationId: getHealth
      summary: Process health (upstream)
      description: >
        Upstream classifies this as `SYSTEM_READ`, which this front maps
        to `Action::ClusterAdmin` — **FleetAdmin only**, on a clustered
        node. Unauthenticated answers `401`; a caller bound to some
        tenant but not FleetAdmin answers `403`; a caller with no
        fleet-scope binding at all answers `404` (RFC-002 §8.4).
      tags: [upstream-core]
      x-rift-origin: upstream
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
                    description: >
                      Always the literal `ok`. This is a liveness probe with
                      no dependency checks behind it — the handler builds one
                      constant body, so an unhealthy node fails to answer at
                      all rather than answering some other status here.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Caller holds no fleet-scoped binding — indistinguishable from
            the route not existing for them (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /config:
    get:
      operationId: getConfig
      summary: The engine's effective startup configuration (upstream)
      description: >
        Upstream classifies this as `SYSTEM_READ`, which this front maps
        to `Action::ClusterAdmin` — **FleetAdmin only**, on a clustered
        node. A caller bound to some tenant but not FleetAdmin answers
        `403`; a caller with no fleet-scope binding at all answers `404`
        (RFC-002 §8.4).
      tags: [upstream-core]
      x-rift-origin: upstream
      responses:
        '200':
          description: Effective configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Caller holds no fleet-scoped binding — indistinguishable from
            the route not existing for them (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /logs:
    get:
      operationId: getLogs
      summary: In-process log buffer (upstream)
      description: >
        Upstream classifies this as `SYSTEM_READ`, which this front maps
        to `Action::ClusterAdmin` — **FleetAdmin only**, on a clustered
        node. A caller bound to some tenant but not FleetAdmin answers
        `403`; a caller with no fleet-scope binding at all answers `404`
        (RFC-002 §8.4).
      tags: [upstream-core]
      x-rift-origin: upstream
      parameters:
        - name: startIndex
          in: query
          required: false
          description: >
            First log index to return. Defaults to `0`. An unparseable value
            is **silently defaulted**, not refused — the handler parses with
            a fallback and never answers `400` for this parameter. Harmless
            only because the window it selects is advisory today (see the
            `200`); treat it as a hint, not a guarantee.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: endIndex
          in: query
          required: false
          description: >
            Last log index to return. Defaults to `100`. Silently defaulted
            on an unparseable value, exactly as `startIndex` is.
          schema:
            type: integer
            minimum: 0
            default: 100
      responses:
        '200':
          description: Log entries.
          content:
            application/json:
              schema:
                type: object
                required: [logs, _links]
                properties:
                  logs:
                    type: array
                    description: >
                      **Always empty today.** The endpoint exists for
                      Mountebank compatibility, but no in-process log buffer
                      is wired to it, so the handler emits a literal `[]`
                      whatever the index window says. Element shape is left
                      unconstrained rather than invented: nothing has ever
                      been served here, so any properties declared would be
                      a guess.
                    items: {}
                  _links:
                    type: object
                    required: [self]
                    properties:
                      self:
                        allOf:
                          - $ref: '#/components/schemas/Link'
                        description: >
                          Echoes the resolved window —
                          `/logs?startIndex=…&endIndex=…` — with the defaults
                          filled in, which is the only way to see what a
                          silently-defaulted parameter became.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Caller holds no fleet-scoped binding — indistinguishable from
            the route not existing for them (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus-format process metrics (upstream)
      description: >
        Upstream classifies this as `SYSTEM_READ`, which this front maps
        to `Action::ClusterAdmin` — **FleetAdmin only**, on a clustered
        node. A caller bound to some tenant but not FleetAdmin answers
        `403`; a caller with no fleet-scope binding at all answers `404`
        (RFC-002 §8.4).
      tags: [upstream-core]
      x-rift-origin: upstream
      responses:
        '200':
          description: Metrics in Prometheus exposition format.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Caller holds no fleet-scoped binding — indistinguishable from
            the route not existing for them (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/reload:
    post:
      operationId: reloadConfig
      summary: Reload configuration from disk (upstream)
      description: >
        Upstream classifies this as `SYSTEM_WRITE`, which this front maps
        to `Action::ClusterAdmin` — **FleetAdmin only**, on a clustered
        node. A caller bound to some tenant but not FleetAdmin answers
        `403`; a caller with no fleet-scope binding at all answers `404`
        (RFC-002 §8.4).
      tags: [upstream-core]
      x-rift-origin: upstream
      responses:
        '200':
          description: Reloaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReloadOutcome'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Caller holds no fleet-scoped binding — indistinguishable from
            the route not existing for them (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >
        The admin API key (or a minted principal's API key), sent as the
        entire, raw `Authorization` header value — there is no `Bearer `
        prefix, and none is stripped server-side (the credential is hashed
        verbatim, see `crates/rift-cluster-server/src/principal.rs`). A
        client that sends `Authorization: Bearer <key>` is sending the
        wrong credential and will be answered `401`. Maps to a synthetic
        or resolved principal checked by this front's own RBAC gate
        against every request, terminated or proxied.

  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >
        Optimistic-concurrency precondition for a single-imposter write:
        either the exact token from a prior response's Rift-Cluster-Revision
        header (default:<port>@<revision>) or a bare revision integer.
        Absent, the write is last-writer-wins. A stale or mismatched value
        answers 409; sending it on a collection-wide mutation (which has
        no single record to condition on) answers 400. The route-table
        form is a separate parameter (IfMatchRouteTable) because its
        grammar is portless — the two are not interchangeable, and sending
        one where the other is expected answers 400.
      schema:
        type: string
        example: 'default:4545@17'
    IfMatchRouteTable:
      name: If-Match
      in: header
      required: false
      description: >
        Optimistic-concurrency precondition for a front-door route-table
        write: the portless token default@<revision>, exactly as
        getFrontDoorRoutes answers it in its Rift-Cluster-Revision header,
        or a bare revision integer. Portless because the precondition is
        against the tenant's route table as a whole, not any one route —
        there is no port to name. A tenant whose table has never been
        written is at revision 0, so conditioning on 0 is how a first
        writer claims one. Both a whole-table PUT and a single-route
        DELETE advance the revision, so either invalidates an outstanding
        token. Absent, a PUT is a last-writer-wins whole-table replace and
        will silently discard a concurrent edit. A stale value answers
        409; a value this front cannot evaluate — a wildcard, a weak
        validator, a comma list, the ported default:<port>@<revision>
        form — answers 400.
      schema:
        type: string
        example: 'default@17'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Client-chosen retry key for a mutating request. Mints a
        deterministic op id (a v5 derivation when the value is not itself
        a UUID) so a retried request with the same key dedups to the
        original committed response instead of re-applying. Explicitly
        refused with 400 on principal creation — not silently ignored:
        the key and principal id are minted per request before any op id
        exists, so a replayed request would commit nothing yet still
        answer 201 with a freshly minted key that was never stored. A
        client that sent the header believes its retry is safe, so the
        request is rejected rather than left to go on believing it. A
        keyed retry against an op that committed a `409` (revision
        conflict) dedups to that same `409` — the key does not make the
        conflict retryable. A client that wants to proceed after a `409`
        must rebase against the current state and retry with a *fresh*
        Idempotency-Key, not the one that produced the conflict.
      schema:
        type: string
        example: 8f14e45f-ceea-467e-bd3a-fce2f5c3f1e0
    TenantHeader:
      name: X-Rift-Tenant
      in: header
      required: false
      description: >
        Selects which of the caller's existing tenant bindings this
        request acts under; it never grants a binding the caller does not
        already hold. Absent, requests act as the default tenant. Ignored
        on tenancy routes, where the path segment names the tenant being
        administered instead.
      schema:
        type: string
        example: acme
    Port:
      name: port
      in: path
      required: true
      description: The imposter's port number.
      schema:
        type: integer
        minimum: 1
        maximum: 65535
    TenantId:
      name: tenantId
      in: path
      required: true
      description: The tenant record's id.
      schema:
        type: string
    PrincipalId:
      name: principalId
      in: path
      required: true
      description: A principal's id (derived from its credential, e.g. key:<sha256-prefix>).
      schema:
        type: string
    FlowId:
      name: flowId
      in: path
      required: true
      description: A correlated-isolation space's flow id.
      schema:
        type: string
    FlowIdQuery:
      name: flowId
      in: query
      required: false
      description: >
        A correlated-isolation space's flow id, selected by query string
        rather than path. Absent, the imposter resolves its own default flow
        and the response says which one it used. A separate component from
        `FlowId` on purpose: that one is `in: path` and required, and the two
        locations are not interchangeable.
      schema:
        type: string
    OpId:
      name: opId
      in: path
      required: true
      description: >
        An op id, as minted for a terminated write (`Rift-Cluster-Op-Id`)
        or an `AcceptedParked` `202`'s body. A malformed id names no op
        the same way an unknown one does — both answer `404`, not `400`,
        so a probe cannot tell "badly formed" from "never existed".
      schema:
        type: string
        example: 8f14e45f-ceea-467e-bd3a-fce2f5c3f1e0
    CsrfHeader:
      name: X-Rift-CSRF
      in: header
      required: false
      description: >
        RFC-006 §5.3/§9.2 CSRF defense: a cookie-authenticated
        state-changing request (anything that would mutate state, sent
        with the `rift_session` cookie rather than an `Authorization`
        bearer) that omits this header is refused with `403`, checked
        before authorization runs. Send any non-empty value —
        `SameSite=Strict` already stops the cookie riding cross-site, so
        this header exists only to defeat the narrower case (a
        same-site-adjacent or misconfigured-CORS request) by requiring a
        custom header cross-origin HTML cannot attach without a preflight.
        Bearer-authenticated requests are exempt: a bearer cannot be
        attached to a request by a victim's browser in the first place,
        which is the entire attack this header defends against — so
        requiring it there would add friction without closing a real hole.
      schema:
        type: string
        example: '1'
    JournalSince:
      name: since
      in: query
      required: false
      description: >
        Journal cursor: return only entries recorded after this position, as
        previously reported by this endpoint's x-rift-next-index response
        header. Absent means a baseline read of everything still retained.

        On the clustered merge-on-read path this is an **opaque vector cursor**
        (issue #225) — a string, not an integer: it encodes a position per
        writer shard plus the clear generation it was issued under, because a
        scalar index names a position in no shard in particular once more than
        one node is recording. Round-trip it verbatim; do not parse it, and do
        not construct one. A bare `u64` is still accepted during the upgrade
        window and read as this node's own shard position.

        Unlike the audit journal's forgiving `since`, an unparseable value
        here answers 400 rather than taking a default — a cursor that
        silently restarted at zero would re-deliver the whole journal as if
        it were new traffic, and one that silently jumped to the end would
        hide everything recorded since it was issued.
      schema:
        type: string
        example: eyJ2IjoxLCJnZW4iOjAsInBvcyI6eyIxIjo0Mn19
    JournalMatch:
      name: match
      in: query
      required: false
      style: form
      explode: true
      description: >
        Repeatable filter clause; every clause supplied must match (AND).
        The grammar is closed — `method=<Verb>`, `path=<Path>`,
        `flow_id=<Value>`, or `header:<Name>=<Value>` — and a value outside
        it answers 400 rather than being ignored, because a filter that
        silently degraded to "match everything" would cross-contaminate
        correlated scenarios.
      schema:
        type: array
        items:
          type: string
      example: ['method=POST', 'header:Content-Type=application/json']

  headers:
    RiftClusterRevision:
      description: >
        The committed log revision this response reflects. For a
        tenancy write it is <tenant>@<revision>, using the real tenant
        id. For an imposter/stub write the tenant segment is NOT the
        caller's real tenant — the code hardcodes the literal string
        `default`, so a write authorized as tenant `acme` still emits
        `default:<port>@<revision>`. A front-door route-table read or
        write emits the portless `default@<revision>` (same hardcoded
        tenant segment); on a read it is the revision of the table in
        that same response's body. Treat the whole token as opaque:
        feed it back verbatim as If-Match on a later write to the same
        record rather than constructing one from this template — a
        constructed value that gets the tenant segment wrong answers
        `400`.
      schema:
        type: string
        example: 'default:4545@17'
    RiftClusterOpId:
      description: >
        The op id a write committed (or parked) under. Present only on a
        terminated write's SUCCESS response (`200`/`201`/`202`/`204`) —
        a refusal (`refusal_response`, e.g. `400`/`404`/`409`) sets no
        headers at all, so those responses carry no op id. For a
        single-op mutation this is the same id the client's
        Idempotency-Key deterministically derives; a multi-op mutation
        (e.g. a batch `PUT /imposters`) instead carries a per-index
        derived id on each success, while its `202` parked path carries
        the base id — the "same id Idempotency-Key derives" equivalence
        holds only for single-op writes.
      schema:
        type: string
        format: uuid
    XRiftNextIndex:
      description: >
        The cursor to send as `since` on the next read to continue exactly
        where this response stopped. Its **presence is the protocol**: a client
        probes for this header to discover whether cursoring is supported at
        all, rather than assuming a default and paging against a backend that
        cannot honour it (issue #603).

        On the clustered merge-on-read path (issue #225) the value is an
        **opaque vector cursor** — a string encoding a position per writer
        shard and the clear generation it was issued under. Round-trip it
        verbatim; never parse it. It is emitted on every merged read, including
        a degraded one: a `Rift-Cluster-Partial` answer is still a real
        position in every shard that did answer, so withholding the cursor
        there would strand a client mid-walk for the duration of a partition.
        Proxied per-node reads still carry upstream's own scalar index here,
        under the same "do not parse it" contract.
      schema:
        type: string
        example: eyJ2IjoxLCJnZW4iOjAsInBvcyI6eyIxIjo0Mn19
    XRiftTruncated:
      description: >
        Present, with the value `true`, when retention evicted entries the
        caller's `since` cursor had not yet read — the gap is unrecoverable
        and the client has silently missed requests. Emitted **only** when
        that is the case: there is no `false` form, so a client tests for the
        header's presence and never parses its value.
      schema:
        type: boolean
        enum: [true]
    RiftClusterPartial:
      description: >
        Two distinct reasons emit this header, never conflated by the response that carries it:

        A fleet merge-on-read (issue #223) could not confirm every roster peer within its
        budget — the merged journal entries, or the fleet `numberOfRequests` decoration on
        getImposter/listImposters. Emitted only when at least one peer was unreachable or too
        slow; never means a peer's data was dropped from the answer, since whatever the last
        anti-entropy pass cached for that peer still merges in — this says "possibly missing
        something newer," never "missing that peer entirely."

        A `?match=`-scoped `clearSavedRequests`/`clearRequests` (issue #223 review, B3 — #224
        left this deliberately unchanged): stamped unconditionally, not because a peer was
        unreachable but because a scoped clear is knowingly local-only *by design* — it never
        becomes the Raft-committed, fleet-converging write the unscoped form is.

        There is no `false` form either way, exactly like `x-rift-truncated`, and a Ch.12
        strict-mode gate asserts its absence on a fully healthy, unscoped answer.
      schema:
        type: boolean
        enum: [true]

  responses:
    BadData:
      description: Malformed or semantically invalid request (e.g. missing required port, If-Match on a collection route).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: >
        Authenticated, but denied for one of two reasons that share this
        status: (1) the caller's role does not grant the action within a
        tenant they ARE bound to (distinct from the RFC-002 §8.4 404 used
        for cross-tenant/unbound-tenant probes), or (2) a
        cookie-authenticated mutation omitted the required `X-Rift-CSRF`
        header (see `CsrfHeader`) — checked before authorization runs, so
        it can fire even on a route whose role-insufficient case answers
        404 instead of 403 (e.g. `createTenant`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RevisionConflict:
      description: >
        If-Match named a revision that no longer matches the stored
        record — a single imposter's, or a tenant's whole front-door route
        table. The write committed nothing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Request body exceeded the configured maximum size.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: >
        No quorum to commit this write against, or the node is shutting
        down. The shutdown case is not specific to writes — it can also
        be answered by a read, since authentication itself runs behind
        the same gate (see the top-level description).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WriteTimeout:
      description: >
        The write did not commit within its deadline; its outcome is
        unknown at this node — it may still commit. Poll the op id (if
        one was returned) or retry with the same Idempotency-Key rather
        than assuming the write failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AcceptedParked:
      description: >
        Accepted under --cluster-admin-async: the write was durably parked
        and is committing in the background. Poll the returned op id
        rather than assuming this response's absence of a body reflects
        the final state.
      headers:
        Rift-Cluster-Op-Id:
          $ref: '#/components/headers/RiftClusterOpId'
      content:
        application/json:
          schema:
            type: object
            properties:
              opId:
                type: string
                format: uuid
              opIds:
                type: array
                items:
                  type: string
                  format: uuid
                description: Per-op ids for a multi-op mutation (e.g. a batch PUT /imposters).

  schemas:
    Error:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [code, type, message]
            properties:
              code:
                type: string
                description: A status-derived code (frozen for compatibility; not always the numeric status).
              type:
                type: string
                description: Stable symbolic error slug — new consumers should read this field.
              message:
                type: string

    Imposter:
      type: object
      description: >
        An imposter's stored configuration (upstream ImposterConfig,
        Mountebank-compatible plus Rift extensions). Non-exhaustive.
      properties:
        port:
          type: integer
        host:
          type: string
        protocol:
          type: string
          example: http
        name:
          type: string
        recordRequests:
          type: boolean
          default: false
        enabled:
          type: boolean
          default: true
        stubs:
          type: array
          description: >
            The stubs themselves. Present on a single-imposter read; the list
            projection omits it and sends `stubCount` instead, so a client that
            reads only this field sees nothing on the list screen.
          items:
            $ref: '#/components/schemas/Stub'
        stubCount:
          type: integer
          description: >
            How many stubs this imposter has, on the list projection
            (`GET /imposters`), where the `stubs` array is omitted. Absent on a
            single-imposter read, which carries `stubs` instead. A client
            wanting a count for both shapes reads `stubs.length` when the array
            is there and falls back to this — neither field alone covers both
            responses.
        numberOfRequests:
          type: integer
          description: >
            How many requests this imposter has served, **fleet-wide** (issue
            #363). Present on both the list projection and the single-imposter
            read.


            Declared rather than left to this schema's `additionalProperties`,
            which is what previously kept it off the console: a field reaching
            the body only through the index signature is one no typed client can
            render without asserting a shape the contract never promised.


            The value is not this node's own tally. Upstream answers its local
            G-counter slot, and the front rewrites it to the sum across every
            node's slot for this port (issue #223) — so it is the figure the
            design's `REQUESTS · FLEET SUM` tile claims to be. When a peer could
            not be reached inside the fan-out budget the response carries
            `Rift-Cluster-Partial`, and the sum is of the nodes that answered:
            a floor, not a total.
        _rift:
          $ref: '#/components/schemas/RiftExtensions'
      additionalProperties: true

    RiftExtensions:
      type: object
      description: >
        Rift's own extensions to the Mountebank-compatible imposter document.
        Non-exhaustive — declared here only as far as the console reads it.
      properties:
        flowState:
          type: object
          description: >
            Upstream's flow-state block, **proxied verbatim**. Upstream emits an
            allowlist of it — `backend`, `ttlSeconds`, and `flowIdSource` only
            when set — because `flowState.redis` can carry a credentialed
            connection URL, and anything added later is therefore excluded by
            default rather than leaked.


            The EE front does not rewrite this block. `flowIdSource` in
            particular stays the flat string upstream renders, because
            rift-verify reads it there to drive correlated isolation; the
            resolved view with provenance is the sibling `flowStateResolved`
            (issue #370), which is additive precisely so this contract holds.
          additionalProperties: true
        flowStateResolved:
          $ref: '#/components/schemas/FlowStateResolved'
      additionalProperties: true

    FlowStateResolved:
      type: object
      description: >
        The per-imposter flow-state knobs with their **provenance** (issue
        #370), added by the EE front to the single-imposter read. Absent from
        the list projection, which has no knobs panel.


        Two of the three cannot reach a client any other way: `durability` and
        `readConsistency` are parsed by the cluster but are not on upstream's
        allowlist, so they are published here or nowhere. `flowIdSource` is
        repeated from `flowState` deliberately, so the console reads one block
        with one shape rather than two knobs from here and a third from
        upstream's, inferring provenance for that one from absence.


        `contextScope` is deliberately **not** here: it is tracked under #288
        (RFC-005 S1), and publishing it would claim a knob still being designed.
      required: [durability, readConsistency, flowIdSource]
      properties:
        durability:
          allOf:
            - $ref: '#/components/schemas/ResolvedKnob'
          description: >
            How a flow-state write is made durable — `none`, `async` (the
            default) or `sync`.
        readConsistency:
          allOf:
            - $ref: '#/components/schemas/ResolvedKnob'
          description: >
            Which copy a flow-state read consults — `strong` (the default,
            owner-authoritative) or `local` (the replica, at most one
            replication push behind).
        flowIdSource:
          allOf:
            - $ref: '#/components/schemas/ResolvedKnob'
          description: >
            How a request is mapped to a flow — `imposter_port` (the default:
            one context per imposter) or `header:<Name>`. This is what decides
            whether two callers share scenario state.
      additionalProperties: false

    ResolvedKnob:
      type: object
      description: >
        One knob's effective value and where it came from.
      required: [value, source]
      properties:
        value:
          type: string
          description: The value in force for this imposter.
        source:
          type: string
          enum: [default, set]
          description: >
            `set` when the imposter's document carries the key, `default` when
            it does not and the built-in applies.


            This is **presence of the key, not equality with the default
            value**: an imposter that explicitly pins `durability: "async"`
            reads as `set`, because the operator made a choice. Rendering that
            as inherited would invite the next operator to change a fleet
            default instead — and there is no fleet-level override for these
            knobs, so "inherited" means the compiled-in default and nothing
            else.
      additionalProperties: false

    Stub:
      type: object
      description: One request-matching rule and its response(s). Non-exhaustive.
      properties:
        id:
          type: string
          description: Stable id (Rift extension); addressable via the by-id routes.
        scenarioName:
          type: string
        requiredScenarioState:
          type: string
        newScenarioState:
          type: string
        space:
          type: string
          description: Correlated-isolation scope; absent means globally eligible.
        routePattern:
          type: string
          example: '/users/:id'
        predicates:
          type: array
          items:
            type: object
            additionalProperties: true
        responses:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    FleetRequestPage:
      type: object
      description: >
        One page of the tenant's fleet-wide request journal (issue #362) — the rows, the cursor
        that fetches the next page, and an explicit statement of which imposters the answer
        actually speaks for.
      required: [requests, cursor, coverage, joined]
      properties:
        requests:
          type: array
          description: >
            Recorded requests across the covered imposters, ordered by each request's own
            recorded timestamp. Each row names the imposter it came from — without that a merged
            answer is a pile of requests with no way to tell which mock served them.
          items:
            type: object
            required: [port, flowId, request]
            properties:
              port:
                type: integer
                description: The imposter this request was recorded on.
              flowId:
                type: string
                description: The flow (space) the request was resolved to at record time.
              request:
                $ref: '#/components/schemas/RecordedRequest'
        cursor:
          type: string
          description: >
            Opaque, versioned resumption token covering every port in `coverage.covered`. Pass it
            back as `since`. Round-trip it unmodified — never parse it.
        coverage:
          $ref: '#/components/schemas/FleetJournalCoverage'
        joined:
          type: array
          description: >
            Covered ports that had no position in the presented cursor, so their retained history
            was replayed into this page. A resuming client may see entries here it has already
            seen; on a baseline read this is every covered port.
          items:
            type: integer

    FleetJournalCoverage:
      type: object
      description: >
        Which imposters a fleet journal answer speaks for, and which it left out. The cap exists
        to bound the token size and the walk's cost; this block is what stops it being silent.
      required: [covered, total, omitted, capped]
      properties:
        covered:
          type: array
          description: The imposters this answer walked, ascending.
          items:
            type: integer
        total:
          type: integer
          description: Every imposter the tenant owns that was considered, covered or not.
        omitted:
          type: array
          description: >
            The imposters the cap excluded, ascending — named rather than counted, so an operator
            can tell whose traffic they are not looking at. Ports rank by most recent activity,
            so these are the least recently active.
          items:
            type: integer
        capped:
          type: boolean
          description: Whether the cap actually excluded anything.

    RecordedRequest:
      type: object
      description: >
        One request an imposter recorded, exactly as the engine serializes it
        (upstream `rift-mock-core::imposter::types::RecordedRequest`).
        Non-exhaustive.

        Three fields do not follow the obvious Rust-to-JSON mapping, and each
        one has bitten a client. `_mode` keeps its leading underscore — an
        explicit serde rename that overrides the struct's camelCase rule — and
        is omitted entirely for a text body, so `binary` is the only value that
        ever reaches the wire. `body` is absent when the request carried none.
        And a `headers` value is a **bare string** when the header carried a
        single value, an array only when it carried several; a key whose value
        list is empty is dropped rather than emitted as `[]`.
      required: [requestFrom, method, path, query, headers, timestamp]
      properties:
        requestFrom:
          type: string
          description: The client address the request arrived from.
          example: '127.0.0.1:54321'
        method:
          type: string
          example: GET
        path:
          type: string
          example: /users/42
        query:
          type: object
          additionalProperties:
            type: string
          description: >
            Decoded query parameters. Always present; an empty object when the
            request had none.
        headers:
          type: object
          description: >
            Request headers. A single-valued header is a bare string, not a
            one-element array (upstream `multi_value_headers::serialize`). On
            the way in the engine additionally tolerates JSON numbers and
            booleans for Mountebank compatibility, but it always serializes
            strings back out.
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        body:
          type: string
          description: >
            The request body, absent when there was none. Base64-encoded when
            `_mode` is `binary`; UTF-8 text otherwise.
        _mode:
          type: string
          enum: [binary]
          description: >
            Present only when `body` is base64-encoded binary (upstream issue
            #636). A text body omits this field, which is why `text` never
            appears on the wire even though it is the underlying default —
            absence means text.
        timestamp:
          type: string
          format: date-time
          description: RFC 3339, as produced by the engine's `Utc::now().to_rfc3339()`.
        matchOutcome:
          $ref: '#/components/schemas/MatchOutcome'
        status:
          type: integer
          description: >
            The response status that went back (issue #364, upstream rift#940).


            Attached after the response exists, like `matchOutcome` is attached
            after the match — the entry is journalled before either is knowable.
            **Absent means not recorded**, never `0`: the `X-Rift-Debug` path
            returns early and a request journalled before an error never reaches
            the attach, so absence is a real state and distinct from any status.
        latencyMs:
          type: integer
          description: >
            How long the imposter took to answer, in milliseconds (issue #364).
            Attached with `status`; the two are present or absent together.


            A present `0` is an ordinary reading, not a missing one — a stub
            answered from memory is well under a millisecond. The resolution
            suits the question the column exists to answer, *is this mock the
            slow thing?*, where the interesting values are `behaviors.wait`
            delays and proxied upstreams. Measured before this node's own CORS
            header injection, which happens after the imposter has finished.
        node:
          type: string
          description: >
            The node that served this request (issue #364), stamped by the
            clustered journal at record time — it is the same identity the entry
            is keyed by, so a merged read cannot show a row whose `node`
            disagrees with the shard it came from.


            A string, not a number: node ids are identifiers rather than
            magnitudes, and an id above 2^53 would be silently rounded by any
            JavaScript reading it. Absent from a recording made before this
            shipped, and from a single-node engine, which has no name for itself.
      additionalProperties: true

    MatchOutcome:
      type: object
      description: >
        Why this request was served by the stub it was — or by nothing
        (upstream rift#909, issue #208). Recorded at request time from the
        matcher's own visit order; a post-hoc re-evaluation would judge
        against whatever the stubs have since become. **Absent means no
        outcome was recorded** (an entry from an engine predating the field,
        an `X-Rift-Debug` request, or a matcher error) — never "did not
        match".
      required: [matched]
      properties:
        matched:
          type: boolean
        stubIndex:
          type: integer
          description: Position of the winning stub in the imposter's stub list; absent when nothing matched.
        stubId:
          type: string
          description: The winning stub's `id`, when it declares one.
        tried:
          type: array
          description: >
            The candidates the matcher actually visited and did not serve, in
            visit order. Index-pruned stubs are never visited and never
            listed — this is what was *tried*, which is the honest answer.
            Capped; see `triedOmitted`.
          items:
            $ref: '#/components/schemas/TriedStub'
        triedOmitted:
          type: integer
          description: >
            Candidates visited past the cap (25) and therefore not named in
            `tried`. Counted rather than silently truncated. Absent means
            zero.
      additionalProperties: true

    TriedStub:
      type: object
      required: [stubIndex, why]
      properties:
        stubIndex:
          type: integer
        stubId:
          type: string
        why:
          $ref: '#/components/schemas/TriedWhy'
      additionalProperties: true

    TriedWhy:
      type: object
      description: >
        Why a visited candidate did not win. Adjacently tagged so every
        variant is one flat object under the same `reason` key —
        `{"reason":"skippedSpace"}`, `{"reason":"skippedScenarioState"}`, or
        `{"reason":"failedPredicate","predicateIndex":1}`. `predicateIndex`
        is the position in the stub's own `predicates` array of the first
        predicate that rejected the request; a consumer renders the predicate
        itself from the stub config rather than the journal carrying a copy.
      required: [reason]
      properties:
        reason:
          type: string
          enum: [skippedSpace, skippedScenarioState, failedPredicate]
        predicateIndex:
          type: integer
          description: Present only when `reason` is `failedPredicate`.
      additionalProperties: true

    TryRequest:
      type: object
      description: >
        The sample request to send. Deliberately carries no host, scheme or
        port: those come from the imposter named in the path, which is what
        confines this endpoint to a mock the caller can already see.
      required: [method, path]
      properties:
        method:
          type: string
          description: >
            The HTTP method to send. Any token the imposter's own router
            might match, not a fixed enum — a mock exists to answer whatever
            the system under test sends it, including methods this API has
            no opinion about.
          example: GET
        path:
          type: string
          description: >
            Path and query string, as one string, starting with `/`. This is
            `Sample.target` from the console's own curl derivation.
          example: /orders?status=open
        headers:
          type: array
          description: >
            Sent as given, in order, and repeats are preserved — a list
            rather than a map because a request may legitimately carry the
            same header name twice and a map would silently drop one.
          items:
            $ref: '#/components/schemas/TryHeader'
        body:
          type: string
          description: Request body, verbatim. Omit for a bodyless request.
      additionalProperties: false

    TryHeader:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
      additionalProperties: false

    TryResponse:
      type: object
      description: What the imposter answered.
      required: [status, headers, body, elapsedMs]
      properties:
        status:
          type: integer
          description: >
            The imposter's own status. A `4xx`/`5xx` here is a *successful*
            try — the endpoint still answered `200`.
        headers:
          type: array
          description: The imposter's response headers, repeats preserved.
          items:
            $ref: '#/components/schemas/TryHeader'
        body:
          type: string
          description: >
            The response body, decoded as UTF-8. See `bodyLossy` — a mock
            may legitimately serve bytes that are not text, and this field
            is a string so that the common case needs no base64 round-trip.
        bodyLossy:
          type: boolean
          description: >
            Present and `true` when the body was not valid UTF-8 and
            replacement characters were substituted. Absent otherwise, so a
            client can tell "decoded cleanly" from "decoded with loss"
            without comparing bytes it does not have.
        headersLossy:
          type: boolean
          description: >
            The same, for header *values*. Its own flag rather than folded
            into `bodyLossy`: a mock with fault injection may serve malformed
            header bytes deliberately, and the header an operator garbled on
            purpose is exactly the one they are then reading back.
        truncated:
          type: boolean
          description: >
            Present and `true` when the imposter's body exceeded the 1 MiB
            read cap and `body` is a prefix. Absent otherwise.
        elapsedMs:
          type: integer
          description: >
            Wall-clock milliseconds for the exchange, measured at the
            server. Includes connect and the body read; excludes admin-side
            authorization.
      additionalProperties: false

    RouteTable:
      type: object
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'

    Route:
      type: object
      required: [id, target]
      properties:
        id:
          type: string
          description: Unique and stable; how the admin API addresses one route.
        priority:
          type: integer
          default: 0
          description: Higher wins; ties fall through to specificity.
        match:
          type: object
          properties:
            host:
              type: string
              description: Exact or one-leading-wildcard-label host match.
            path_prefix:
              type: string
              description: >
                Segment-aligned prefix. Snake_case on purpose: `RouteMatch`
                (`front_door/route_table.rs`) carries no `serde(rename_all)`,
                so this is the field name the fleet actually serves and
                accepts. Unlike most schemas here it is not camelCase.
            headers:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  value:
                    type: string
            method:
              type: string
        target:
          type: object
          required: [port]
          properties:
            port:
              type: integer
            strip_prefix:
              type: boolean
              default: false
              description: >
                Snake_case on purpose — `RouteTarget` carries no
                `serde(rename_all)`. See `match.path_prefix`.
            set_host:
              type: string
              description: Snake_case on purpose — see `match.path_prefix`.
        enabled:
          type: boolean
          default: true

    TenantWrite:
      type: object
      required: [id, displayName]
      description: >
        `id` is required by this schema because `POST /admin/tenants`
        requires it (`400` otherwise). On `PUT /admin/tenants/{tenantId}`
        the path segment is authoritative, but a body `id` that disagrees
        with it is NOT silently ignored — it answers `400`, since the
        authorization decision was made against the path and honouring a
        disagreeing body id would authorize one record and write another.
      properties:
        id:
          type: string
          description: >
            Required on create (`POST`). On `PUT`, must either be omitted
            or match the path `tenantId` exactly — a mismatch is a `400`,
            not a silent override.
        displayName:
          type: string
        quotas:
          $ref: '#/components/schemas/Quotas'
        journalRetentionSecs:
          type: integer
          format: int64
          default: 0
          description: Seconds the request-journal shards keep this tenant's data; 0 = unlimited.

    Tenant:
      allOf:
        - $ref: '#/components/schemas/TenantWrite'
        - type: object
          properties:
            createdAtSecs:
              type: integer
              format: int64
            deleted:
              type: boolean
            usage:
              $ref: '#/components/schemas/QuotaUsage'

    QuotaUsage:
      type: object
      description: >
        What this tenant is currently using against each of its `quotas` (issue
        #372). A limit is a fact about configuration; usage is a fact about the
        fleet, and only the second one changes.


        **A point-in-time reading, not a guarantee.** Quota enforcement happens
        at *apply*, not at submit, so a parked write is judged against the quota
        as it stands on replay. These figures say what was true when the read was
        served, and nothing about whether the next write will be admitted.


        Every field is present and zero for a tenant holding nothing — absent
        would mean "not reported", which is a different fact.
      required: [imposters, stubsPerImposter, flowEntries]
      properties:
        imposters:
          type: integer
          description: >
            How many imposters this tenant holds, counted from the replicated
            config set. Exact: it is the same set `maxImposters` is enforced
            against at apply.
        stubsPerImposter:
          type: integer
          description: >
            The stub count of this tenant's **largest single imposter** — not
            the sum across its imposters.


            `maxStubsPerImposter` is a per-imposter limit, so the worst single
            imposter is the only reading against which `used / limit` means
            anything. A tenant-wide sum would render `5000 / 1000` while nothing
            was over quota at all.
        flowEntries:
          type: integer
          format: int64
          description: >
            Live flow-state entries held on this tenant's imposter ports, summed
            across the fleet. Unlike the two above this is **not** read from the
            replicated config set: flow state is sharded per node and volatile
            (TTL and whole-flow LRU shedding), so it is gathered by a fan-out to
            every node. `Rift-Cluster-Partial` marks a response where a peer
            could not be reached inside the budget — the sum is then of the
            nodes that answered: a floor, not a total.


            **Fleet-scoped flows are counted against no tenant.** A flow under
            `contextScope: "fleet"` is shared by construction, so charging it to
            every tenant would double-count it and charging it to one would be
            arbitrary. Only imposter-scoped flows, on ports this tenant owns,
            are counted here.


            ⚠️ **`maxFlowEntries` currently enforces nothing.** Unlike the other
            two quotas it is checked on no write path, so this figure is
            reported against a ceiling that refuses nothing today. It is a
            observability reading, not a budget.

    Quotas:
      type: object
      description: >
        All three fields are required when `quotas` is present. `Quotas` carries
        no `serde(default)` on the struct or on any field, so a present-but-partial
        object fails deserialization with `missing field` and answers `400` — only
        an entirely absent `quotas` is defaulted (`TenantBody.quotas` is
        `serde(default)`).
      required: [maxImposters, maxStubsPerImposter, maxFlowEntries]
      properties:
        maxImposters:
          type: integer
          default: 1000
        maxStubsPerImposter:
          type: integer
          default: 1000
        maxFlowEntries:
          type: integer
          format: int64
          default: 100000

    Role:
      type: string
      description: >
        A strict superset ladder: viewer subset of operator subset of
        editor subset of tenant-admin subset of fleet-admin. Only
        fleet-admin may hold a binding on the fleet scope (*).
      enum: [viewer, operator, editor, tenant-admin, fleet-admin]

    PrincipalCreate:
      type: object
      required: [displayName, role]
      properties:
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    PrincipalUpdate:
      type: object
      required: [displayName, disabled]
      properties:
        displayName:
          type: string
        disabled:
          type: boolean
          description: Required, not defaulted — an omitted field must not silently un-revoke a principal.

    Principal:
      type: object
      description: A principal as read back. Never carries credential material.
      required: [id, displayName, auth, disabled]
      properties:
        id:
          type: string
        displayName:
          type: string
        auth:
          type: string
          enum: [apiKey, oidc, mtlsSan]
          description: The kind of credential; never any part of its value.
        disabled:
          type: boolean
        role:
          $ref: '#/components/schemas/Role'

    IssuedPrincipal:
      type: object
      description: The one-time response to principal creation. apiKey appears nowhere else.
      required: [id, displayName, role, tenant, apiKey]
      properties:
        id:
          type: string
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        tenant:
          type: string
        apiKey:
          type: string
          description: Shown once. Not stored anywhere in recoverable form.

    Binding:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    AuditRow:
      type: object
      required: [tsSecs, tenant, action, resource, opId, revision, outcome]
      properties:
        tsSecs:
          type: integer
          format: int64
          description: The applying entry's replicated clock — identical on every replica.
        principal:
          type: string
          nullable: true
          description: Who issued the op; null for an unattributed (open-admin-plane) submission.
        tenant:
          type: string
          description: The tenant the op acted on. Never null — every op names exactly one.
        action:
          type: string
          description: The RFC-002 §4.1 action slug (matches the authorization decision's own action string).
        resource:
          type: string
          description: What was acted on — a port, an id, or "*" for a whole-scope op.
        opId:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
          description: The applying log index.
        outcome:
          description: >
            `ControlOutcome`, externally tagged and **snake_case** — `Applied` is a
            unit variant, so it is the bare string `"applied"`, NOT an object.
            A refusal is `{"failed": {"reason": "..."}}`. A refusal is a
            *committed* outcome: the op is in the log and deduped like any other,
            it just changed nothing.
          oneOf:
            - type: string
              enum: [applied]
            - type: object
              required: [failed]
              properties:
                failed:
                  type: object
                  required: [reason]
                  properties:
                    reason:
                      type: string

    FleetNameWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: >
            Required — an omitted field is refused, not defaulted to an
            empty name. Trimmed non-empty, at most 128 characters, and free
            of control characters; otherwise unconstrained, since this is
            chrome text a human reads rather than an id anything parses
            back.

    AuditSinkWrite:
      type: object
      required: [uri]
      properties:
        uri:
          type: string
        authRef:
          type: string
          description: Name of a credential the fleet already holds; never a raw credential.
        batchMaxRows:
          type: integer
          description: Omitted takes the server default, not zero (which would ship nothing forever).

    AuditSink:
      allOf:
        - $ref: '#/components/schemas/AuditSinkWrite'
        - type: object
          required: [batchMaxRows, revision]
          properties:
            batchMaxRows:
              type: integer
            revision:
              type: integer
              format: int64
              description: The revision of the AuditSinkPut that produced this record.
            exportStatus:
              type: object
              description: Present only on the leader (only it runs the exporter).
              properties:
                running:
                  type: boolean
                lastError:
                  type: string
                  nullable: true
                shippedRows:
                  type: integer
                  format: int64
                consecutiveFailures:
                  type: integer

    SourceRecord:
      type: object
      description: >
        One imposter source as the fleet has agreed on it — the replicated
        projection, identical on every converged node. Deliberately carries
        nothing node-local, so two nodes' answers stay byte-comparable as a
        convergence check.
      required: [id, uri, mode, onDrift, drifted, ports, revision]
      properties:
        id:
          type: string
          description: The source's declared id, unique within its tenant.
        uri:
          type: string
          description: The URI the fleet pulls imposters from.
        mode:
          type: string
          enum: [pinned, tracking]
          description: Explicit pulls only, or scheduled polls on `pollSecs`.
        authRef:
          type: string
          description: >
            The **name** of a credential, never the credential — a URI
            carrying embedded credentials is refused before it can enter the
            replicated log.
        onDrift:
          type: string
          enum: [overwrite, skip, fail]
          description: What a pull does when the source's imposters were hand-edited since it last applied.
        pollSecs:
          type: integer
          format: int64
          description: Poll interval for a `tracking` source; absent for `pinned`.
        drifted:
          type: boolean
          description: An operator has edited this source's imposters by hand since it last applied.
        lastVersion:
          type: string
          description: The version label the last pull reported, when the source names one.
        lastDigest:
          type: string
          description: Digest of the content the last pull saw.
        lastPulledAtSecs:
          type: integer
          format: int64
          description: When the last pull committed, in UNIX seconds.
        lastOutcome:
          type: string
          enum: [applied, skipped]
          description: How the last pull ended; absent when the source has never pulled.
        ports:
          type: array
          items:
            type: integer
          description: The ports this source currently owns, ascending.
        revision:
          type: integer
          format: int64
          description: The log index that last wrote this record.

    SourceWrite:
      type: object
      description: >
        A source declaration: `POST /admin/sources` upserts by `id`. Fields
        left out take their documented defaults (`mode: pinned`, `onDrift:
        overwrite`) — the same defaults the server applies when they are
        absent from the wire — so a minimal `{id, uri}` body is a complete,
        valid declaration.
      required: [id, uri]
      properties:
        id:
          type: string
          description: >
            The source's id; unique within the caller's tenant, at most 128
            characters drawn from `[A-Za-z0-9._-]`.
        uri:
          type: string
          description: >
            The URI to pull from. Must not carry embedded userinfo
            (`user:pass@host`) — refused before the write ever reaches the
            replicated log, not even as a committed-but-failed entry; name
            a credential with `authRef` instead.
        mode:
          type: string
          enum: [pinned, tracking]
          description: Explicit pulls only (the default), or scheduled polls on `pollSecs`.
        authRef:
          type: string
          description: >
            The **name** of a credential resolved at fetch time, never the
            credential itself. Refused if the URI's scheme has no provider
            that consumes one.
        onDrift:
          type: string
          enum: [overwrite, skip, fail]
          description: What a pull does when this source's imposters were hand-edited since it last applied.
        pollSecs:
          type: integer
          format: int64
          description: >
            Poll interval for a `tracking` source; refused on any other
            mode, and refused below the server's poll-interval floor.

    PullReport:
      type: object
      description: >
        What one pull did, as reported by `POST /admin/sources/{sourceId}/pull`.
      required: [revision, digest, unchanged, skipped, changed]
      properties:
        revision:
          type: integer
          format: int64
          description: >
            The applying log index, or the source's last one when the
            digest short-circuit meant nothing was written.
        version:
          type: string
          description: The version label the source's document reported, when it names one.
        digest:
          type: string
          description: Content digest of what was fetched.
        unchanged:
          type: boolean
          description: >
            True when the fetched content matched what the source last
            applied, so no log entry was written.
        skipped:
          type: boolean
          description: >
            True when the pull committed a decision *not* to apply — a
            drifted source under `onDrift: skip`. Distinct from
            `unchanged`: a skip did reach the log, and the fleet does not
            hold this content.
        changed:
          type: array
          items:
            type: integer
          description: The ports this pull created, replaced or removed. Empty when nothing was applied.
        warnings:
          type: array
          items:
            type: string
          description: >
            Anything the document declared that a clustered pull does not
            apply (e.g. a `routes` or `intercept` block). Absent entirely
            when empty, never `[]`.

    SourcesNodeLocal:
      type: object
      description: >
        The answering node's own view — **not** a fleet fact. A poll failure
        is a property of one node's reach to an external host at one moment
        and is deliberately never replicated, so this half can differ across
        the fleet; it is kept apart from the record precisely so that it
        cannot be mistaken for one more replicated field.
      required: [nodeId, pollErrors]
      properties:
        nodeId:
          type: string
          description: >
            The cluster node that answered this request. A **string**, not an
            integer, for the same reason as `FleetMembers.node_id`: a raft id
            is a `u64`, JSON numbers are IEEE-754 doubles wherever the reader
            is JavaScript, and every id above 2^53-1 is silently rounded on
            the way in. This endpoint was missed when the fleet projections
            were fixed, and went on reporting a node that does not exist.
        pollErrors:
          type: object
          additionalProperties:
            type: string
          description: >
            Last poll error per source id, for sources this node has seen
            fail. Empty when nothing is failing — an explicit empty map, not
            an absent field. Polls run on the leader, so a follower's map is
            usually empty. Scoped to the tenant of the request: the scheduler
            polls every tenant's tracking sources, and a source id is unique
            only within its tenant.

    WhoAmI:
      type: object
      required: [bindings, authorizationDisabled]
      properties:
        principalId:
          type: string
          nullable: true
          description: Null under the open-admin-plane bypass (no principals configured, no API key).
        displayName:
          type: string
          nullable: true
          description: >
            The principal's own display name, for a client to render instead
            of `principalId`. Null for the two identities with no stored row
            to read it from: the open-admin-plane bypass, and the legacy
            `--api-key`'s synthetic principal (minted in code, never
            committed) — whose `principalId` is the already-readable
            `legacy:api-key`. A client falls back to `principalId` when this
            is null. It exists because `principalId` for a minted key is
            `key:<sha256-hex>`: not a credential, since the raw key cannot be
            recovered from it and argon2id is the actual boundary, but
            indistinguishable from one on screen.
        bindings:
          type: array
          items:
            type: object
            properties:
              tenant:
                type: string
              role:
                $ref: '#/components/schemas/Role'
        authorizationDisabled:
          type: boolean
          description: True when the fleet enforces nothing at all (distinct from an authenticated principal with zero bindings).

    FleetMembers:
      type: object
      description: >
        Raft membership as this node sees it, plus one row per voter
        carrying that voter's own applied index (issue #361).


        The top-level fields are `cluster_api.rs`'s `members_body`, the same
        builder `/_cluster/members` serves on the cluster port. `members` is
        added on top and is the one difference between the two ports: this
        projection folds that builder across every voter, asking each peer the
        question the cluster port already answers, while `/_cluster/members`
        stays node-local — it is the target of that fan-out, and it is also how
        an operator asks *one* node what it thinks when isolating a node that
        is behind.


        So there is still exactly one implementation of "a node's own applied
        index", read once here and once per peer. What the two ports must not
        do is answer the same question differently; a fold over one builder is
        not that.
      required: [node_id, is_leader, current_leader, last_applied, voters]
      properties:
        node_id:
          type: string
          description: >
            This node's raft id. A **string**, not an integer: a raft id is a
            `u64`, JSON numbers are IEEE-754 doubles wherever the reader is
            JavaScript, and every id above 2^53-1 is silently rounded on the
            way in. Ids are identifiers, never magnitudes — nothing sums or
            orders them — so a string costs nothing and is the only encoding
            that survives the round trip.
        is_leader:
          type: boolean
          description: Whether this node is currently the raft leader.
        current_leader:
          type: string
          nullable: true
          description: >
            The current leader's node id, if one is known to this node. A
            string for the same reason as `node_id`. `null` is an absence —
            "this node knows of no leader" — never the id `"0"`.
        last_applied:
          type: integer
          format: int64
          nullable: true
          description: Index of the last log entry applied to this node's state machine.
        voters:
          type: array
          items:
            type: string
          description: >
            Voter node ids in the currently effective membership. Strings for
            the same reason as `node_id`.
        fleet_name:
          type: string
          nullable: true
          description: >
            The fleet's operator-set name (issue #373), or `null` when nobody
            has named it yet. A label, not an identity — node ids remain what
            every endpoint on this document addresses; this exists only so a
            console user, or an operator with several fleets open, can tell
            them apart at a glance.


            Deliberately **not** in `required`, unlike `current_leader` and
            `last_applied` which share its always-present-but-nullable
            shape. Those predate every node in any live fleet; this field
            does not. During a rolling upgrade the node answering this
            request may be a pre-#373 build that omits the key altogether,
            and `/_fleet/members` is answered by whichever node the caller
            reached — so absent is a genuinely reachable state, not a
            hypothetical one. Requiring it would make the shape an older
            node really sends unrepresentable in every generated client.


            Consumers therefore fold absent into `null`: both mean "no name
            to show". What neither means is "the name could not be read" —
            that is `fleet_name_unavailable` below, and keeping the two
            apart is the whole point of there being two fields.
        fleet_name_unavailable:
          type: boolean
          description: >
            Whether the answering node could not *read* the name, as distinct
            from there being none to read. Both arrive as `fleet_name: null`,
            and without this flag they are the same byte on the wire — so a
            storage fault on the answering node would render exactly like a
            fleet nobody has named, which is the wrong-but-quiet failure the
            error rules exist to prevent.


            The read deliberately still answers `200` when this is `true`:
            everything else in this body comes from in-memory raft metrics and
            is still trustworthy, and an operator diagnosing that fault wants
            the membership view rather than a `500`. Absent is equivalent to
            `false`.
        bound_ports:
          type: array
          items:
            type: integer
          nullable: true
          description: >
            Ports this node's engine actually holds the socket for (issue
            #369), fleet-wide and deduplicated. A **positive** list, not just
            "every configured port minus `bind_failures`": a port this node
            has never applied config for also has no recorded failure, so a
            failures-only projection would have the console infer "absent ⇒
            bound" and render a confident green row for a node that never
            received the imposter. This is the field that makes the panel a
            claim about what is actually listening rather than an inference
            from what has not (yet) failed.


            A **failed** bind is not a failed imposter: the node still serves
            that port's imposter in-process through the front door and the
            `/__rift/:port` gateway route (RFC-001 §7.4.6) — it just is not
            the process holding the socket. `bound_ports` says which case
            applies; it is not a health signal on its own.


            Deliberately **not** in `required`, for the same rolling-upgrade
            reason as `fleet_name`: a pre-#369 peer's reply omits this key
            entirely, and `/_fleet/members` may be answered by whichever node
            the caller reached. Absent means "unknown", exactly like `null` —
            never "nothing bound". See `bind_status_unavailable` for why a
            present-but-empty answer is not interchangeable with either.
        bind_failures:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: >
            Why each port in this map failed to bind, keyed by port number as
            a string (issue #369) — e.g. `{"9090": "Address already in use"}`.
            A port is never a key here **and** a member of `bound_ports`; see
            that field for what a failed bind does and does not mean for the
            imposter it names.


            An empty object is the healthy answer once this node has actually
            read its own state: it means "checked every configured port,
            nothing failed" — a different claim from `null`, which means
            "this node could not check". Not in `required`, for the same
            rolling-upgrade reason as `bound_ports`.
        bind_status_unavailable:
          type: boolean
          nullable: true
          description: >
            Whether the answering node has no local engine to observe binds
            with at all, as distinct from having an engine and finding
            nothing bound or nothing failed. The same
            `fleet_name`/`fleet_name_unavailable` split (#373), applied here:
            `bound_ports` and `bind_failures` both arrive `null` whether the
            cause is "no local engine" or "peer is unreachable and said
            nothing", and without this flag those two are the same byte on
            the wire.


            `false` once a node has an engine and has checked its ports,
            whether or not anything is bound. `null` (or the key absent) only
            for a peer this node could not reach or that predates this field
            — the same "unknown, not unhealthy" rule `bound_ports`
            documents. A reachable voter reporting `true` here is enough on
            its own to mark `/_fleet/members`'s response
            `Rift-Cluster-Partial`, the same as an unreachable one.
        members:
          type: array
          description: >
            One row per voter, in `voters` order (issue #361). Present on
            `/_fleet/members` only — `/_cluster/members` is node-local.


            The console is served under `default-src 'self'`, so the page can
            only ever dial the node that served it: a peer's applied index is
            unreachable from the browser by construction, and can only arrive
            through an aggregate the serving node assembles. This is it.


            When a voter does not answer inside the fan-out budget its row is
            still present with `reachable: false` and a `null` index, and the
            response carries `Rift-Cluster-Partial`. The row is not omitted —
            a missing voter would read as a fleet that shrank.
          items:
            type: object
            required: [node_id, reachable]
            properties:
              node_id:
                type: string
                description: The voter's raft id, a string for the same reason as above.
              last_applied:
                type: integer
                format: int64
                nullable: true
                description: >
                  What that node reports about itself, read back from its own
                  body rather than recomputed here.


                  `null`, never `0`, when the node did not answer: an unknown
                  index rendered as zero reads as "this node has applied
                  nothing", which is an alarm raised by the fan-out rather than
                  by the fleet.
              is_leader:
                type: boolean
                nullable: true
                description: Whether that node believes it is the leader. `null` when it did not answer.
              reachable:
                type: boolean
                description: >
                  Whether this node got an answer from that voter inside the
                  budget. `false` is why the fields above are `null`.
              bound_ports:
                type: array
                items:
                  type: integer
                nullable: true
                description: >
                  That voter's own `bound_ports` (issue #369), echoed
                  verbatim from its reply — this node has no second opinion
                  about a peer's sockets, exactly as it has none about the
                  peer's `last_applied`. See `FleetMembers.bound_ports` for
                  the field's meaning and why it is a positive list. `null`
                  when the voter is unreachable, predates this field, or
                  reported no answer for it.
              bind_failures:
                type: object
                additionalProperties:
                  type: string
                nullable: true
                description: >
                  That voter's own `bind_failures`, echoed verbatim. See
                  `FleetMembers.bind_failures`.
              bind_status_unavailable:
                type: boolean
                nullable: true
                description: >
                  That voter's own `bind_status_unavailable`, echoed
                  verbatim. `true` here — on an otherwise `reachable: true`
                  row — is on its own enough to mark this response
                  `Rift-Cluster-Partial`: the row is reachable but the body
                  is missing a fact it claims to carry. See
                  `FleetMembers.bind_status_unavailable`.

    FleetHealth:
      type: object
      description: >
        This node's readiness plus its ring view — the `/_fleet/health`
        read-only admin-port projection (RFC-006 §5.2) of
        `cluster_api.rs`'s `health_body`.
      required: [ready, state, pending_gates, isolated, ring]
      properties:
        ready:
          type: boolean
          description: Whether a load balancer should route to this node.
        state:
          type: string
          enum: [ready, not-ready, draining]
          description: >
            `draining` means a graceful leave has begun and the node is
            finishing in-flight work.
        pending_gates:
          type: array
          items:
            type: string
          description: >
            Startup gates this node has not yet satisfied (e.g.
            `cluster-joined`, `cluster-reconciled`); empty once `ready`.
        parked_intents:
          type: integer
          format: int64
          nullable: true
          description: >
            Writes **this node** accepted under `--cluster-admin-async` and has
            not replayed yet (issue #360). A magnitude, so a number.


            `null`, never `0`, when the depth could not be read: zero is the
            reassuring answer — "nothing outstanding" — and it is the one an
            operator acts on by not acting. Reporting it because storage could
            not be read is the wrong-but-quiet failure this API avoids
            everywhere else.
        parked_intents_fleet:
          type: integer
          format: int64
          description: >
            The same depth summed across every voter (issue #360). Present on
            `/_fleet/health` only — `/_cluster/health` is node-local, because it
            is the target of this fan-out and is also how an operator asks one
            node how far behind its own replay is.


            The tile this feeds sits beside fleet-wide counts and means "the
            fleet has taken work it has not finished", so a single node's figure
            under that label would understate it.


            **Absent** when this node could not read its own depth — a sum
            missing an unknown addend is not a sum. When a *peer* fails to
            answer, the field is present but is a **floor**, and the response
            carries `Rift-Cluster-Partial` to say so.
        isolated:
          type: boolean
          description: Whether this node currently sees itself as network-isolated from the rest of the fleet.
        ring:
          type: object
          required: [m_idx, members]
          properties:
            m_idx:
              type: integer
              format: int64
              description: The ownership ring's membership-epoch index.
            members:
              type: array
              items:
                type: string
              description: >
                Node ids currently in the ownership ring, in ring order.
                Strings for the same reason as `FleetMembers.node_id`.

    FleetOpStatus:
      type: object
      description: >
        The `/_fleet/ops/{opId}` read-only admin-port projection (RFC-006
        §5.2) of `cluster_api.rs`'s `op_body` — the poll target for a
        `202`-parked or async-committed write's op id.
      required: [state]
      properties:
        state:
          type: string
          enum: [applied, failed, pending]
        revision:
          type: integer
          format: int64
          description: >
            The applying log index. Present for `applied` and `failed`;
            absent for `pending`, which has not applied yet.
        detail:
          type: string
          description: The failure reason. Present only when `state` is `failed`.

    SessionCreate:
      type: object
      required: [apiKey]
      description: The `POST /session` request body.
      properties:
        apiKey:
          type: string
          description: >
            The admin API key, or a minted principal's API key — the same
            credential `apiKeyAuth` accepts as a bearer, exchanged here
            once for a session cookie instead of sent on every request.

    Link:
      type: object
      description: >
        A Mountebank-shaped hypermedia link: an object carrying `href` and
        nothing else. Named as a component because the upstream system
        routes (`getRoot`, `getLogs`) emit the same one-key object in
        several places and a client should get one type for all of them.
      required: [href]
      properties:
        href:
          type: string
          description: >
            Absolute where the handler knows its own base URL (`getRoot`),
            path-relative where it does not (`getLogs`). Treat it as a URL
            reference to resolve, not as a guaranteed absolute URL.

    ScenarioEntry:
      type: object
      description: >
        One scenario's FSM state within one space. Scenario state is always
        per-flow, so an entry is only meaningful next to the `flowId` (or
        `space`) its enclosing response names.
      required: [name, state]
      properties:
        name:
          type: string
          description: The scenario name, as stubs declare it in `scenarioName`.
        state:
          type: string
          description: Its current state in this flow — the imposter's initial state until something moves it.

    FlowStateEntry:
      type: object
      description: >
        One flow-state key/value pair, echoed identically by the read and
        the write (`getFlowStateEntry`, `putFlowStateEntry`) — one component
        because the two bodies are the same object, and letting them drift
        apart in the contract would invent a difference the handler does not
        have.
      required: [flowId, key, value]
      properties:
        flowId:
          type: string
          description: The space the entry belongs to (the path segment, echoed).
        key:
          type: string
        value:
          description: >
            The stored value: **any** JSON — object, array, string, number,
            boolean or `null`. Deliberately left unconstrained rather than
            declared `type: object`, because flow state is a scratchpad for
            correlated scenarios and a scalar is as valid as a document.

    VerifyOptions:
      type: object
      description: >
        The `POST /imposters/{port}/verify` request body. Every field is
        optional — `{}` verifies with no predicates, which counts everything
        in scope — but the body itself must be present and must be JSON.
      properties:
        predicates:
          type: array
          description: >
            Predicate clauses, AND'd together, in the same grammar a stub's
            `predicates` use — the engine evaluates them with the one true
            matcher rather than a verification-only reimplementation. An
            `inject` clause needs `--allowInjection`, or the request answers
            `400`.
          items:
            type: object
            additionalProperties: true
        flowId:
          type: string
          description: Scope the count to one space. Absent, every recorded request is in scope.
        includeRequests:
          type: boolean
          default: false
          description: Return the matching requests themselves, not just the count.
        includeClosest:
          type: boolean
          default: false
          description: Return the best-scoring non-match with the clauses it failed, for diff rendering.

    VerifyOutcome:
      type: object
      description: >
        A verification result (upstream `rift-mock-core`'s `VerifyOutcome`,
        issue #494). `requests` and `closest` are `skip_serializing_if`
        fields: each is absent unless the corresponding option asked for it,
        so neither is `required` here.
      required: [matched, total]
      properties:
        matched:
          type: integer
          description: Recorded requests in scope satisfying every predicate.
        total:
          type: integer
          description: Recorded requests in scope, matched or not — the denominator for `matched`.
        requests:
          type: array
          description: The matching requests. Present only when `includeRequests` was set.
          items:
            $ref: '#/components/schemas/RecordedRequest'
        closest:
          allOf:
            - $ref: '#/components/schemas/ClosestMatch'
          description: >
            Present only when `includeClosest` was set **and** a non-matching
            request existed to be closest — a verification where everything
            in scope matched carries no `closest`.

    ClosestMatch:
      type: object
      description: The non-matching request that satisfied the most predicate clauses, with the clauses it failed.
      required: [request, failedPredicates]
      properties:
        request:
          $ref: '#/components/schemas/RecordedRequest'
        failedPredicates:
          type: array
          items:
            $ref: '#/components/schemas/FailedPredicate'

    FailedPredicate:
      type: object
      description: >
        One predicate the closest request failed, paired with what the
        request actually carried for the fields that predicate references —
        the raw material for a readable diff.
      required: [predicate, actual]
      properties:
        predicate:
          type: object
          description: The clause, echoed in the same shape it was sent.
          additionalProperties: true
        actual:
          description: >
            What the request actually held for the fields the clause names.
            Any JSON — a string for a scalar field, an object for `headers`
            or `query`, `null` where the request carried nothing — so it is
            left unconstrained rather than pinned to one type.

    NodeConfig:
      type: object
      description: >
        The engine's effective startup configuration (`GET /config`,
        Mountebank-compatible). Fully enumerable: the handler builds one
        fixed document, and every key below is always present.
      required: [version, commit, options, serveOptions, process]
      properties:
        version:
          type: string
          description: The engine crate's version.
        commit:
          type: string
          nullable: true
          description: >
            The build's git commit, stamped at compile time. **Null** — not
            absent — on a build where the stamp was not set (an
            `option_env!`, so a plain `cargo build` yields null).
        options:
          type: object
          description: The Mountebank-shaped options block; existing Mountebank clients parse this object.
          required: [port, allowInjection, localOnly, ipWhitelist]
          properties:
            port:
              type: integer
              description: The port the admin plane actually bound, not the default it would have used.
            allowInjection:
              type: boolean
            localOnly:
              type: boolean
              description: >
                Whether `--local-only` was set — the flag itself, not
                "did the admin plane happen to bind loopback". A
                bind-derived value would overstate isolation on a node whose
                imposter ports are still on every interface.
            ipWhitelist:
              type: array
              description: >
                Always the single-element list `["*"]`. `--ip-whitelist` is
                accepted and **never enforced**, so every address may
                connect; echoing the supplied list here would re-create
                exactly the false assurance that reporting `*` exists to
                avoid. Do not render this as an active allow-list.
              items:
                type: string
        serveOptions:
          type: array
          description: >
            The capability list a client feature-detects on: the serve
            options this engine understands. Its *contents* are deliberately
            not enumerated here — the whole point is that a client tests for
            membership rather than assuming a fixed set, and an absent field
            means an engine too old to report capabilities at all.
          items:
            type: string
        process:
          type: object
          description: >
            Mountebank's process block, kept shape-compatible so its clients
            keep parsing. Several members are honest placeholders rather than
            measurements.
          required: [nodeVersion, architecture, platform, rss, heapTotal, heapUsed, uptime, cwd]
          properties:
            nodeVersion:
              type: string
              enum: ['N/A (Rust)']
              description: Always this literal — there is no Node runtime; the key exists only for Mountebank shape-compatibility.
            architecture:
              type: string
              example: aarch64
            platform:
              type: string
              example: macos
            rss:
              type: integer
              description: Always `0` — a Mountebank-shaped placeholder, not a measurement. Do not chart it.
            heapTotal:
              type: integer
              description: Always `0`; see `rss`.
            heapUsed:
              type: integer
              description: Always `0`; see `rss`.
            uptime:
              type: integer
              description: Always `0`; see `rss` — process uptime is not tracked here.
            cwd:
              type: string
              description: The process working directory; the empty string when it cannot be read.

    ReloadOutcome:
      type: object
      description: >
        The result of `POST /admin/reload`. Only `message` is guaranteed: a
        node with no configured config source answers a message alone
        ("nothing to reload") and no counters, while a node that reconciled
        answers the message plus the four counts. `warnings` is additive and
        appears only when there is something to warn about.
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable outcome — what was reloaded, or why nothing was.
        created:
          type: integer
          description: Imposters created by this reload. Absent when no config source is configured.
        replaced:
          type: integer
          description: Imposters replaced wholesale. Absent when no config source is configured.
        stubPatched:
          type: integer
          description: >
            Imposters whose stubs were patched in place, keeping runtime
            state (recorded requests, scenario state, response cyclers).
            Absent when no config source is configured.
        deleted:
          type: integer
          description: Imposters removed. Absent when no config source is configured.
        warnings:
          type: array
          description: >
            Non-fatal notes about the reload — e.g. that a boot-only
            `intercept` block in the source was deliberately not re-applied.
            Absent entirely when empty, never `[]`.
          items:
            type: string
      additionalProperties: true
