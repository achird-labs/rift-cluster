  # ---------------------------------------------------------------------
  # ee: audit (RFC-002 §9) — no upstream equivalent
  # ---------------------------------------------------------------------
  /admin/audit:
    get:
      operationId: getAudit
      summary: Read the audit journal
      description: >
        Terminates. Answers a **bare JSON array** of audit rows, not an
        envelope. `since` and `limit` are pure pagination: an unparseable
        or absent value takes its default rather than refusing (domain-
        optional parse, not a swallow — both parameters have a safe
        default and there is no failure worth hiding behind a 400). A
        `FleetAdmin` sees the whole fleet's rows; every other caller sees
        exactly the tenant they were authorized as, filtered server-side
        so the rows returned and the authorization decision that allowed
        them can never disagree.
      tags: [audit]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: since
          in: query
          description: >
            Journal cursor (a `revision`/log-index value): return rows
            applied at or after this point. Defaults to `0` (the start of
            the journal). An unparseable value is treated as absent rather
            than rejected.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: >
            Maximum rows to return. Defaults to 500 and is clamped to a
            hard ceiling of 5000 — the audit table is a journal, so an
            unbounded read would be an unbounded response, and any tenant
            admin can reach this route.
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 500
      responses:
        '200':
          description: Audit rows, constraints applied server-side (bare array, not an envelope).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditRow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/audit/sink:
    get:
      operationId: getAuditSink
      summary: Read the fleet's declared audit export sink
      description: >
        Terminates. Fleet-scoped (`ClusterAdmin` / FleetAdmin only) — a
        `TenantAdmin` trusted to read their own tenant's audit rows is not
        thereby trusted to see where the whole fleet's rows ship to. Export
        status is included only on the leader (only it runs the exporter);
        a follower reports the sink with no status attached rather than a
        fabricated all-zero one.
      tags: [audit]
      x-rift-origin: ee
      responses:
        '200':
          description: The declared sink, plus this node's export status when it has one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditSink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No sink is declared, or caller lacks fleet-scoped access (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: putAuditSink
      summary: Declare or replace the fleet's audit export sink
      description: >
        Terminates. Fleet-scoped (`ClusterAdmin` / FleetAdmin only). The
        sink's own `revision` is what a re-declared sink resumes exporting
        from.
      tags: [audit]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditSinkWrite'
      responses:
        '200':
          description: >
            Sink stored; body is empty (`terminate_tenancy` renders no
            body — only principal creation returns one).
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Caller lacks fleet-scoped access (RFC-002 §8.4 — not a 403).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/WriteTimeout'
    delete:
