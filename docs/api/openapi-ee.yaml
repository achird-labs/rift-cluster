openapi: 3.1.0
info:
  title: Rift Cluster Admin API
  version: 0.1.0
  description: >
    The admin surface of a clustered Rift node (`--cluster`), as served by the
    admin front (`crates/rift-cluster-server/src/admin_front.rs`).

    The front sits in front of the embedded upstream engine's own loopback
    admin API. Every operation below carries `x-rift-origin`:

    - `ee`: terminated by this cluster layer — turned into a `ControlOp`,
      committed to the Raft log, and (for imposter/stub/route writes)
      rendered by re-reading the just-applied state through the loopback
      admin. Tenancy, audit, and `/front-door/routes` have no upstream
      equivalent at all and terminate here in full, reads included.
    - `upstream`: reverse-proxied byte-for-byte to the embedded engine's own
      admin API after this front's authentication/authorization gate runs.

    Concurrency and idempotency (see the module doc in `admin_front.rs`):
    a single-imposter write may carry `If-Match` naming the revision it
    expects (either the exact `Rift-Cluster-Revision` token or a bare
    revision integer). Absent, a write is last-writer-wins. A stale or
    mismatched `If-Match` answers `409`; a collection-wide mutation
    (`PUT /imposters`, `DELETE /imposters`) cannot carry one and answers
    `400` if it tries. `Idempotency-Key` mints a deterministic op id so a
    retried request dedups to the original committed response rather than
    re-applying.

    Async writes: when the node runs with `--cluster-admin-async`, a
    terminated mutation may answer `202 Accepted` with an op id instead of
    the usual success code, and the write finishes in the background —
    poll the op id rather than assuming the body reflects committed state.

    Tenant isolation (RFC-002 §8.4): a request that names a resource
    belonging to another tenant — a port, a route id, a tenant record the
    caller holds no binding in — answers `404`, byte-identical to a
    resource that genuinely does not exist. This is deliberate: a `403`
    would let a caller enumerate which resources exist under tenants they
    cannot see, just by noting which probes 403 instead of 404. A `403`
    instead means the caller IS bound to the tenant named but its role
    does not grant the action.

    Availability: `503` is not limited to mutations — a node that is
    shutting down answers `503` to every operation, including reads,
    because authentication itself runs behind the same gate. A clustered
    write additionally answers `503` when it cannot reach quorum, and
    `504` when it cannot commit within its deadline (the write's outcome
    is then unknown, not failed).

    `/__rift/{port}/*` is served on the admin port too, as data-plane
    gateway traffic proxied straight to the imposter on that port. It is
    deliberately outside this contract and auth-exempt (RFC-002 §7), so
    it is not documented here.
servers:
  - url: /
security:
  - apiKeyAuth: []
tags:
  - name: imposters
    description: Imposter and stub CRUD (config-mutating routes terminate here; runtime-state reads/writes proxy to upstream).
  - name: front-door
    description: The clustered front door's own route table (issue #131) — no upstream equivalent.
  - name: tenancy
    description: RFC-002 §5 tenants, principals, and bindings — no upstream equivalent.
  - name: audit
    description: RFC-002 §9 audit stream and export sink — no upstream equivalent.
  - name: meta
    description: Identity and contract introspection.
  - name: upstream-core
    description: Proxied verbatim to the embedded engine's own admin API.

paths:
  # ---------------------------------------------------------------------
  # ee: imposters (collection)
  # ---------------------------------------------------------------------
  /imposters:
    post:
      operationId: createImposter
      summary: Create a clustered imposter
      description: >
        Terminates: commits a `PutImposter` op and answers `201` rendered
        from re-reading the just-applied state. The port must be given
        explicitly in the body — an auto-assigned port cannot replicate
        across the fleet. May answer `202` with an op id under
        `--cluster-admin-async`. Carries a port, so it honours `If-Match`
        like any other single-imposter write.
      tags: [imposters]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Imposter'
      responses:
        '201':
          description: Imposter created; body is the stored imposter.
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Imposter'
        '202':
          $ref: '#/components/responses/AcceptedParked'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Caller is not bound to the tenant named (`X-Rift-Tenant` or
            default) — indistinguishable from that tenant not existing
            (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/WriteTimeout'
    put:
      operationId: replaceAllImposters
      summary: Replace the caller's tenant's whole imposter set
      description: >
        Terminates: reconciles the tenant's configured imposters toward the
        given set — upserts every listed imposter, then prunes whatever
        this tenant owns that was left out (`{"imposters":[]}` deletes
        everything). Destructive regardless of method, so this requires
        `ImposterDelete`, not merely `ImposterWrite` — an Editor who may
        write but not delete cannot reach it through this route. Cannot
        carry `If-Match` (no single record to condition a whole-set replace
        on); sending one answers `400`.
      tags: [imposters]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                imposters:
                  type: array
                  items:
                    $ref: '#/components/schemas/Imposter'
      responses:
        '200':
          description: The reconciled set, re-read post-commit.
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  imposters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Imposter'
        '202':
          $ref: '#/components/responses/AcceptedParked'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Caller is not bound to the tenant named (`X-Rift-Tenant` or
            default) — indistinguishable from that tenant not existing
            (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/WriteTimeout'
    delete:
      operationId: deleteAllImposters
      summary: Delete the caller's tenant's whole imposter set
      description: >
        Terminates: commits a `DeleteAll` op for the authorized tenant and
        answers with what was removed, captured before the delete commits.
      tags: [imposters]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: What was deleted.
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  imposters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Imposter'
        '202':
          $ref: '#/components/responses/AcceptedParked'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Caller is not bound to the tenant named (`X-Rift-Tenant` or
            default) — indistinguishable from that tenant not existing
            (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/WriteTimeout'
    get:
      operationId: listImposters
      summary: List imposters (upstream, filtered to the caller's owned ports)
      description: >
        Proxied to the embedded engine's own admin API, which now binds
        every tenant's imposters in-process — this front filters the
        response body down to ports the caller's tenant owns before
        returning it, since the engine has no tenant concept of its own.
        Runs the same tenant-binding gate as every other route, so an
        unbound `X-Rift-Tenant` claim answers `404` (RFC-002 §8.4).
      tags: [upstream-core]
      x-rift-origin: upstream
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: The caller's tenant's imposters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  imposters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Imposter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Caller is not bound to the tenant named — indistinguishable
            from that tenant not existing (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------
  # ee: single imposter delete / upstream: single imposter read
  # ---------------------------------------------------------------------
  /imposters/{port}:
    parameters:
      - $ref: '#/components/parameters/Port'
    delete:
      operationId: deleteImposter
      summary: Delete one imposter
      description: >
        Terminates: mirrors upstream's own semantics — deleting an absent
        imposter answers `404` and commits nothing (keeps the log free of
        no-ops). A cross-tenant port answers the same indistinguishable
        `404` (RFC-002 §8.4), not `403`, so a probe sweeping port numbers
        cannot tell "someone else's" from "nobody's".
      tags: [imposters]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The deleted imposter, as it was just before removal.
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Imposter'
        '202':
          $ref: '#/components/responses/AcceptedParked'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            No such imposter on this port for the caller's tenant — either
            it genuinely does not exist, or it belongs to a different
            tenant. The two are byte-identical by design (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/WriteTimeout'
    get:
      operationId: getImposter
      summary: Read one imposter (upstream)
      tags: [upstream-core]
      x-rift-origin: upstream
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: The imposter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Imposter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            No such imposter for this tenant — genuinely absent, or owned
            by another tenant (RFC-002 §8.4's indistinguishable 404).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /imposters/{port}/enable:
    parameters:
      - $ref: '#/components/parameters/Port'
    post:
      operationId: enableImposter
      summary: Enable a paused imposter
      description: >
        Terminates: commits a `SetEnabled(true)` op. Config-since-upstream
        #817: a pause must survive restarts and converge fleet-wide, so
        enable/disable is replicated state, not a local toggle. Carries a
        port, so it honours `If-Match` like any other single-imposter
        write.
      tags: [imposters]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Upstream's own canned message body, byte-identical.
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Imposter enabled
        '202':
          $ref: '#/components/responses/AcceptedParked'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/WriteTimeout'

  /imposters/{port}/disable:
    parameters:
      - $ref: '#/components/parameters/Port'
    post:
      operationId: disableImposter
      summary: Disable (pause) an imposter
      description: >
        Terminates: commits a `SetEnabled(false)` op. See `enableImposter`
        for why this is replicated rather than local state, and for why
        it honours `If-Match`.
      tags: [imposters]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Upstream's own canned message body, byte-identical.
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Imposter disabled
        '202':
          $ref: '#/components/responses/AcceptedParked'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/WriteTimeout'

  # ---------------------------------------------------------------------
  # ee: stub collection / upstream: stub reads
  # ---------------------------------------------------------------------
  /imposters/{port}/stubs:
    parameters:
      - $ref: '#/components/parameters/Port'
    post:
      operationId: addStub
      summary: Append (or insert) one stub
      description: >
        Terminates: commits a `PatchStubs` `Add` edit and answers with the
        re-read imposter. `index`, when given, inserts at that position
        rather than appending. The one non-idempotent op in the stub set —
        a replayed append would double the stub — which is why an
        `Idempotency-Key` matters here more than on the other stub
        mutations.
      tags: [imposters]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stub]
              properties:
                stub:
                  $ref: '#/components/schemas/Stub'
                index:
                  type: integer
                  minimum: 0
                  description: Position to insert at; appends when omitted.
      responses:
        '200':
          description: The imposter, re-read with the new stub applied.
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Imposter'
        '202':
          $ref: '#/components/responses/AcceptedParked'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/WriteTimeout'
    put:
      operationId: replaceStubs
      summary: Replace an imposter's whole stub list
      description: >
        Terminates: reads the stored config, replaces its `stubs`, and
        commits the whole config as a `PutImposter` (there is no by-id
        spelling for a whole-list replace in the op set).
      tags: [imposters]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stubs]
              properties:
                stubs:
                  type: array
                  items:
                    $ref: '#/components/schemas/Stub'
      responses:
        '200':
          description: The imposter, re-read with the new stub list.
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Imposter'
        '202':
          $ref: '#/components/responses/AcceptedParked'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/WriteTimeout'
    get:
      operationId: listStubs
      summary: List an imposter's stubs (upstream)
      tags: [upstream-core]
      x-rift-origin: upstream
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: The stub list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stubs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Stub'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /imposters/{port}/stubs/{stubIndex}:
    parameters:
      - $ref: '#/components/parameters/Port'
      - name: stubIndex
        in: path
        required: true
        description: Zero-based position of the stub in the imposter's stub list.
        schema:
          type: integer
          minimum: 0
    put:
      operationId: replaceStubAt
      summary: Replace the stub at an index
      description: >
        Terminates: index-addressed, so it commits as a full `PutImposter`
        of the stored config with that one stub replaced. Answers `404`
        if `stubIndex` is out of range.
      tags: [imposters]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Stub'
      responses:
        '200':
          description: The imposter, re-read with the stub replaced.
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Imposter'
        '202':
          $ref: '#/components/responses/AcceptedParked'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter, no such stub index, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/WriteTimeout'
    delete:
      operationId: deleteStubAt
      summary: Delete the stub at an index
      description: >
        Terminates: index-addressed, commits as a full `PutImposter` with
        that stub removed. Answers `404` if `stubIndex` is out of range.
      tags: [imposters]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The imposter, re-read with the stub removed.
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Imposter'
        '202':
          $ref: '#/components/responses/AcceptedParked'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter, no such stub index, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
