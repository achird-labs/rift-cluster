  # ---------------------------------------------------------------------
  # ee: fleet request journal (issue #223) — merge-on-read GET, Raft-committed clear
  # generation DELETE (issue #224), vector-cursor `?since=` GET (issue #225). `?match=` is
  # now the only GET case that still proxies verbatim, and the only DELETE case that stays a
  # local-only proxy (#223 review, B3). Both exceptions live here in prose since a RouteKey
  # carries no query.
  # ---------------------------------------------------------------------
  /imposters/{port}/savedRequests:
    parameters:
      - $ref: '#/components/parameters/Port'
    get:
      operationId: listSavedRequests
      summary: List recorded requests for an imposter, merged across the fleet
      description: >
        Without `match`, the cluster front **terminates** this route (issues #223, #225)
        rather than proxying: it merges this node's own writer shard
        with every other roster peer's, pulled live under a 2 s fleet-wide
        budget, and falls back to the last anti-entropy-cached copy of any
        peer that misses it. Answers a **bare JSON array** of recorded
        requests, ordered by each entry's own recorded timestamp (never a
        node-local arrival clock, which would let two nodes disagree about
        the order) — not an envelope. `matchOutcome` survives on every entry
        unchanged.

        `x-rift-next-index` carries an **opaque vector cursor** (issue #225), not an integer:
        a position per writer shard plus the clear generation it was issued under, base64url
        encoded. Round-trip it verbatim; do not parse it. This replaces #223's withheld-header
        convention — #223 withheld the cursor because a scalar index names a position in no
        shard in particular, and the vector token is precisely the value that does mean the
        same thing on every node. Passing it back as `since` resumes the walk gaplessly and
        without duplicates **per shard**, across membership changes (a departed node's position
        freezes; a joining node enters at 0) and across clears (#224 — cleared entries are never
        replayed and the token never regresses).

        `x-rift-truncated: true` when retention evicted entries this reader had not yet seen,
        exactly as upstream means it. Additive-only: never sent as `false`. A **baseline** read
        (no `since` at all) is a snapshot of everything still retained and is therefore never
        truncated — only a reader resuming from a position can have missed something.

        Pages are ordered by recorded timestamp *within* a page. Concatenating pages is not a
        globally sorted stream: a peer that becomes reachable between pages contributes entries
        older than everything already returned, so do not build an append-only "latest requests"
        view by appending pages without re-sorting.

        A `since` value that is neither a token this fleet issued nor a bare `u64` answers
        **400**, never a defaulted position — defaulting would silently replay the whole
        journal or silently skip everything recorded since. A bare `u64` is accepted for the
        upgrade window and read as this node's own shard position (`{this_node: seq}`), which
        is the only thing it can have meant: before #225 a merged read issued no cursor at all,
        so any scalar a client holds came from a proxied per-node read of this node.

        With `match` present, this proxies to the local engine exactly as before #223: it is a
        predicate the merge-on-read path never evaluates at all, so terminating on it would
        silently answer with the *whole* fleet's requests instead of the caller's scoped
        subset, and turn a malformed filter's upstream `400` into a `200` with everything.
        Proxying leaves upstream's own clause parser and its existing error handling in charge,
        and on that path the cursor headers carry upstream's own scalar index rather than a
        vector token.

        `/imposters/{port}/requests` is an alias: `classify` collapses both
        spellings onto the same handler, so the two operations describe
        identical bytes and are kept identical here. So are both spellings under
        `/admin/imposters/{port}/...` (issue #223 review): the alias `classify` already gave
        the imposter listing is extended here too, so a caller cannot get a different answer
        by spelling the path differently.
      tags: [imposters]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/JournalSince'
        - $ref: '#/components/parameters/JournalMatch'
      responses:
        '200':
          description: Recorded requests, oldest first (bare array, not an envelope).
          headers:
            x-rift-next-index:
              $ref: '#/components/headers/XRiftNextIndex'
            x-rift-truncated:
              $ref: '#/components/headers/XRiftTruncated'
            Rift-Cluster-Partial:
              $ref: '#/components/headers/RiftClusterPartial'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecordedRequest'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: clearSavedRequests
      summary: Clear recorded requests for an imposter, converging by consensus
      description: >
        Terminates (issue #223 item 4), and as of issue #224 the two forms below diverge in
        *how* they terminate — both are covered by `classify` regardless, so the front owns
        this route either way; only the mechanism differs.

        **Without `match`**: commits a Raft-replicated clear generation for this port
        (`ControlOp::JournalClearGen`, `space` unset). A clear never deletes an entry directly —
        it raises a counter every reader compares its own entries' stamps against, so the clear
        converges by consensus rather than by a best-effort broadcast a partitioned peer could
        miss forever. Two clears racing from different nodes both take effect (the counter has
        no fixed value to overwrite), and a node that was offline when this committed still
        applies it correctly once it catches up, by replication or by snapshot.
        `Rift-Cluster-Partial` is never stamped on this path — a consensus write is not partial.

        **With `match`** (issue #223 review, B3 — a design decision #224 deliberately left
        alone): the clear stays **local-only**, proxied to the local engine exactly as before
        #223, and never becomes a Raft write. `ControlOp::JournalClearGen` carries a `space`, not
        an arbitrary match predicate, so a scoped filter has nowhere on that op to travel that
        isn't either dropped or misrepresented as a full clear — committing the wrong, wider
        thing would be worse than staying local. `Rift-Cluster-Partial: true` is stamped
        unconditionally on this path, not because a peer was unreachable but because the clear
        itself is knowingly not fleet-wide by design, so a client cannot mistake a scoped, local
        clear for a fleet-complete one.

        Answers the imposter's current state either way. Aliased as
        `DELETE /imposters/{port}/requests`, and — issue #223 review — as both spellings under
        `/admin/imposters/{port}/...` too.
      tags: [imposters]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/JournalMatch'
      responses:
        '200':
          description: Requests cleared; answers the imposter as it now stands.
          headers:
            Rift-Cluster-Partial:
              $ref: '#/components/headers/RiftClusterPartial'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Imposter'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /imposters/{port}/savedRequests/stream:
    parameters:
      - $ref: '#/components/parameters/Port'
    get:
      operationId: streamSavedRequests
      summary: Live tail of recorded requests, merged across the fleet (SSE)
      description: >
        The live sibling of `GET /imposters/{port}/savedRequests`, terminated by the cluster
        front rather than proxied to one node (issue #348). Answers `text/event-stream`.

        **One contract, two read modes.** Every wake re-runs the same merged cursor walk the
        `savedRequests` read runs, from the position this connection holds. So the `id:` line
        after an event is a cursor token in exactly the sense `x-rift-next-index` is, and once a
        burst has drained it is the same token a simultaneous cursor read would answer with.
        Reconnect with `Last-Event-ID` and the walk resumes gaplessly and without duplicates
        **per shard** — the same guarantee, and the same token vocabulary, as `since`.

        **Latency is declared, not hidden.** Entries this node records surface immediately.
        Entries from *peer* shards arrive on the anti-entropy cadence, because a tail that
        fanned out to every peer per event would multiply inter-node traffic by the number of
        attached clients. The `hello` event therefore carries `clusterTailLatencyMs`, the
        interval this fleet actually runs that cadence at, and it is an honest upper bound on
        how late a peer's entry can be.

        **Events.** `hello` first, carrying `engineVersion`, `types` (always `["requests"]`),
        `port`, `clusterTailLatencyMs`, and `cursor` — the position the stream starts from, so a
        client can bootstrap a poll from it. Then `request` events, whose `data` is
        `{port, flowId, request}`, plus `index` **only** for entries this node wrote (a peer's
        seq is a position in another shard and must never be presented back as a scalar
        `since`). `lagged` when retention evicted entries this reader had not reached — same
        meaning as upstream's: reconcile by polling, this stream does not replay. `partial` on
        every transition of the merged read's degraded state, `true` and back to `false`, so a
        peer going unreachable mid-stream is visible rather than silent. `: ping` every 15 s.

        **Divergences from the engine's own stream**, all additive: `hello` gains
        `clusterTailLatencyMs` and `cursor` and omits the engine's scalar `seq` (a merged stream
        has no single bus position); `id:` is the vector cursor token rather than a bus
        sequence number; `index` is withheld for peer entries; and `partial` is new.

        With `match` present this proxies to the local engine unchanged, for the reason
        `GET .../savedRequests` documents: the merge path evaluates no predicates, so
        terminating a predicate-scoped tail would answer with the whole fleet's requests
        instead of the caller's subset.

        Unlike this route, `GET /events` stays proxied per-node and FleetAdmin-gated: its
        payload spans every tenant and is not yet filtered server-side (issue #163 owns that).
        This per-port tail carries one imposter's requests and is authorized as the ordinary
        port-scoped `imposter.read` it always was.
      tags: [imposters]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/JournalMatch'
      responses:
        '200':
          description: >
            An open SSE stream. Ends only when the client disconnects or the node stops.
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  Server-Sent Events framing. Each event is `event:`, an optional `id:` carrying
                  the resumption cursor, and a `data:` JSON line.
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such imposter for this tenant, or owned by another tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /imposters/{port}/requests:
    parameters:
      - $ref: '#/components/parameters/Port'
    get:
      operationId: listRequests
      summary: List matched requests for an imposter, merged across the fleet
      description: >
        The alias spelling of `GET /imposters/{port}/savedRequests` —
        `classify` maps both spellings to the same handler, so this answers
        the identical body and headers. Declared in full rather than by
        reference because a generated client reads each operation
        independently.

        Without `match`, terminates as the fleet merge-on-read `savedRequests` documents in
        full, `?since=` included (issue #225); with `match` present, proxies to the local
        engine, because it is a predicate the merge-on-read path never evaluates. See that
        operation's description for the whole contract, including the opaque vector cursor
        `x-rift-next-index` carries on the merged path.
      tags: [imposters]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/JournalSince'
        - $ref: '#/components/parameters/JournalMatch'
      responses:
        '200':
          description: Matched requests, oldest first (bare array, not an envelope).
          headers:
            x-rift-next-index:
              $ref: '#/components/headers/XRiftNextIndex'
            x-rift-truncated:
              $ref: '#/components/headers/XRiftTruncated'
            Rift-Cluster-Partial:
              $ref: '#/components/headers/RiftClusterPartial'
          content:
            application/json:
