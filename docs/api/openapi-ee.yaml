      summary: Clear saved proxy responses for an imposter, converging by consensus
      description: >
        The cluster front **terminates** this route (issue #226) rather than
        proxying: the clear commits as one Raft op that deletes the fleet's
        exactly-once recording markers, so every signature records afresh on
        every node — a proxied clear could only reach one node's in-process
        store. Recorded *stubs* are imposter config and are deleted through
