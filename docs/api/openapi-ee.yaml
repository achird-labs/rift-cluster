  # ---------------------------------------------------------------------
  # ee: front door route table (issue #131) — no upstream equivalent
  # ---------------------------------------------------------------------
  /front-door/routes:
    put:
      operationId: putFrontDoorRoutes
      summary: Replace the caller's tenant's front-door route table
      description: >
        Terminates: whole-table replace, deterministic and pre-validated
        before commit, so the parsed table itself is what gets stored (no
        post-commit re-read — there is no upstream `/front-door/routes` to
        read from).
      tags: [front-door]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteTable'
      responses:
        '200':
          description: The stored table.
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteTable'
        '202':
          $ref: '#/components/responses/AcceptedParked'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Caller is not bound to the tenant named (`X-Rift-Tenant` or
            default) — indistinguishable from that tenant not existing
            (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/WriteTimeout'
    get:
      operationId: getFrontDoorRoutes
      summary: Read the caller's tenant's front-door route table
      description: >
        Terminates: this front door's only read path — a state-machine
        read, not a mutation, so it never reaches the write classifier or
        the proxy. There is no upstream `/front-door/routes` to fall back
        on.
      tags: [front-door]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: The tenant's route table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteTable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Caller is not bound to the tenant named (`X-Rift-Tenant` or
            default) — indistinguishable from that tenant not existing
            (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /front-door/routes/{routeId}:
    delete:
      operationId: deleteFrontDoorRoute
      summary: Delete one front-door route by id
      description: >
        Terminates: idempotent at the state-machine level, but the admin
        surface still answers `404` for a route id that was never in the
        caller's own tenant's table (captured before the delete commits,
        the same shape as `deleteImposter`).
      tags: [front-door]
      x-rift-origin: ee
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The deleted route.
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '202':
          $ref: '#/components/responses/AcceptedParked'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No route with that id in the caller's tenant's table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/WriteTimeout'

  # ---------------------------------------------------------------------
  # ee: tenancy surface (RFC-002 §5) — no upstream equivalent
  # ---------------------------------------------------------------------
  /admin/tenants:
    post:
      operationId: createTenant
      summary: Create a tenant
      description: >
        Terminates. Fleet-scoped (`ClusterAdmin` / FleetAdmin only) — a
        caller unbound at the fleet scope gets the RFC-002 §8.4 `404`, not
        a `403`, so they cannot learn this route exists for them at all.
      tags: [tenancy]
      x-rift-origin: ee
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantWrite'
      responses:
        '201':
          description: >
            Tenant created; body is empty (`terminate_tenancy` renders no
            body and omits `content-type` here — only principal creation
            returns a body).
          headers:
            Rift-Cluster-Revision:
              $ref: '#/components/headers/RiftClusterRevision'
            Rift-Cluster-Op-Id:
              $ref: '#/components/headers/RiftClusterOpId'
        '400':
          $ref: '#/components/responses/BadData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >
            Caller is not bound to the fleet scope — indistinguishable
            from a route that does not exist for this caller (RFC-002
            §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/WriteTimeout'
    get:
      operationId: listTenants
      summary: List tenants
      description: Terminates. Fleet-scoped (`ClusterAdmin` / FleetAdmin only).
      tags: [tenancy]
      x-rift-origin: ee
      responses:
        '200':
          description: Every tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Caller holds no fleet-scoped binding (RFC-002 §8.4 — not a 403).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: getTenant
      summary: Read one tenant
      description: >
        Scoped to the path tenant and requires `ClusterAdmin`, so a
        `TenantAdmin` of the named tenant is bound but insufficient —
        `403`, not `404`.
      tags: [tenancy]
      x-rift-origin: ee
      responses:
        '200':
          description: The tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
