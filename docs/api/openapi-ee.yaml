                  $ref: '#/components/schemas/Principal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Caller is not bound to the named tenant — indistinguishable
            from the tenant not existing at all (RFC-002 §8.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/tenants/{tenantId}/principals/{principalId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/PrincipalId'
    put:
      operationId: putPrincipal
      summary: Update a principal's display name and disabled state
      description: >
        Terminates. Fleet-scoped (`ClusterAdmin` / FleetAdmin only) —
        principals are a fleet-global namespace, so a tenant admin
        deleting or editing one could destroy a credential another tenant
        relies on. Does not rotate the credential: a principal's id is
        derived from its key, so a new key is a new principal, not an
