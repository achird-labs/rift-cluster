[package]
name = "rift-cluster"
description = "Distributed clustering for Rift Enterprise: control-plane sync, membership, and sharded imposters."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# `rift-ee` is deliberately the ONLY path into the open-source core: it
# re-exports both the crates and the extension seams. Adding a direct
# rift-mock-core / rift-types / rift-http-proxy dependency here would let
# cluster code reach around the facade, so the fence is this dependency list
# rather than a lint.
rift-ee = { path = "../rift-ee" }
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true

hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
rand.workspace = true
parking_lot.workspace = true

openraft.workspace = true
redb.workspace = true
xxhash-rust.workspace = true
prometheus.workspace = true
lazy_static.workspace = true

[dev-dependencies]
# Streaming request bodies, to prove the body cap holds without a declared length.
futures-lite = "2"
# Each openraft storage-suite store and each membership test gets its own temp
# `redb` database file, cleaned up when the guard drops.
tempfile = "3"
# The 3-node integration harness (tests/cluster.rs) drives real nodes directly,
# so it needs tokio in its own right — integration tests do not inherit the
# library's normal dependencies.
tokio.workspace = true
