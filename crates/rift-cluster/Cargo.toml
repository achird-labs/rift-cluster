[package]
name = "rift-cluster"
description = "Distributed clustering for Rift: control-plane sync, membership, and sharded imposters."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# `rift-cluster-base` is deliberately the ONLY path into the open-source core: it
# re-exports both the crates and the extension seams. Adding a direct
# rift-mock-core / rift-types / rift-http-proxy dependency here would let
# cluster code reach around the facade, so the fence is this dependency list
# rather than a lint.
rift-cluster-base = { path = "../rift-cluster-base" }
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true

reqwest.workspace = true
futures-util.workspace = true
base64.workspace = true

hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
rand.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true

openraft.workspace = true
redb.workspace = true
xxhash-rust.workspace = true
prometheus.workspace = true
lazy_static.workspace = true

[dev-dependencies]
# Scratch directories for the redb-backed store tests.
tempfile = "3"
# Streaming request bodies, to prove the body cap holds without a declared length.
futures-lite = "2"
# `proptest` and `tracing-test` were here for the fleet journal alone — the vector
# cursor's round-trip invariants and the shard's warn-once-per-fill-up guard — and
# left with it (D-74, #552). Nothing else in this crate had a use for either.
# The 3-node integration harness (tests/cluster.rs) drives real nodes directly,
# so it needs tokio in its own right — integration tests do not inherit the
# library's normal dependencies.
tokio.workspace = true
