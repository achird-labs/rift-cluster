[package]
name = "rift-cluster"
description = "Distributed clustering for Rift: control-plane sync, membership, and sharded imposters."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# `rift-cluster-base` is deliberately the ONLY path into the open-source core: it
# re-exports both the crates and the extension seams. Adding a direct
# rift-mock-core / rift-types / rift-http-proxy dependency here would let
# cluster code reach around the facade, so the fence is this dependency list
# rather than a lint.
rift-cluster-base = { path = "../rift-cluster-base" }
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true

reqwest.workspace = true
futures-util.workspace = true
base64.workspace = true

hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
rand.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
argon2.workspace = true

openraft.workspace = true
redb.workspace = true
xxhash-rust.workspace = true
prometheus.workspace = true
lazy_static.workspace = true

# The `git+https:`/`git+file:` source (#136) fetches into a scratch working
# directory per pull — a production dependency, not just a test fixture, since
# the fetch itself (not only `provider_tests.rs`) needs one.
tempfile = "3"

# Group-kill for a timed-out `git` subprocess — see `sources::git::kill_group`.
# Unix-only: elsewhere the direct child is killed and its transport helper, if
# any, is left to exit on its own.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# Streaming request bodies, to prove the body cap holds without a declared length.
futures-lite = "2"
# Captures `tracing` output so the journal's warn-once-per-fill-up guard is testable.
# Upstream measured a 29-55% RPS loss when that mechanism regressed (rift #718), so the
# guard is load-bearing rather than cosmetic.
tracing-test = "0.2"
# The 3-node integration harness (tests/cluster.rs) drives real nodes directly,
# so it needs tokio in its own right — integration tests do not inherit the
# library's normal dependencies.
tokio.workspace = true
