openapi: 3.0.3
info:
  title: Reaches Out
  version: 1.0.0
paths:
  /widgets:
    get:
      operationId: listWidgets
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                # Refused, never resolved: fetching it is a second fetch outside the one-fetch rule,
                # and resolving differently on re-import would make drift reports lie (RFC-004 §3.1).
                $ref: 'https://example.invalid/schemas/widget.yaml#/Widget'
