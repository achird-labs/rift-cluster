[package]
name = "rift-cluster-server"
description = "The Rift cluster server binary: the Rift server composed with cluster backends."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# The composition lives in the library so it can be driven from integration
# tests (and, later, the container chaos harness) without spawning a process;
# the binary is a thin caller, exactly as the open-source `rift` binary is.
[lib]
name = "rift_cluster_server"
path = "src/lib.rs"

[[bin]]
name = "rift-cluster-server"
path = "src/main.rs"

[dependencies]
# Same fence as rift-cluster: `rift-cluster-base` is the only path into the open-source
# core, so this crate carries no direct rift-mock-core / rift-http-proxy dep.
rift-cluster-base = { path = "../rift-cluster-base" }
rift-cluster = { path = "../rift-cluster" }

clap = { version = "4.5", features = ["derive", "env"] }
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde.workspace = true
serde_json.workspace = true
# Already a direct dependency of the vendored upstream crates, so the contract embed adds no
# new supply-chain surface — only a parser this crate can reach.
serde_yaml.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
subtle.workspace = true
uuid.workspace = true
tokio-util.workspace = true
arc-swap.workspace = true
# Same fixed hash the ring uses: a node id derived from a name must be identical
# on every node and across versions, which the std hasher does not promise.
xxhash-rust.workspace = true

[dev-dependencies]
tokio.workspace = true
tempfile = "3"
# Enumerates `Terminated`'s variants so the route-parity gate can prove its representative list
# covers every one (issue #184). Dev-only: the derives are `cfg_attr(test, ...)`, so nothing here
# reaches the shipped binary.
strum.workspace = true
# Drives the composed admin API / probe listeners over real HTTP, the way an
# operator, a load balancer and the upstream integration suites all do.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# Reads `rift_cluster_no_principals` straight off the global registry
# `rift_cluster::metrics` registers into — the same technique that crate's own
# tests use, and the reason the workspace pins one `prometheus` version.
prometheus.workspace = true
