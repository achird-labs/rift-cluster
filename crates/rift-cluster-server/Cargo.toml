[package]
name = "rift-cluster-server"
description = "The Rift cluster server binary: the Rift server composed with cluster backends."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# The composition lives in the library so it can be driven from integration
# tests (and, later, the container chaos harness) without spawning a process;
# the binary is a thin caller, exactly as the open-source `rift` binary is.
[lib]
name = "rift_cluster_server"
path = "src/lib.rs"

[[bin]]
name = "rift-cluster-server"
path = "src/main.rs"

[features]
default = []
# The embedded web console (RFC-006 §7, issue #186). **Off by default and it must stay off**: with
# it on, `rust-embed` requires `web/dist/` to exist at compile time, so turning it on by default
# would make every `cargo build` in the tree depend on a `pnpm build` having run first. Only the
# release lane enables it. `scripts/check-console-hermetic.sh` fails CI if that ever changes.
console = ["dep:rust-embed"]

[dependencies]
# Same fence as rift-cluster: `rift-cluster-base` is the only path into the open-source
# core, so this crate carries no direct rift-mock-core / rift-http-proxy dep.
rift-cluster-base = { path = "../rift-cluster-base" }
rift-cluster = { path = "../rift-cluster" }
# The front compiles specs on the accepting node (PUT, deploy, edit-time warnings); the compiler
# crate depends on nothing vendored so this does not breach the facade rule (11-upstream-boundary.md).
rift-cluster-spec = { path = "../rift-cluster-spec" }

clap = { version = "4.5", features = ["derive", "env"] }
# A real dependency again, for a different reason than last time. #335 promoted
# `reqwest` here so the try endpoint could dial a loopback imposter; #344 answered
# the try in-process instead and returned it to dev-only. The `mcp` subcommand
# (#292) now needs a client in the *shipped* binary — it is nothing but an HTTP
# client of a remote admin front — so it comes back, `workspace` as before: the
# workspace pins exactly one `reqwest` configuration, and `rustls-tls` from that
# pin is what lets the MCP server reach an `https` fleet at all.
reqwest.workspace = true
# The MCP server (#292). Pinned in the workspace manifest with `transport-io`
# (stdio) as the only transport, so this process never opens a listening port.
rmcp.workspace = true
schemars.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde.workspace = true
serde_json.workspace = true
# Already a direct dependency of the vendored upstream crates, so the contract embed adds no
# new supply-chain surface — only a parser this crate can reach.
serde_yaml.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
subtle.workspace = true
uuid.workspace = true
tokio-util.workspace = true
arc-swap.workspace = true
# Per-route dispatch counting (issue #368), on the front door's hot path. Same primitive the
# request journal's own per-port counter uses, and non-poisoning: a counter that starts returning
# errors because an unrelated thread panicked would be worse than the count it protects.
parking_lot.workspace = true
# Session-cookie signing (RFC-006 §5.3, issue #185): HMAC-SHA256 over a base64url payload.
hmac.workspace = true
sha2.workspace = true
rand.workspace = true
base64.workspace = true
# Same fixed hash the ring uses: a node id derived from a name must be identical
# on every node and across versions, which the std hasher does not promise.
xxhash-rust.workspace = true
# Optional, and reachable only through the `console` feature above — this is what keeps the embed
# (and its compile-time dependency on `web/dist/`) entirely off the default build graph.
rust-embed = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
tempfile = "3"
# The MCP *client* half, so `tests/mcp_session.rs` can drive a real protocol
# session against the server this crate ships (#292's M1 exit criterion). Dev-only
# on purpose: the binary enables `server` + stdio alone, so shipping this feature
# would add a capability the subcommand has no use for.
rmcp = { workspace = true, features = ["client"] }
# Enumerates `Terminated`'s variants so the route-parity gate can prove its representative list
# covers every one (issue #184). Dev-only: the derives are `cfg_attr(test, ...)`, so nothing here
# reaches the shipped binary.
strum.workspace = true
# `reqwest` also drives the composed admin API / probe listeners over real HTTP
# in tests, the way an operator, a load balancer and the upstream integration
# suites all do. It is not named here: #344 made it dev-only when the try
# endpoint stopped dialling a socket, and #292 made it a real dependency again
# for the MCP client, so `[dependencies]` above already covers the tests.
# Reads `rift_cluster_no_principals` straight off the global registry
# `rift_cluster::metrics` registers into — the same technique that crate's own
# tests use, and the reason the workspace pins one `prometheus` version.
prometheus.workspace = true
