[workspace]
resolver = "2"
members = [
    "crates/rift-cluster-base",
    "crates/rift-cluster",
    "crates/rift-cluster-server",
    # The OpenAPI → imposter-JSON compiler (RFC-004 §3.1, issue #277). A plain
    # workspace member, unlike `rift-lint-wasm` below: it is host-native and
    # dependency-light, so the normal lanes should build and test it.
    "crates/rift-cluster-spec",
    # Container-tier chaos scenarios (issue #11). A workspace member so it is
    # type-checked and linted with everything else; the scenarios themselves are
    # `#[ignore]`d because they need a container runtime, so a plain `cargo test`
    # on a machine without one still passes. A few pure unit tests over the
    # scenarios' own assertion arithmetic do run un-ignored.
    "tests/cluster-chaos",
]
# The vendored open-source Rift is its own workspace; keep it out of ours and
# consume its crates purely as path dependencies (see [workspace.dependencies]).
#
# `crates/rift-lint-wasm` is excluded for a different reason (RFC-006 C5, issue
# #188): it is a `cdylib` that only means anything on `wasm32-unknown-unknown`,
# built by one step in the release lane. `members` here is an explicit list with
# no `default-members` to opt out of, so membership would put `wasm-bindgen` in
# every CI lane's graph and make `cargo build --workspace --all-targets` try to
# link it for the host. It carries its own empty `[workspace]` instead.
exclude = ["vendor/rift", "crates/rift-lint-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Mohsen Zainalpour <zainalpour@gmail.com>"]
repository = "https://github.com/achird-labs/rift-cluster"
rust-version = "1.92"

[workspace.dependencies]
# Open-source Rift, pinned via the vendor/rift submodule. Paths are resolved
# against this workspace root; workspace inheritance inside the vendored crates
# resolves against vendor/rift/Cargo.toml.
rift-types = { path = "vendor/rift/crates/rift-types" }
rift-mock-core = { path = "vendor/rift/crates/rift-mock-core" }
# The server layer (ServerBuilder, metrics server, gateway dispatch) that the
# cluster binary composes instead of forking `main.rs`. Taken without the
# binary-only `mimalloc` default; the feature list mirrors rift-mock-core's
# defaults so both views of the core agree (upstream's feature-propagation
# invariant — a feature default-on in the core reaches nothing through a
# `default-features = false` consumer unless it is forwarded).
rift-http-proxy = { path = "vendor/rift/crates/rift-http-proxy", default-features = false, features = [
    "redis-backend",
    "javascript",
    "quamina-matching",
] }

# Shared third-party deps for cluster crates.
tokio = { version = "1.41", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The published OpenAPI contract is authored as YAML and served as JSON (issue #184). Pinned to the
# same version rift-http-proxy and rift-mock-core already depend on, so the workspace resolves one
# copy and embedding the contract adds no new supply-chain surface.
serde_yaml = "0.9"
# OpenAPI 3.0.x document model for the spec compiler (RFC-004 §3.1, issue #277). 3.0-only by
# construction, which is the property the compiler wants: a 3.1 or Swagger 2.0 document cannot be
# half-parsed into something plausible, it fails the version gate before this crate sees it.
openapiv3 = "2.2"
# `regex::escape` for the spec compiler's literal path segments. Escaping is the mitigation for
# RFC-004 §8's regex-injection item, so it uses the same engine that will match the pattern rather
# than a hand-rolled character class that could disagree with it. Already in the tree transitively.
regex = "1.12"
# `openapiv3` exposes its component tables as `IndexMap`; the spec compiler names that type in a
# signature. Already in the tree transitively, pinned to the same major so one copy resolves.
indexmap = "2"
# Deterministic-generation invariants the compiler must hold over inputs no fixture enumerates:
# regex escaping never widening a pattern, the stub order being a total order, and the synthesis
# seed being stable. Dev-only.
proptest = "1.11"
# Test-only (issue #184). `EnumDiscriminants` + `EnumIter` make the route-parity gate's variant
# coverage compiler-complete: without it, adding a `Terminated` variant forces a `contract_route`
# arm but NOT an entry in the representative list the parity test actually compares, so a new route
# could ship undocumented with every test green. Never a runtime dependency — the derives are
# `cfg_attr(test, ...)` and strum is a dev-dependency only.
strum = { version = "0.26", features = ["derive"] }
# Control-op identity (ADR-001 §4.1): `op_id` for idempotency/dedup across the
# Raft log. v4 minted by the accepting node when the client sends none.
uuid = { version = "1", features = ["v4", "v5", "serde"] }
# Hot-swappable front-door route table (issue #131): the same version
# rift-http-proxy already pins, so the workspace resolves one copy and the
# `Arc<ArcSwap<CompiledRoutes>>` the state machine writes is the exact type
# `bind_front_door` reads.
arc-swap = "1.7"

# Cluster transport. hyper/hyper-util/http-body-util track the versions the
# vendored engine already builds against, so the workspace resolves one copy.
hyper = { version = "1.5", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1"] }
http-body-util = "0.1"
# `CancellationToken` for the admin front's death-observation seam (issue #64),
# mirroring the upstream idiom in `rift-http-proxy::admin_api::server`. `sync`
# (CancellationToken) is unconditional as of 0.7 — there is no such feature to
# request; the crate resolves with default features only.
tokio-util = "0.7"

# Cluster RPC authentication (RFC-001 §11.2): keyed MAC over each request.
# Pinned to the same line the vendored upstream uses (`vendor/rift/Cargo.toml`),
# features included: a second `reqwest` configuration would pull a second TLS
# backend into the binary. The cluster source providers (#136) need their own
# client because upstream's `HttpSource` has no header-injection seam.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Basic/Bearer credential encoding for the git and registry providers. Already
# in the tree transitively; naming it here just makes the use site legal.
base64 = "0.22"

# Group-kill for the timed-out `git` subprocess (#136). Killing only the direct
# child leaves `git-remote-https` alive holding the inherited pipes open, so the
# timeout buys nothing; `kill(-pgid)` is the only way to reach it, and there is
# no std API for it. Unix-only, and already in the tree via tokio.
libc = "0.2"

# The web console's built assets, embedded into the binary behind the default-off `console` feature
# (RFC-006 §7 option D, issue #186). Chosen over `include_dir` for one behaviour: in a debug build it
# reads from disk at runtime, so `cargo run --features console` picks up a `pnpm build` without a
# Rust rebuild. Pinned because a missing-folder *compile* error is load-bearing here — it is what
# stops a release from silently shipping consoleless — and that is derive-macro behaviour, not API.
rust-embed = "8.12"

hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand = "0.8"
parking_lot = "0.12"
# RFC-002 §3.2/§8.2: principal API keys are stored as argon2id hashes, never
# raw — this is the only place that hash is produced or verified.
argon2 = "0.5"

# Control plane (ADR-001): embedded Raft (openraft) over an embedded ACID store
# (redb). `storage-v2` is required to implement the split RaftLogStorage +
# RaftStateMachine traits — without it they are sealed to everything except
# openraft's own deprecated `RaftStorage`. `serde` gives Entry/Vote/SnapshotMeta
# their Serialize/Deserialize impls so they can be persisted.
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
redb = "4"
# Stable, fast hash for rendezvous (HRW) ownership — must be identical across
# nodes and versions, so a fixed algorithm (not the std default hasher) is used.
xxhash-rust = { version = "0.8", features = ["xxh64"] }
# Must stay semver-compatible with the version rift-mock-core declares (0.13):
# `collect_metrics` serves `prometheus::gather()`, the crate's *global default*
# registry, so a second incompatible copy of this crate would give the cluster
# metrics their own registry and they would never appear on /metrics.
prometheus = "0.13"
lazy_static = "1"
