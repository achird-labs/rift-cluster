# A real 3-node RiftCluster cluster, from the published image. No checkout, no
# submodule, no toolchain — this file and Docker are the whole dependency list:
#
#     curl -sSLO https://raw.githubusercontent.com/achird-labs/rift-cluster/master/deploy/compose/cluster.yml
#     docker compose -f cluster.yml up -d
#
# Then, once all three report ready:
#     curl -s localhost:12525/imposters   # admin API on rift-1
#     curl -s localhost:12526/readyz      # probes  on rift-1
#     open http://localhost:12525/console # the web console, on any node
#
# This is the sibling of `docker-compose.yml`, which builds the same topology
# from a checkout. Keep them aligned: `verify-pulled.sh --check` fails if their
# services or published ports drift apart, because a reader who followed
# `deploy/README.md` gets one set of ports whichever file they picked.
#
# Node 1 founds the cluster (`--cluster-init` semantics via --cluster-allow-solo);
# nodes 2 and 3 join through it. That asymmetry is a bootstrap property, not a
# role: once joined, every node is an equal member and any of them can lead.

name: rift-cluster

# Static addresses, because `--cluster-advertise` takes a socket address and not
# a DNS name: it is what peers are told to dial, and it is stored in the
# replicated membership, so it has to be an IP. `--cluster-seeds` DOES accept
# names (it resolves them on every attempt), but seeds and advertise are
# different things and only one of them can be a name today.
networks:
  rift:
    ipam:
      config:
        - subnet: 172.28.7.0/24

x-node: &node
  # Pinned, not `latest`. A file whose meaning changes under the reader is worse
  # than one that is occasionally out of date: "this brought up a working cluster
  # last week" has to stay true of the same bytes. Override deliberately when you
  # want the newest non-prerelease build:
  #
  #     RIFT_CLUSTER_VERSION=latest docker compose -f cluster.yml up -d
  #
  # `:latest` follows the newest non-prerelease tag, so it can never quietly
  # become a release candidate — but it can still change under you, which is the
  # whole reason it is not the default here.
  #
  # No `v`: the release lane publishes `${GITHUB_REF_NAME#v}`, so git tag `v0.1.0`
  # becomes image tag `0.1.0`. `verify-pulled.sh --check` keeps this equal to the
  # workspace version on every PR, so it cannot age past a release.
  image: ghcr.io/achird-labs/rift-cluster-server:${RIFT_CLUSTER_VERSION:-0.1.0}
  # The shared secret authenticates the cluster port. It is inline here because
  # this file is a local demonstration; a real deployment injects it from a
  # secret store (see the Helm chart, or deploy/k8s/statefulset.yaml).
  environment: &node-env
    RIFT_CLUSTER: "true"
    RIFT_CLUSTER_SECRET: "local-development-cluster-secret"
    RIFT_CLUSTER_PROBE_BIND: "0.0.0.0:2526"
    # Deliberately short so a `docker compose stop` demonstrates the drain
    # rather than waiting on it. Production wants more; see the k8s manifest.
    RIFT_CLUSTER_LEAVE_TIMEOUT: "5"
    RIFT_CLUSTER_STATE_DIR: "/var/lib/rift/_cluster"
    MB_DATADIR: "/var/lib/rift/data"
  # Compose sends SIGTERM and then waits this long before SIGKILL. It must
  # exceed RIFT_CLUSTER_LEAVE_TIMEOUT or the drain is cut short and the graceful
  # leave becomes a hard one — the same rule as terminationGracePeriodSeconds.
  stop_grace_period: 15s
  restart: unless-stopped

services:
  rift-1:
    <<: *node
    container_name: rift-1
    hostname: rift-1
    networks:
      rift:
        ipv4_address: 172.28.7.11
    environment:
      <<: *node-env
      # Bind every interface inside the container; advertise the address peers
      # actually dial.
      RIFT_CLUSTER_BIND: "0.0.0.0:4790"
      RIFT_CLUSTER_BIND_PUBLIC_OK: "true"
      RIFT_CLUSTER_ADVERTISE: "172.28.7.11:4790"
      RIFT_CLUSTER_NODE_NAME: "rift-1"
      # No seeds: this node founds the cluster. Without --cluster-allow-solo a
      # seedless node refuses to start rather than silently forming a second
      # cluster beside the real one.
      RIFT_CLUSTER_ALLOW_SOLO: "true"
    ports:
      - "12525:2525"   # admin API (and the console, at /console)
      - "12526:2526"   # probes
      - "19090:9090"   # metrics
    healthcheck: &probe
      test: ["CMD", "rift-cluster-server", "healthcheck", "--url", "http://127.0.0.1:2526/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  rift-2:
    <<: *node
    container_name: rift-2
    hostname: rift-2
    networks:
      rift:
        ipv4_address: 172.28.7.12
    environment:
      <<: *node-env
      RIFT_CLUSTER_BIND: "0.0.0.0:4790"
      RIFT_CLUSTER_BIND_PUBLIC_OK: "true"
      RIFT_CLUSTER_ADVERTISE: "172.28.7.12:4790"
      RIFT_CLUSTER_NODE_NAME: "rift-2"
      RIFT_CLUSTER_SEEDS: "172.28.7.11:4790"
    ports:
      - "22525:2525"
      - "22526:2526"
      - "29090:9090"
    healthcheck: *probe
    # Only that rift-1 is *running* — not that it is ready. The seed join
    # retries with backoff for 30s, so a node that starts a little early joins
    # on a later attempt rather than failing the deployment.
    depends_on:
      rift-1:
        condition: service_started

  rift-3:
    <<: *node
    container_name: rift-3
    hostname: rift-3
    networks:
      rift:
        ipv4_address: 172.28.7.13
    environment:
      <<: *node-env
      RIFT_CLUSTER_BIND: "0.0.0.0:4790"
      RIFT_CLUSTER_BIND_PUBLIC_OK: "true"
      RIFT_CLUSTER_ADVERTISE: "172.28.7.13:4790"
      RIFT_CLUSTER_NODE_NAME: "rift-3"
      RIFT_CLUSTER_SEEDS: "172.28.7.11:4790"
    ports:
      - "32525:2525"
      - "32526:2526"
      - "39090:9090"
    healthcheck: *probe
    depends_on:
      rift-1:
        condition: service_started
