{{- if and .Values.clusterSecret.create (not .Values.clusterSecret.existingSecret) }}
{{- if not .Values.clusterSecret.value }}
{{- fail "clusterSecret.create=true requires clusterSecret.value. A generated-on-install secret would be regenerated by the next `helm upgrade` and break peer authentication fleet-wide, so the chart will not invent one." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secret" (include "rift-cluster.fullname" .) }}
  labels:
    {{- include "rift-cluster.labels" . | nindent 4 }}
type: Opaque
stringData:
  cluster-secret: {{ .Values.clusterSecret.value | quote }}
{{- end }}
{{- if and .Values.adminApiKey.create (not .Values.adminApiKey.existingSecret) }}
{{- if not .Values.adminApiKey.value }}
{{- fail "adminApiKey.create=true requires adminApiKey.value. An empty MB_APIKEY is not an open plane, it is a plane closed behind a credential nobody can present, so the chart will not render one." }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-admin-api-key" (include "rift-cluster.fullname" .) }}
  labels:
    {{- include "rift-cluster.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-api-key: {{ .Values.adminApiKey.value | quote }}
{{- end }}
